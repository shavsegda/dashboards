<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Открыть в VS Code</title>
<style>
  /* Переходник: Todoist не открывает ссылки vscode:// напрямую, поэтому кнопка ведёт сюда, а страница передаёт задачу в Claude в VS Code. Текст задачи лежит после # и на сервер не уходит. */
  :root { --bg: #f6f3ee; --fg: #2b2a28; --muted: #77726b; --accent: #b5543a; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1d1c1a; --fg: #ece8e1; --muted: #a39d94; --accent: #d0704f; }
  }
  :root[data-theme="dark"] { --bg: #1d1c1a; --fg: #ece8e1; --muted: #a39d94; --accent: #d0704f; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.5 Inter, -apple-system, system-ui, sans-serif;
         max-width: 560px; margin: 14vh auto; padding: 0 16px; }
  a.btn { display: inline-block; background: var(--accent); color: #fff; padding: 12px 18px;
          border-radius: 8px; text-decoration: none; font-weight: 600; }
  pre { white-space: pre-wrap; color: var(--muted); font: 14px/1.5 "JetBrains Mono", ui-monospace, monospace; }
</style>
</head>
<body>
  <p>Открываю Claude в VS Code на Маке…</p>
  <p><a class="btn" id="go" href="#">Открыть в VS Code</a></p>
  <p style="color:var(--muted)">Не открылось само — нажми кнопку. На телефоне эта кнопка не работает: там нужна вторая, «Claude на телефоне».</p>
  <pre id="t"></pre>
<script>
  // Текст задачи — после #, его отдаём расширению Claude Code
  var p = "";
  try { p = decodeURIComponent(location.hash.slice(1)); } catch (e) { p = ""; }
  var u = "vscode://anthropic.claude-code/open?prompt=" + encodeURIComponent(p);
  document.getElementById("go").href = u;
  document.getElementById("t").textContent = p;
  if (p) location.href = u;
</script>
</body>
</html>
