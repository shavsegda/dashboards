<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Люди рядом</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Цвета. Каждый — из темы Телеграма, запасное значение — палитра Алексея
   paper/graphite/terracotta. Тема есть — идём за клиентом; темы нет (браузер) —
   страница выглядит как раньше.
   Полупрозрачные оттенки собраны из триплетов --ink-rgb и --alert-rgb: добавить
   альфу к чужому цвету средствами CSS нельзя, поэтому триплеты считает скрипт и
   обновляет по themeChanged. */
:root {
  --paper: #F4F2EC;
  --stone: #E8E5DC;
  --graphite: #1A1A1A;
  --ink-rgb: 26,26,26;
  --graphite-90: rgba(var(--ink-rgb),0.9);
  --graphite-75: rgba(var(--ink-rgb),0.75);
  --graphite-65: rgba(var(--ink-rgb),0.65);
  --graphite-50: rgba(var(--ink-rgb),0.5);
  --graphite-30: rgba(var(--ink-rgb),0.3);
  --graphite-15: rgba(var(--ink-rgb),0.15);
  --graphite-08: rgba(var(--ink-rgb),0.08);
  /* Акцент свой: в теме Телеграма аналога нет — button_color у каждого клиента
     свой и рвёт вид страницы. На тёмном фоне терракота не читается, поэтому для
     тёмной темы ниже задан более светлый оттенок. */
  --terracotta: #B85C38;
  --accent-rgb: 184,92,56;
  --terracotta-tint: rgba(var(--accent-rgb),0.08);
  --alert: var(--tg-theme-destructive_text_color, #B91C1C);
  --alert-rgb: 185,28,28;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}

/* Телеграма нет, а система в тёмной теме: держим страницу тёмной целиком, иначе
   получится светлый лист в тёмном окне. Значения запасные — тема клиента и
   скрипт всегда сильнее. */
@media (prefers-color-scheme: dark) {
  :root {
    --paper: var(--tg-theme-bg_color, #17171A);
    --stone: var(--tg-theme-secondary_bg_color, #202024);
    --graphite: var(--tg-theme-text_color, #F0EEE8);
    --ink-rgb: 240,238,232;
    --terracotta: #E08A63;
    --accent-rgb: 224,138,99;
    --alert: var(--tg-theme-destructive_text_color, #F27A7A);
    --alert-rgb: 242,122,122;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { font-family: var(--font-sans); background: var(--paper); color: var(--graphite); line-height: 1.55; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
/* Высота — стабильная высота окна Телеграма: её ставит скрипт из
   viewportStableHeight. У viewportHeight она меняется во время жестов, и низ
   страницы прыгает под пальцем. */
body { min-height: var(--tg-vh, 100vh); }

/* Сколько вопросов осталось. В разговоре этого не видно — здесь видно */
.progress { position: sticky; top: 0; background: var(--paper); padding: calc(14px + var(--tg-content-safe-area-inset-top, 0px)) 0 10px; z-index: 10; border-bottom: 1px solid var(--graphite-08); }
.progress-track { max-width: 640px; margin: 0 auto; padding: 0 24px; }
.progress-bar { height: 2px; background: var(--graphite-08); overflow: hidden; }
.progress-fill { height: 100%; background: var(--terracotta); transition: width 0.3s ease; width: 0%; }
.progress-text { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--graphite-50); margin-top: 8px; display: flex; justify-content: space-between; }

/* Безопасные зоны Телеграма: без них верх уезжает под вырез, а низ под панель */
main {
  max-width: 640px; margin: 0 auto;
  padding-top: 32px;
  padding-bottom: calc(60px + var(--tg-safe-area-inset-bottom, 0px));
  padding-left: calc(24px + var(--tg-safe-area-inset-left, 0px));
  padding-right: calc(24px + var(--tg-safe-area-inset-right, 0px));
}
h1 { font-size: 32px; font-weight: 500; letter-spacing: -0.025em; line-height: 1.05; margin-bottom: 10px; }
p { margin-bottom: 12px; color: var(--graphite-75); }
.lead { font-size: 17px; line-height: 1.5; color: var(--graphite-75); margin-bottom: 18px; }
.sub { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--terracotta); margin-bottom: 22px; }
.note { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--graphite-50); }

button { background: var(--graphite); color: var(--paper); padding: 14px 28px; border: none; border-radius: 0; font-size: 14px; cursor: pointer; font-family: var(--font-sans); font-weight: 500; letter-spacing: 0.02em; }
button:hover { background: var(--terracotta); }
button.secondary { background: transparent; color: var(--graphite); border: 1px solid var(--graphite-30); padding: 13px 27px; }
button.secondary:hover { background: transparent; color: var(--terracotta); border-color: var(--terracotta); }
button:disabled { background: var(--graphite-30); cursor: progress; }
.actions { margin-top: 26px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

/* Один вопрос на экран. Вторая мысль рядом читалась бы как часть первой */
.q-card { margin: 0 0 8px; }
.q-block { font-family: var(--font-mono); font-size: 11px; color: var(--graphite-50); text-transform: uppercase; letter-spacing: 0.2em; margin-bottom: 6px; }
.q-window { font-family: var(--font-mono); font-size: 11px; color: var(--terracotta); text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 16px; }
.q-text { font-size: 22px; line-height: 1.25; margin-bottom: 14px; font-weight: 500; letter-spacing: -0.015em; }
.q-hint { font-size: 15px; color: var(--graphite-65); margin-bottom: 18px; }

/* Шкала — горизонтальный ряд равными долями. Ни одна опция не крупнее и не
   дальше остальных: середина обязана читаться как середина */
.scale { display: grid; gap: 3px; }
.scale-btn { font-family: var(--font-mono); font-size: 14px; padding: 15px 0; text-align: center; border: 1px solid var(--graphite-15); background: transparent; color: var(--graphite-75); cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
.scale-btn.on { border-color: var(--terracotta); background: var(--terracotta); color: var(--paper); }
.scale-ends { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--graphite-50); margin-top: 9px; }

/* Варианты словами — вертикально и одного размера */
.q-options { display: grid; gap: 8px; }
.q-option { display: flex; align-items: center; padding: 16px 18px; border: 1px solid var(--graphite-15); cursor: pointer; background: transparent; user-select: none; -webkit-tap-highlight-color: transparent; }
.q-option:hover { border-color: var(--terracotta); color: var(--terracotta); }
.q-option.selected { border-color: var(--terracotta); background: var(--terracotta); color: var(--paper); }
.q-option-text { font-size: 15px; flex: 1; }

input[type=text], textarea {
  width: 100%; font-family: var(--font-sans); font-size: 17px; color: var(--graphite);
  background: transparent; border: 1px solid var(--graphite-15); padding: 13px 14px; border-radius: 0;
  -webkit-appearance: none; appearance: none;
}
input:focus, textarea:focus { outline: none; border-color: var(--terracotta); }
textarea { resize: vertical; min-height: 96px; line-height: 1.5; }
.echo { font-family: var(--font-mono); font-size: 14px; color: var(--terracotta); margin-top: 10px; min-height: 20px; }

.banner { border: 1px solid var(--terracotta); background: var(--terracotta-tint); padding: 14px 16px; margin-bottom: 20px; font-size: 14px; }
.banner strong { font-weight: 500; }
.status { margin-top: 14px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--terracotta); min-height: 16px; }
.status.error { color: var(--alert); }
.weather { border-left: 2px solid var(--terracotta); background: var(--terracotta-tint); padding: 14px 16px; margin: 22px 0; font-size: 14px; line-height: 1.5; color: var(--graphite-75); }

.res-h { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--graphite-50); margin: 24px 0 8px; }
.res-card { border: 1px solid var(--graphite-08); }
.res-row { padding: 14px 18px; border-bottom: 1px solid var(--graphite-08); font-size: 15px; line-height: 1.45; }
.res-row:last-child { border-bottom: 0; }

/* Выход из замера — тихой строкой, не кнопкой в один ряд с ответами */
.outs { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--graphite-08); display: flex; gap: 18px; flex-wrap: wrap; }
.outs button { background: transparent; color: var(--graphite-50); border: none; padding: 6px 0; font-size: 13px; text-decoration: underline; font-weight: 400; }
.outs button:hover { background: transparent; color: var(--terracotta); }

@media (max-width: 600px) {
  main { padding-top: 24px; }
  h1 { font-size: 27px; }
  .q-text { font-size: 19px; }
  .scale { gap: 2px; }
  .scale-btn { font-size: 12px; padding: 13px 0; }
}
</style>
</head>
<body>
<header class="progress" id="progressBar" style="display:none;">
  <div class="progress-track">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text"><span id="progressText">Начало</span><span id="progressCount"></span></div>
  </div>
</header>
<main id="app"></main>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
/* ==== ЧИСТАЯ ЛОГИКА: НАЧАЛО ====
   Всё внутри этих границ не трогает DOM и не ходит в сеть.
   Проверки вырезают этот блок и прогоняют функции на выдуманных данных.
   Менять только вместе с проверками. */


// ---- Контракт с базой ----
// Блок — тот же, что писал разговор с ботом. Подпись инструмента бот берёт из
// самого блока (push_state_to_supabase: instrument = block для всего, кроме
// суточной строки). Берём то же: иначе в одной линии окажутся два инструмента,
// и панели покажут разрыв там, где его нет.
var BLOCK = "state_people";
var INSTRUMENT = "state_people";
var PERIOD_DAYS = 7;
var PERIOD_WORD_ACC = "эту неделю";

// ---- Тексты экрана ----
var CARD_TITLE = "Люди рядом";
var CARD_SIZE = "4 вопроса · минута";
var WHAT_IT_GIVES = "Покажет, ощущается ли нехватка людей рядом и была ли на этой неделе живая встреча.";
var WEATHER_TEXT = "Это про чувство, а не про количество людей вокруг. Смысл появляется от недели к неделе.";
var WINDOW_TEXT = "Окно: последние семь дней";
var RESULT_TITLE = "Записал";
var RESULT_SUB = "Одна точка за неделю";
// Заголовки экрана отправки. Разведены сознательно: «Записал» человек имеет
// право увидеть только после ответа сервера, иначе потерянная запись выглядит
// сделанной («мини-аппы-правила.md», часть 3).
var SEND_WAIT_TITLE = "Секунду";
var SEND_WAIT_SUB = "Отправляю замер";
var SEND_FAIL_TITLE = "Запись не ушла";
var SEND_FAIL_SUB = "Ответы на месте";
var EMPTY_TITLE = "Записывать нечего";
var EMPTY_TEXT = "Ни одного ответа в этот раз — записи нет. Так тоже можно.";
var INTRO_EXTRA = "";
var OUTS_HTML = "";


// ---- Один вопрос на экран ----
// Порядок вопросов и вид ответа. Поле `when` — условие показа: вопрос
// показывается только тому, кому он адресован. В разговоре это было ветвлением
// обработчика, здесь — одной функцией, которую видно и можно проверить.
//
//   kind: "scale"   — горизонтальный ряд цифр, равные интервалы
//         "options" — варианты словами, вертикально
//         "num"     — число в границах, разбирается тем же способом, что в боте
//         "money"   — сумма с множителями: «800к», «1,2 млн»
//         "text"    — свободная строка

/** Вопросы, которые этому человеку показываются. */
function visibleSteps(a, f) {
  return STEPS.filter(function (s) { return !s.when || s.when(a || {}, f || {}); });
}

/** Следующий вопрос после этого. Нет такого — значит замер кончился. */
function nextKey(key, a, f) {
  var list = visibleSteps(a, f);
  for (var i = 0; i < list.length; i++) {
    if (list[i].key === key) return i + 1 < list.length ? list[i + 1].key : null;
  }
  return null;
}

function prevKey(key, a, f) {
  var list = visibleSteps(a, f);
  for (var i = 0; i < list.length; i++) {
    if (list[i].key === key) return i > 0 ? list[i - 1].key : null;
  }
  return null;
}

function stepByKey(key) {
  for (var i = 0; i < STEPS.length; i++) if (STEPS[i].key === key) return STEPS[i];
  return null;
}

// ---- Разбор чисел: те же правила, что у бота ----
// Порт `_one_num` из bot.py. «Ноль», «нет», «ничего» — это ноль, а не пусто:
// иначе «движения не было» превращалось бы в отсутствие данных.
function oneNum(text, lo, hi) {
  var t = String(text == null ? "" : text).toLowerCase().replace(/,/g, ".");
  if (/(^|[^а-яa-z0-9_])(н[еио]л[ья]|нет|ничего|не было)([^а-яa-z0-9_]|$)/.test(t) && lo <= 0 && 0 <= hi) return 0;
  var re = /(\d+(?:\.\d+)?)/g, m;
  while ((m = re.exec(t))) {
    var v = parseFloat(m[1]);
    if (isFinite(v) && lo <= v && v <= hi) return v;
  }
  return null;
}

// Порт `_money_num`: суммы люди пишут словами. «800к» и «1,2 млн» — обычный ответ.
function moneyNum(text, lo, hi) {
  var t = String(text == null ? "" : text).toLowerCase().replace(/,/g, ".");
  if (/(^|[^а-яa-z0-9_])(н[еио]л[ья]|нет|ничего|не было)([^а-яa-z0-9_]|$)/.test(t) && lo <= 0 && 0 <= hi) return 0;
  var re = /(\d+(?:\.\d+)?)\s*(млн|миллион[а-я]*|тыс[а-я]*|к(?![а-яa-z0-9_]))?/g, m;
  while ((m = re.exec(t))) {
    var v = parseFloat(m[1]);
    if (!isFinite(v)) continue;
    var suf = m[2] || "";
    if (suf.indexOf("млн") === 0 || suf.indexOf("миллион") === 0) v *= 1000000;
    else if (suf.indexOf("тыс") === 0 || suf === "к") v *= 1000;
    if (lo <= v && v <= hi) return v;
  }
  return null;
}

/** Сумма как факт: «15 000». Без «всего лишь» и без «целых». Порт `_money_sum`. */
function moneySum(v) {
  if (v === null || v === undefined) return "не назвал(а)";
  return String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
}

// ---- Период ----
// Правило «одна точка за период» держится на ЧТЕНИИ: за период берут запись с
// самым поздним completed_at. Страница только добавляет новые строки.
function isoWeekKey(d) {
  var t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  var day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  var y = t.getUTCFullYear();
  var jan1 = Date.UTC(y, 0, 1);
  var week = Math.ceil(((t.getTime() - jan1) / 86400000 + 1) / 7);
  return y + "-W" + (week < 10 ? "0" + week : String(week));
}

function periodKey(iso) {
  var d = new Date(iso);
  if (PERIOD_DAYS <= 1) return d.toISOString().slice(0, 10);
  if (PERIOD_DAYS <= 7) return isoWeekKey(d);
  if (PERIOD_DAYS <= 31) return d.toISOString().slice(0, 7);
  return d.getUTCFullYear() + "-Q" + (Math.floor(d.getUTCMonth() / 3) + 1);
}

function uuidFromBytes(bytes) {
  var b = Array.prototype.slice.call(bytes, 0, 16);
  b[6] = (b[6] & 0x0f) | 0x40;          // версия 4 — «случайный»
  b[8] = (b[8] & 0x3f) | 0x80;          // вариант RFC 4122
  var h = b.map(function (x) { return ("0" + (x & 0xff).toString(16)).slice(-2); }).join("");
  return h.slice(0, 8) + "-" + h.slice(8, 12) + "-" + h.slice(12, 16) + "-" + h.slice(16, 20) + "-" + h.slice(20, 32);
}

/** Номер новой записи. Случайный — чтобы никогда не совпал с уже занятым. */
function newRecordId() {
  try {
    if (window.crypto && typeof window.crypto.randomUUID === "function") {
      return window.crypto.randomUUID();
    }
    if (window.crypto && typeof window.crypto.getRandomValues === "function") {
      return uuidFromBytes(window.crypto.getRandomValues(new Uint8Array(16)));
    }
  } catch (e) {}
  // Запасной путь, если браузер не даёт случайных чисел.
  var b = [];
  for (var i = 0; i < 16; i++) b.push(Math.floor(Math.random() * 256));
  return uuidFromBytes(b);
}

/**
 * Замок на кнопку. Первое нажатие берёт замок, все следующие отбиваются, пока
 * сервер не ответил. Пять нажатий подряд дают одну запись.
 */
function makeSubmitLock() {
  var busy = false;
  return {
    busy: function () { return busy; },
    acquire: function () { if (busy) return false; busy = true; return true; },
    release: function () { busy = false; }
  };
}

/** Разобрать «tg_121202001» в число. Мусор — null, писать некуда. */
function parseUserId(u) {
  var m = /^(?:tg_)?(\d{3,20})$/.exec(String(u == null ? "" : u).trim());
  return m ? m[1] : null;
}

/** Что прочитать из поля ввода. Пусто или мусор — null, а не догадка. */
function readField(s, raw) {
  if (s.kind === "text") {
    var t = String(raw == null ? "" : raw).trim();
    return t ? t : null;
  }
  if (s.kind === "money") return moneyNum(raw, s.lo, s.hi);
  return oneNum(raw, s.lo, s.hi);
}

/** Как мы прочитали то, что человек написал. Показываем сразу, до отправки. */
function echoText(s, raw) {
  if (s.kind === "text") return "";
  var v = readField(s, raw);
  if (v === null || v === undefined) return "";
  return s.kind === "money" ? moneySum(v) : (String(v) + (s.unit ? " " + s.unit : ""));
}

/**
 * Что запомнить о заходе. Лежит в памяти телефона и нужно ровно для одного:
 * сказать человеку, что сдвинулось. В базу отсюда не уходит ничего.
 */
function defaultPrev(a, iso, pk, prev, f) {
  return { completed_at: iso, periodKey: pk, a: JSON.parse(JSON.stringify(a || {})) };
}

/** Добавить точку в список. За период точка одна — значит заменяем, не копим. */
function addPoint(list, entry) {
  var out = (list || []).slice();
  if (out.length && out[0].periodKey === entry.periodKey) out[0] = entry;
  else out.unshift(entry);
  return out.slice(0, 10);
}

/**
 * Прошлый раз — это точка ПРОШЛОГО периода, а не то, что человек ответил минуту
 * назад. За период точка одна и та же: сравнивать её с собой бессмысленно.
 * То же правило у бота — он читает прошлые цифры до записи новых.
 */
function prevPoint(list, nowPk) {
  var older = (list || []).filter(function (e) { return e && e.periodKey !== nowPk; });
  if (!older.length) return null;
  var p = older[0];
  return {
    completed_at: p.completed_at, periodKey: p.periodKey, a: p.a,
    // Списки отмеченного за прошлые периоды — по ним считаются серии.
    history: older.map(function (e) { return e.marked; })
                  .filter(function (x) { return Array.isArray(x); })
  };
}

/** Сколько дней назад — словами. Для строки «с прошлым разом». */
function pluralDays(n) {
  var n10 = n % 10, n100 = n % 100;
  if (n10 === 1 && n100 !== 11) return "день";
  if (n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) return "дня";
  return "дней";
}

function agoText(iso) {
  var d = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);

/** Сколько дней живёт черновик. Срок — от периода замера, а не одно число на
 *  всех: недельному незачем лежать полгода, полугодовому мало недели. */
function draftTtlDays() { return PERIOD_DAYS <= 1 ? 1 : PERIOD_DAYS; }

/** Годен ли черновик: тот же период и не старше срока. Иначе не продолжение. */
function draftFresh(d, nowIso) {
  if (!d || typeof d !== "object") return false;
  if (d.periodKey !== periodKey(nowIso)) return false;
  var age = (new Date(nowIso).getTime() - new Date(d.savedAt).getTime()) / 86400000;
  if (!isFinite(age) || age < 0) return false;
  return age <= draftTtlDays();
}

/** Есть ли в черновике работа, ради которой его поднимать. Набранная, но не
 *  отправленная строка — тоже работа: на ней держится вся свободная строка. */
function draftHasWork(d) {
  if (!d) return false;
  return Object.keys(d.a || {}).length > 0 ||
         Object.keys(d.seen || {}).length > 0 ||
         String(d.draft || "").trim().length > 0;
}

 *  пропущенный: возвращать к нему значит спорить с его решением. */
function firstUnseenKey(a, f, seen) {
  var list = visibleSteps(a, f);
  for (var i = 0; i < list.length; i++) {

/** Сколько вопросов пройдено и сколько всего. Для строки «ты продолжаешь». */

// Ячейка памяти телефона под запись дорожки. Одна на все страницы.

// Предложение, не запрет. Решает человек.
var TRACK_TIRED_MIN = 20;

// Сколько максимум считаем за один замер. Человек отложил телефон на сутки — это
// не сутки дорожки, это пауза.
var TRACK_LEG_CAP_MIN = 15;

/** Запись дорожки из памяти телефона. Мусор и чужая версия — null, не догадка. */
function trackRec(raw) {
  var r;
  try { r = JSON.parse(raw || "null"); } catch (e) { return null; }
  if (!r || typeof r !== "object" || r.v !== 1) return null;
  if (!Array.isArray(r.queue) || !Array.isArray(r.done)) return null;
  if (r.state !== "run" && r.state !== "finish" && r.state !== "stopped") return null;
  return r;
}

/** Замер, который дорожка открывает сейчас. Очередь пуста — null. */
function trackHead(rec) {
  return (rec && rec.queue && rec.queue.length) ? rec.queue[0] : null;
}

/** Идёт ли дорожка прямо сейчас и есть ли куда идти. */
function trackRunning(rec) {
  return !!(rec && rec.state === "run" && trackHead(rec));
}

/** Ждёт ли дорожка именно этот замер. Не его — страница ведёт себя как обычно. */
function trackIsHead(rec, block) {
  var h = trackRunning(rec) ? trackHead(rec) : null;
  return !!(h && h.key === block);
}

/** Сколько замеров позади и сколько ещё в очереди. */
function trackDoneCount(rec) { return (rec && rec.done) ? rec.done.length : 0; }
function trackLeft(rec) { return (rec && rec.queue) ? rec.queue.length : 0; }

/** Время текущего замера, ограниченное сверху: пауза дорожкой не считается. */
function trackLegMs(rec, nowMs) {
  if (!rec || !rec.legAt) return 0;
  var d = Number(nowMs) - Number(rec.legAt);
  if (!isFinite(d) || d < 0) return 0;
  var cap = TRACK_LEG_CAP_MIN * 60000;
  return d > cap ? cap : d;
}

/** Сколько минут дорожка идёт. По замерам, а не по стенным часам. */
function trackElapsedMin(rec) {
  if (!rec) return 0;
  var ms = Number(rec.spentMs);
  if (!isFinite(ms) || ms < 0) ms = 0;
  return Math.round(ms / 60000);
}

/** Начало замера: с этой секунды считается его время. */
function trackTouch(rec, nowMs) {
  var out = JSON.parse(JSON.stringify(rec));
  out.legAt = nowMs;
  return out;
}

/**
 * Замер закончился: голова очереди уходит в пройденное вместе со своими словами.
 * Слова нужны итогу — он сшивает их в один текст. Ответы не переносим: они уже
 * в базе, а второй список ответов однажды уедет в базу как свежий.
 */
function trackLegDone(rec, lines, nowMs) {
  var out = JSON.parse(JSON.stringify(rec));
  var h = out.queue.shift();
  out.spentMs = (Number(out.spentMs) || 0) + trackLegMs(rec, nowMs);
  out.legAt = nowMs;
  out.done.push({ key: h.key, label: h.label, area: h.area,
                  lines: (lines || []).map(function (t) { return String(t); }) });
  if (!out.queue.length) out.state = "finish";
  return out;
}

/**
 * Пора ли предложить остановиться. Не чаще, чем раз в те же двадцать минут:
 * предложение после каждого замера подряд — это уже давление.
 */
function trackOfferStop(rec) {
  if (!trackRunning(rec)) return false;
  var min = trackElapsedMin(rec);
  var was = Number(rec.offeredMin);
  if (!isFinite(was) || was < 0) was = 0;
  return min >= TRACK_TIRED_MIN && min >= was + TRACK_TIRED_MIN;
}

/** Предложение прозвучало, человек решил идти дальше. */
function trackOffered(rec, nowMs) {
  var out = trackTouch(rec, nowMs);
  out.offeredMin = trackElapsedMin(rec);
  return out;
}

/**
 * Дорожка остановлена. Непройденное остаётся в очереди: человек вернётся, когда
 * захочет. `refer` — строка про специалиста, если остановил тяжёлый ответ.

function trackStop(rec, refer) {

}

  if (!t) return;                    // браузер: остаёмся на палитре из CSS
  var root = document.documentElement;
  if (!root || !root.style || !root.style.setProperty) return;

  // Две палитры. Те же значения стоят в CSS: там они запасные для браузера,
  // здесь — на случай, если клиент какого-то цвета не дал.
  var LIGHT = { paper: "#F4F2EC", stone: "#E8E5DC", ink: "#1A1A1A",

    var m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(hex == null ? "" : hex).trim());
    if (!m) return null;
    var h = m[1];

    if (typeof h === "number" && h > 0) set("--tg-vh", h + "px");

  measureHeight();

  } catch (e) {}
}

function clearDraft() {
  try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
}

function loadPoints() {
  try {
    var v = JSON.parse(localStorage.getItem(POINTS_KEY) || "[]");
    return Array.isArray(v) ? v : [];
  } catch (e) { return []; }
}
function savePoints(list) {
  try { localStorage.setItem(POINTS_KEY, JSON.stringify((list || []).slice(0, 10))); } catch (e) {}
}

var POINTS = loadPoints();
var prevSaved = prevPoint(POINTS, periodKey(new Date().toISOString()));

// ---- Состояние экрана ----
// `answers` — ТОЛЬКО этот заход. Ключ появляется здесь, когда человек ответил.
var answers = {};
// Что человек уже прошёл: и отвеченное, и пропущенное. Нужно, чтобы вернуть его
// на первый НЕпройденный вопрос, а не на тот, который он пропустил сознательно.
var seen = {};
var state = { screen: "intro", key: null, sync: "", syncMsg: "", draft: "" };
var lock = makeSubmitLock();
var app = document.getElementById("app");
var knownExisting = flags.filled;
var lastBuilt = null;

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function setStatus(text, isError) {
  var el = document.getElementById("status");
  if (!el) return;
  el.textContent = text || "";
  el.classList.toggle("error", !!isError);
}

// ---- Полоса «сколько осталось» ----
function updateProgress() {
  var bar = document.getElementById("progressBar");
  if (!bar) return;
  if (state.screen !== "step") { bar.style.display = "none"; return; }
  var list = visibleSteps(answers, flags);
  var pos = 0;
  for (var i = 0; i < list.length; i++) if (list[i].key === state.key) pos = i;
  bar.style.display = "block";
  document.getElementById("progressFill").style.width = ((pos / list.length) * 100) + "%";
  document.getElementById("progressText").textContent = CARD_TITLE;
  document.getElementById("progressCount").textContent = (pos + 1) + " / " + list.length;
}

// ---- Экран: что это даст и сколько это займёт ----
function renderIntro() {
  state.screen = "intro";
  state.key = null;
  var banner = knownExisting
    ? '<div class="banner"><strong>Замер за ' + PERIOD_WORD_ACC + ' уже есть.</strong> Можно пройти снова — запишем ещё раз, в линии останется последняя запись.</div>'
    : "";
  // Начатое не прячем. Тихое восстановление хуже явного: человек увидит
  // середину замера и не поймёт, чьи это ответы. Поэтому говорим прямо и рядом
  // же даём выход — начать заново.
  var draft = loadDraft();
  var pr = draft ? draftProgress(draft.a || {}, flags, draft.seen || {}) : null;
  var resume = "";
  if (draft && pr.done >= pr.total) {
    resume = '<div class="banner"><strong>Ответы на месте, а запись не ушла.</strong> ' +
      "Всё, что ты отметил, лежит на телефоне. Можно отправить ещё раз или начать " +
      "заново — тогда прежние ответы сотрутся.</div>";
  } else if (draft) {
    resume = '<div class="banner"><strong>Ты начал этот замер и не закончил.</strong> ' +
      "Ответы на месте: " + pr.done + " из " + pr.total + ". Можно продолжить с того " +
      "вопроса, где остановился, или начать заново — тогда прежние ответы сотрутся.</div>";
  }
  var buttons = draft
    ? '<button id="resumeBtn">' +
        (pr.done >= pr.total ? "Отправить ещё раз" : "Продолжить") + "</button>" +
      '<button class="secondary" id="startBtn">Начать заново</button>'
    : '<button id="startBtn">Начать</button>';
  app.innerHTML =
    "<h1>" + esc(CARD_TITLE) + "</h1>" +
    '<div class="sub">' + esc(CARD_SIZE) + "</div>" +
    resume +
    banner +
    '<p class="lead">' + WHAT_IT_GIVES + "</p>" +
    '<div class="weather">' + WEATHER_TEXT + "</div>" +
    INTRO_EXTRA +
    '<div class="actions">' + buttons + "</div>";
  document.getElementById("startBtn").addEventListener("click", startCard);
  var rb = document.getElementById("resumeBtn");
  if (rb) rb.addEventListener("click", function () { continueCard(draft); });
  updateProgress();
}

function startCard() {
  answers = {};
  seen = {};
  state.draft = "";
  clearDraft();
  state.sync = "";
  state.syncMsg = "";
  var list = visibleSteps(answers, flags);
  if (!list.length) { finish(); return; }
  state.screen = "step";
  state.key = list[0].key;
  renderStep();
}

/**
 * Продолжить начатое. Ответы поднимаются из черновика, открывается первый
 * вопрос, до которого человек не дошёл. Всё пройдено, а запись не ушла — значит
 * спрашивать нечего, надо отправлять.
 */
function continueCard(d) {
  if (!d) { startCard(); return; }
  answers = JSON.parse(JSON.stringify(d.a || {}));
  seen = JSON.parse(JSON.stringify(d.seen || {}));
  state.draft = d.draft || "";
  state.sync = "";
  state.syncMsg = "";
  var nk = firstUnseenKey(answers, flags, seen);
  if (nk === null) { finish(); return; }
  state.screen = "step";
  state.key = nk;
  renderStep();
}

// ---- Экран одного вопроса ----
function renderStep() {
  state.screen = "step";
  var s = stepByKey(state.key);
  var body = "";
  if (s.kind === "scale") body = scaleBody(s);
  else if (s.kind === "options") body = optionsBody(s);
  else body = inputBody(s);

  var back = prevKey(state.key, answers, flags)
    ? '<button class="secondary" id="backStep">Назад</button>'
    : '';
  var skip = s.optional
    ? '<button class="secondary" id="skipStep">' + esc(s.skipLabel || "Пропустить") + "</button>"
    : "";
  var go = (s.kind === "num" || s.kind === "money" || s.kind === "text")
    ? '<button id="goStep">Дальше</button>' : "";

  app.innerHTML =
    '<div class="q-card">' +
      '<div class="q-block">' + esc(CARD_TITLE) + "</div>" +
      '<div class="q-window">' + esc(WINDOW_TEXT) + "</div>" +
      '<div class="q-text">' + esc(s.q) + "</div>" +
      (s.hint ? '<div class="q-hint">' + esc(s.hint) + "</div>" : "") +
      body +
    "</div>" +
    '<div class="actions">' + go + back + skip + "</div>" +
    OUTS_HTML +
    '<div class="status" id="status"></div>';
  bindStep(s);
  updateProgress();
}

/** Ряд цифр. Интервалы равные, ряд горизонтальный, подписи у краёв. */
function scaleBody(s) {
  var cells = "";
  var n = 0;
  for (var v = s.lo; v <= s.hi; v++) {
    cells += '<div class="scale-btn' + (answers[s.key] === v ? " on" : "") +
             '" data-v="' + v + '">' + v + "</div>";
    n++;
  }
  var ends = s.ends
    ? '<div class="scale-ends"><span>' + esc(s.ends[0]) + "</span><span>" + esc(s.ends[1]) + "</span></div>"
    : "";
  return '<div class="scale" style="grid-template-columns: repeat(' + n + ', 1fr)">' + cells + "</div>" + ends;
}

function optionsBody(s) {
  return '<div class="q-options">' + s.options.map(function (o) {
    return '<div class="q-option' + (answers[s.key] === o.v ? " selected" : "") +
           '" data-v="' + esc(String(o.v)) + '"><span class="q-option-text">' +
           esc(o.l) + "</span></div>";
  }).join("") + "</div>";
}

function inputBody(s) {
  var val = answers[s.key] === undefined ? (state.draft || "") : String(answers[s.key]);
  if (s.kind === "text") {
    return '<textarea id="field" maxlength="' + (s.maxlen || 1000) + '" placeholder="' +
           esc(s.placeholder || "") + '">' + esc(val) + "</textarea>" +
           '<div class="echo" id="echo"></div>';
  }
  return '<input type="text" id="field" inputmode="' + (s.kind === "money" ? "text" : "numeric") +
         '" maxlength="40" placeholder="' + esc(s.placeholder || "") + '" value="' + esc(val) + '">' +
         '<div class="echo" id="echo"></div>';
}

function bindStep(s) {
  app.querySelectorAll("[data-v]").forEach(function (el) {
    el.addEventListener("click", function () {
      var raw = el.getAttribute("data-v");
      var v = (s.kind === "scale") ? parseInt(raw, 10) : parseOption(s, raw);
      setAnswer(s.key, v);
      advance();
    });
  });
  var field = document.getElementById("field");
  if (field) {
    field.addEventListener("input", function () {
      showEcho(s, field.value);
      // Набранное, но не отправленное, — тоже работа человека.
      state.draft = field.value;
      saveDraft();
    });
    showEcho(s, field.value);
  }
  var go = document.getElementById("goStep");
  if (go) go.addEventListener("click", function () { submitField(s); });
  var back = document.getElementById("backStep");
  if (back) back.addEventListener("click", goBackStep);
  var skip = document.getElementById("skipStep");
  if (skip) skip.addEventListener("click", function () {
    // Пропуск — законный ответ. Ключ не появляется в `answers`, значит в базу
    // он не уедет: пустое поле не данные.
    delete answers[s.key];
    seen[s.key] = true;
    saveDraft();
    advance();
  });
  bindOuts();
}

/** Значение варианта: у «да/нет» это правда и ложь, у остальных — число. */
function parseOption(s, raw) {
  if (raw === "true") return true;
  if (raw === "false") return false;
  var n = parseFloat(raw);
  return isFinite(n) && String(n) === raw ? n : raw;
}

/** Что человек написал, прочитанное нашими же правилами. Показываем сразу. */
function showEcho(s, raw) {
  var el = document.getElementById("echo");
  if (!el) return;
  el.textContent = echoText(s, raw);
}

function submitField(s) {
  var field = document.getElementById("field");
  var raw = field ? field.value : "";
  var v = readField(s, raw);
  if (v === null || v === undefined) {
    setStatus(s.badHint || "Не понял ответ — напиши цифрой", true);
    return;
  }
  setAnswer(s.key, v);
  state.draft = "";
  advance();
}

function setAnswer(key, v) {
  answers[key] = v;
  seen[key] = true;
  // После КАЖДОГО ответа, не в конце. Иначе выход посреди замера стирает всё.
  saveDraft();
}

function advance() {
  var nk = nextKey(state.key, answers, flags);
  if (nk === null) { finish(); return; }
  state.key = nk;
  state.draft = "";
  renderStep();
}

function goBackStep() {
  var pk = prevKey(state.key, answers, flags);
  if (pk === null) return false;
  state.key = pk;
  renderStep();
  return true;
}

// ---- Отправка ----
async function finish() {
  if (!lock.acquire()) return;
  var built = buildScores(answers, flags);
  lastBuilt = built;

  // Ни одного ответа в этом заходе — записи нет вовсе. Пустая точка хуже
  // отсутствия: она нарисует в линии то, чего не было.
  if (!built.has) {
    lock.release();
    renderEmpty();
    return;
  }

  if (!USER_ID) {
    lock.release();
    state.sync = "error";
    state.syncMsg = "Открой замер из бота — иначе запись некуда положить.";
    renderResult();
    return;
  }

  var completedAt = new Date().toISOString();
  var raw = composeRaw(answers, flags);
  var payload = {
    user_id: Number(USER_ID),
    block: BLOCK,
    instrument: INSTRUMENT,
    scores: built.scores,
    answers: raw ? { raw: raw } : {},
    completed_at: completedAt
  };

  state.sync = "saving";
  state.syncMsg = "Сохраняю…";
  renderResult();

  var okWrite = false;
  try {
    okWrite = await writeRecord(payload);
  } catch (e) { okWrite = false; }

  lock.release();
  if (okWrite) {
    knownExisting = true;
    // Черновик стираем ТОЛЬКО здесь: пока сервер не ответил, он единственная
    // копия ответов человека.
    clearDraft();
    // Память телефона пополняется только ПОСЛЕ ответа сервера. Прошлым разом
    // этот заход станет в следующем периоде, не сейчас.
    var pk = periodKey(completedAt);
    POINTS = addPoint(POINTS, makePrev(answers, completedAt, pk, prevSaved, flags));
    savePoints(POINTS);
    prevSaved = prevPoint(POINTS, periodKey(new Date().toISOString()));
    state.sync = "ok";
    state.syncMsg = "Замер записан.";
  } else {
    state.sync = "error";
    state.syncMsg = "Запись не ушла. Ответы на месте — нажми «Записать ещё раз».";
  }
  // Дорожка ведёт дальше сама: следующий замер открывается сразу, без возврата в
  // список. Экран результата посреди цепочки лишний — слова соберутся в итог.
  if (okWrite && trackAfterSave()) return;
  renderResult();
}

/**
 * Записать замер. Всегда новая строка, номер случайный.
 *
 * Раньше номер считался от человека и периода: повтор за тот же период упирался
 * в «номер занят» (409) и уходил в правку. Ключ страниц умеет ТОЛЬКО вставлять —
 * правка возвращала ноль строк, и человек видел «не удалось сохранить». Значит
 * повтор падал всегда. Ветки правки больше нет: ответ не 2xx — честная ошибка,
 * ответы остаются при человеке. Права ключа не трогаем: user_id берётся из
 * адреса и подделывается, разрешить правку — разрешить менять чужие замеры.
 *
 * Несколько строк за период — нормально. «Одну точку» собирает чтение: за период
 * берут запись с самым поздним completed_at.
 */
async function writeRecord(payload) {
  var r = await fetch(TABLE, {
    method: "POST", headers: sbHeaders(),
    body: JSON.stringify(Object.assign({ id: newRecordId() }, payload))
  });
  return r.status < 300;
}

// ---- Экран результата ----
// Не «записано», а то, что видно из его ответов, и что сдвинулось с прошлого
// раза. Ни балла, ни названия шкалы, ни оценки.
function renderResult() {
  state.screen = "result";
  var lines = resultLines(answers, flags, prevSaved) || [];
  var shifts = shiftLines(answers, flags, prevSaved) || [];
  var syncBlock = state.syncMsg
    ? '<p class="status' + (state.sync === "error" ? " error" : "") + '">' + esc(state.syncMsg) + "</p>"
    : "";
  app.innerHTML =
    "<h1>" + esc(state.sync === "ok" ? RESULT_TITLE
      : (state.sync === "error" ? SEND_FAIL_TITLE : SEND_WAIT_TITLE)) + "</h1>" +
    '<div class="sub">' + esc(state.sync === "ok" ? RESULT_SUB
      : (state.sync === "error" ? SEND_FAIL_SUB : SEND_WAIT_SUB)) + "</div>" +
    '<div class="res-card">' + lines.map(function (t) {
      return '<div class="res-row">' + esc(t) + "</div>";
    }).join("") + "</div>" +
    '<div class="res-h">С прошлым разом</div>' +
    '<div class="res-card">' + shifts.map(function (t) {
      return '<div class="res-row">' + esc(t) + "</div>";
    }).join("") + "</div>" +
    '<div class="weather">' + WEATHER_TEXT + "</div>" +
    syncBlock +
    '<div class="actions">' +
      (state.sync === "error" ? '<button id="retryBtn">Записать ещё раз</button>' : "") +
      '<button class="secondary" id="againBtn">Пройти снова</button>' +
      (tg ? '<button class="secondary" id="closeBtn">Закрыть</button>' : "") +
    "</div>";
  var rt = document.getElementById("retryBtn");
  if (rt) rt.addEventListener("click", function () { finish(); });
  document.getElementById("againBtn").addEventListener("click", startCard);
  var cb = document.getElementById("closeBtn");
  if (cb) cb.addEventListener("click", closeApp);
  updateProgress();
}

/** Ни на один вопрос не ответили. Это тоже нормальный исход. */
function renderEmpty() {
  state.screen = "empty";
  app.innerHTML =
    "<h1>" + esc(EMPTY_TITLE) + "</h1>" +
    '<p class="lead">' + EMPTY_TEXT + "</p>" +
    '<div class="actions">' +
      '<button class="secondary" id="againBtn">Пройти снова</button>' +
      (tg ? '<button class="secondary" id="closeBtn">Закрыть</button>' : "") +
    "</div>";
  document.getElementById("againBtn").addEventListener("click", startCard);
  var cb = document.getElementById("closeBtn");
  if (cb) cb.addEventListener("click", closeApp);
  updateProgress();
}

/**
 * Замер закрыт по просьбе человека. В базу не уходит ничего, и второй раз мы
 * не приглашаем: давить в этом месте вреднее, чем не собрать цифру.
 */
function renderClosed(text) {
  state.screen = "closed";
  answers = {};
  app.innerHTML =
    "<h1>" + esc(CARD_TITLE) + "</h1>" +
    '<p class="lead">' + esc(text) + "</p>" +
    (tg ? '<div class="actions"><button class="secondary" id="closeBtn">Закрыть</button></div>' : "");
  var cb = document.getElementById("closeBtn");
  if (cb) cb.addEventListener("click", closeApp);
  updateProgress();
}

function closeApp() { try { tg.close(); } catch (e) {} }


/** Тихих выходов у этой страницы нет: выйти можно кнопкой назад. */
function bindOuts() {}

/* ==== ДОРОЖКА НА СТРАНИЦЕ: НАЧАЛО ====
 *
 * Что делает эта часть. Замер записан — дорожка решает, что дальше: открыть
 * адрес следующего замера, предложить остановиться или остановиться самой и
 * отдать человека специалисту.
 *
 * Чего она НЕ делает: не трогает замер. Ключи полей, сборка записи, одна точка
 * за период, кнопка назад и подтверждение выхода остаются как были.
 *
 * Блок побайтово одинаков на всех девяти страницах замеров.
 */
var TRACK = trackLoad();

function trackLoad() {
  try { return trackRec(localStorage.getItem(TRACK_KEY)); } catch (e) { return null; }
}

function trackSave(rec) {
  try { localStorage.setItem(TRACK_KEY, JSON.stringify(rec)); } catch (e) {}
  TRACK = rec;
}

/** Открыть адрес. Заменяем страницу, а не копим историю: кнопка назад должна
 *  вести в каталог, а не в уже пройденный замер. */
function trackGo(url) {
  try {
    if (window.location && typeof window.location.replace === "function") {
      window.location.replace(url);
      return;
    }
    window.location.href = url;
  } catch (e) {}
}

/** Наш ли это шаг дорожки. Не наш — страница ведёт себя как обычно. */
function trackMine() { return trackIsHead(TRACK, BLOCK); }

// Время замера считается с открытия страницы, а не с начала дорожки: между
// замерами человек мог закрыть телефон на два дня, и это пауза, а не дорожка.
if (trackMine()) trackSave(trackTouch(TRACK, Date.now()));

// Внутри дорожки человек должен видеть, где он: иначе экран выглядит случайным.
// Одна строка, без счётчиков: счётчик превращает дорожку в долг.
if (trackMine()) {
  INTRO_EXTRA += '<p class="note">Идёт дорожка · этот замер следующий</p>';
}

/**
 * Что делает дорожка после записи. Вернула true — экран забрала себе, и страница
 * свой результат не собирает: посреди цепочки он лишний, слова всех замеров
 * соберутся в один сшитый итог в конце.
 */
function trackAfterSave() {
  if (!trackMine()) return false;
  var said = resultLines(answers, flags, prevSaved) || [];
  var rec = trackLegDone(TRACK, said, Date.now());
  var heavy = trackHeavy(answers, flags, prevSaved);
  if (heavy) {
    trackSave(trackStop(rec, heavy));
    renderTrackRefer(heavy);
    return true;
  }
  if (trackOfferStop(rec)) {
    trackSave(rec);
    renderTrackTired();
    return true;
  }
  trackSave(rec);
  var next = trackHead(rec);
  if (!next) { trackGo(rec.home); return true; }
  trackGo(next.url);
  return true;
}

/**
 * Предложение остановиться около двадцатой минуты. Это предложение, а не запрет:
 * обе кнопки живые, и «Продолжить» ведёт дальше. Причина названа прямо —
 * уставшие ответы менее точны, и это измеренный эффект, а не забота на словах.
 */
function renderTrackTired() {
  var h = trackHead(TRACK);
  app.innerHTML =
    "<h1>Можно остановиться</h1>" +
    '<div class="sub">Дорожка идёт больше двадцати минут</div>' +
    '<p class="lead">Замер записан. Дальше — «' + esc(h ? h.label : "") + '».</p>' +
    '<p class="lead">К двадцатой минуте люди отвечают быстрее, чем читают, и ответы ' +
    "получаются менее точными. Поэтому предлагаю остановиться — но решаешь ты.</p>" +
    '<p class="lead">Остановишься — покажу итог по тому, что уже есть. Дорожка ' +
    "останется на месте, вернуться можно когда угодно.</p>" +
    '<div class="actions">' +
      '<button data-track="go">Продолжить</button>' +
      '<button class="secondary" data-track="stop">Остановиться</button>' +
    "</div>";
  bindTrack();
}

/**
 * Тяжёлый ответ. Дорожка останавливается, и человек идёт к живому специалисту.
 * Ни диагноза, ни толкования, ни «почему это у тебя»: screen and refer, never
 * treat. Остальные замеры подождут — гнать по списку тут вреднее, чем не собрать
 * цифру.
 */
function renderTrackRefer(reason) {
  app.innerHTML =
    "<h1>Дальше не гоню</h1>" +
    '<p class="lead">' + esc(reason) + "</p>" +
    '<p class="lead">Ответ записан. Дорожку останавливаю здесь: остальные замеры ' +
    "подождут, а это — не к форме, а к живому человеку.</p>" +
    '<p class="lead">Если тяжело прямо сейчас — 112 или круглосуточная линия ' +
    "8 800 2000 122.</p>" +
    '<p class="note">Это не диагноз и не толкование: я только заметил и передаю ' +
    "дальше.</p>" +
    '<div class="actions">' +
      '<button class="secondary" data-track="close">Закрыть</button>' +
    "</div>";
  bindTrack();
}

/** Нажатия на экранах дорожки. Ни одного выхода в чат: только свои адреса. */
function bindTrack() {
  app.querySelectorAll("[data-track]").forEach(function (el) {
    el.addEventListener("click", function () {
      var what = el.getAttribute("data-track");
      if (what === "go") {
        var rec = trackOffered(TRACK, Date.now());
        trackSave(rec);
        var next = trackHead(rec);
        trackGo(next ? next.url : rec.home);
        return;
      }
      if (what === "stop") {
        var stopped = trackStop(TRACK);
        trackSave(stopped);
        trackGo(stopped.home);
        return;
      }
      if (tg) { closeApp(); return; }
      trackGo(TRACK && TRACK.home ? TRACK.home : "/kak-ty/app.html");
    });
  });
}
/* ==== ДОРОЖКА НА СТРАНИЦЕ: КОНЕЦ ==== */

// === Старт ===
if (!USER_ID) {
  app.innerHTML =
    "<h1>" + CARD_TITLE + "</h1>" +
    '<p class="lead">Замер открывается из бота — по кнопке в списке. Так он знает, чей это замер.</p>' +
    '<p class="note">Если открыл ссылку из браузера, вернись в Телеграм.</p>';
} else {
  renderIntro();
}

/* ---- Кнопка назад и подтверждение выхода (спека 012) ----
 *
 * Дефект с живого телефона: из страницы некуда вернуться, только закрыть
 * мини-апп. Оба требования записаны в правилах и не были выполнены.
 *
 * Кнопку показываем ТОЛЬКО если есть куда возвращаться: неработающая кнопка
 * хуже отсутствующей. Внутри замера она возвращает на прошлый вопрос, на первом
 * экране — в список. Подтверждение выхода включаем после первого ответа — тому,
 * кто просто заглянул, оно ни к чему; снимаем после результата, потому что
 * работа уже сделана и держать человека незачем.
 */
(function () {
  var t = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (!t) return;
  try {
    if (history.length > 1 && t.BackButton) {
      t.BackButton.onClick(function () {
        if (goBackStep()) return;
        try { history.back(); } catch (e) {}
      });
      t.BackButton.show();
    }
  } catch (e) {}

  var armed = false;
  function arm() {
    if (armed) return;
    armed = true;
    try { t.enableClosingConfirmation(); } catch (e) {}
  }
  function relax() {
    armed = false;
    try { t.disableClosingConfirmation(); } catch (e) {}
  }
  document.addEventListener("click", arm, true);
  document.addEventListener("input", arm, true);

  // Результат показан — держать человека больше не нужно.
  ["renderResult", "renderDone", "showResult", "showDone", "renderClosed", "renderEmpty"].forEach(function (name) {
    var fn = window[name];
    if (typeof fn !== "function") return;
    window[name] = function () { relax(); return fn.apply(this, arguments); };
  });
})();

</script>
