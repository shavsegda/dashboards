<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Страница устарела</title>
<style>
/* Заглушка вместо демо-разбора профиля времени (25.06.2026).
   Файл не удалён специально: ссылку могли отправить в переписке, а 404
   хуже внятной страницы. Баллов и названий шкал здесь физически нет —
   подсчёта в файле не осталось. */
:root { --paper: #F4F2EC; --graphite: #1A1A1A; --terracotta: #B85C38; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  background: var(--paper); color: var(--graphite); line-height: 1.5;
}
main {
  max-width: 460px; margin: 0 auto;
  padding: calc(56px + var(--tg-content-safe-area-inset-top, 0px))
           calc(22px + var(--tg-safe-area-inset-right, 0px))
           calc(44px + var(--tg-safe-area-inset-bottom, 0px))
           calc(22px + var(--tg-safe-area-inset-left, 0px));
}
h1 { font-size: 26px; font-weight: 500; letter-spacing: -0.02em; margin-bottom: 16px; }
p { font-size: 17px; margin-bottom: 12px; }
.quiet { font-size: 15px; color: rgba(26,26,26,0.65); }
a { color: var(--terracotta); }
@media (prefers-color-scheme: dark) {
  :root { --paper: #17171A; --graphite: #F0EEE8; --terracotta: #E08A63; }
  .quiet { color: rgba(240,238,232,0.65); }
}
</style>
</head>
<body>
<main>
  <h1>Страница устарела</h1>
  <p>Это был разовый разбор профиля времени, сделанный один раз в июне 2026 года.</p>
  <p>Замеры теперь живут в боте — кнопка <strong>«Что со мной?»</strong>. Там же видно, что меняется от раза к разу.</p>
  <p class="quiet">Если ты попал сюда по старой ссылке — просто вернись в Телеграм.</p>
</main>
</body>
</html>
