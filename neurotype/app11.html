<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Нейротип</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --paper:#F4F2EC; --graphite:#1A1A1A; --terra:#B85C38;
    --muted:#7A756B; --rule:#E2DED4; --card:#FBFAF7;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--paper);color:var(--graphite);
    font-family:'Inter',-apple-system,system-ui,sans-serif;font-size:17px;line-height:1.5;}
  .wrap{max-width:620px;margin:0 auto;padding:20px 18px 40px;}
  h1{font-size:22px;margin:0 0 6px;font-weight:700;}
  .sub{color:var(--muted);font-size:14px;margin:0 0 18px;}
  .prog{position:sticky;top:0;background:var(--paper);padding:9px 0;margin-bottom:8px;
    font-size:13px;font-weight:600;color:var(--terra);z-index:5;border-bottom:1px solid var(--rule);}
  /* Одно-вопросный экран */
  .qbar{height:6px;background:var(--rule);border-radius:6px;overflow:hidden;margin:4px 0 8px;}
  .qbar>i{display:block;height:100%;background:var(--terra);transition:width .25s;}
  .qmeta{color:var(--muted);font-size:12.5px;margin-bottom:14px;}
  .qintro{background:#FBEEE7;border:1px solid #EBD5C8;border-radius:10px;padding:10px 13px;
    font-size:13px;color:#8A4527;margin-bottom:14px;line-height:1.45;}
  .qbox{background:var(--card);border:1px solid var(--rule);border-radius:14px;
    padding:22px 18px;margin-bottom:14px;}
  .qtext{font-size:19px;font-weight:600;line-height:1.4;margin-bottom:20px;}
  .opts{display:flex;flex-direction:column;gap:9px;}
  .orow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    padding:14px 15px;border:1.5px solid var(--rule);border-radius:11px;background:#fff;
    font-family:inherit;font-size:15.5px;color:var(--graphite);cursor:pointer;transition:.12s;}
  .orow:active{transform:scale(.99);}
  .orow.sel{border-color:var(--terra);background:#FBEEE7;}
  .orow .onum{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rule);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--muted);}
  .orow.sel .onum{border-color:var(--terra);background:var(--terra);color:#fff;}
  .orow .olbl{flex:1;}
  .qnav{margin-top:6px;}
  .qnav .btn{width:auto;padding:11px 18px;}
  .refer{background:#FBEEE7;border:1px solid #EBD5C8;border-radius:12px;padding:13px 15px;
    font-size:13.5px;margin-bottom:20px;color:#8A4527;line-height:1.45;}
  .tsec{margin-bottom:10px;}
  .thead{font-size:19px;font-weight:700;margin:26px 0 3px;}
  .twhat{color:var(--muted);font-size:14px;margin:0 0 12px;}
  .legend{background:var(--card);border:1px solid var(--rule);border-radius:10px;
    padding:9px 12px;font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.5;}
  .part{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.04em;margin:16px 0 8px;}
  .item{background:var(--card);border:1px solid var(--rule);border-radius:12px;
    padding:14px 14px 12px;margin-bottom:10px;}
  .itext{font-size:15.5px;font-weight:500;margin-bottom:11px;line-height:1.35;}
  .scale{display:flex;gap:6px;}
  .scale.vert{flex-direction:column;}
  .scale.vert .opt{flex:0 0 auto;flex-direction:row;justify-content:flex-start;
    gap:10px;padding:11px 13px;text-align:left;}
  .scale.vert .opt .n{text-align:left;}
  .opt{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:9px 2px;border:1.5px solid var(--rule);border-radius:9px;cursor:pointer;
    background:#fff;transition:.1s;}
  .opt:active{transform:scale(.97);}
  .opt.sel{border-color:var(--terra);background:#FBEEE7;}
  .opt .n{font-size:15px;font-weight:700;}
  .opt.sel .n{color:var(--terra);}
  .opt .l{font-size:10px;color:var(--muted);text-align:center;line-height:1.1;}
  .src{color:var(--muted);font-size:12px;margin:14px 0 4px;}
  .btn{width:100%;padding:15px;border-radius:12px;border:none;font-size:16px;font-weight:700;
    font-family:inherit;cursor:pointer;background:var(--terra);color:#fff;margin-top:20px;}
  .btn:disabled{opacity:.4;pointer-events:none;}
  .btn.ghost{background:transparent;border:1.5px solid var(--rule);color:var(--graphite);}
  .center{text-align:center;padding:40px 0;}
  .res-row{padding:14px 0;border-bottom:1px solid var(--rule);}
  .res-row .rn{font-weight:700;display:block;margin-bottom:4px;}
  .res-row .rv{display:block;}
  .res-row .rv b{display:block;font-weight:600;line-height:1.35;}
  .res-row .rv small{display:block;color:var(--muted);font-weight:400;font-size:12.5px;margin-top:2px;}
  .hi{color:#B85C38;} .lo{color:#2E7D32;} .neu{color:var(--muted);}
  .ok{color:#2E7D32;font-weight:600;}
  .nav{display:flex;gap:10px;margin-top:20px;}
  .nav .btn{margin-top:0;}
  .warn{color:#B85C38;font-size:13px;margin-top:10px;min-height:18px;text-align:center;}
  /* Экран-список тестов */
  .hublist{display:flex;flex-direction:column;gap:10px;margin-top:4px;}
  .hubrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 16px;
    border:1.5px solid var(--rule);border-radius:12px;background:#fff;font-family:inherit;cursor:pointer;transition:.12s;}
  .hubrow:active{transform:scale(.99);}
  .hb-l{flex:1;display:flex;flex-direction:column;gap:3px;}
  .hb-l b{font-size:16px;color:var(--graphite);}
  .hb-s{font-size:12.5px;color:var(--muted);}
  .hb-b{flex:0 0 auto;font-size:18px;color:var(--terra);font-weight:700;}
  /* Результат словами: свои ответы и сдвиг с прошлого раза вместо балла */
  .res-h{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;}
  .res-block{margin-bottom:24px;}
  .res-name{font-size:16px;font-weight:700;margin-bottom:6px;}
  .ans-card{border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--card);}
  .ans-row{display:flex;align-items:baseline;gap:14px;padding:12px 15px;border-bottom:1px solid var(--rule);}
  .ans-row:last-child{border-bottom:0;}
  .ans-q{flex:1;font-size:14px;color:var(--muted);line-height:1.4;}
  .ans-a{font-size:14px;font-weight:600;text-align:right;max-width:46%;}
  .sh-row{display:flex;align-items:baseline;justify-content:space-between;gap:14px;
    padding:12px 15px;border-bottom:1px solid var(--rule);}
  .sh-row:last-child{border-bottom:0;}
  .sh-row .rn{font-size:14px;font-weight:600;}
  .shift{font-size:13px;color:var(--terra);text-align:right;}
  .first-point{padding:14px 15px;font-size:14px;color:var(--muted);}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// ---- Telegram ----
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
function uidFromUrl(){try{const u=new URLSearchParams(location.search).get('u');if(u&&u.indexOf('tg_')===0){const n=parseInt(u.slice(3),10);if(!isNaN(n))return n;}}catch(e){}return null;}
const UID = (tg?.initDataUnsafe?.user?.id) || uidFromUrl() || null;
const CLIENT_ID = UID ? ('tg_'+UID) : 'anon';
const STORE_KEY = 'neurotype_'+CLIENT_ID;
const RESULT_KEY = 'neurotype_result_'+CLIENT_ID;
// Ключ облака Telegram (общий на весь бот, поэтому уникальный для блока)
const CLOUD_KEY = 'res_neurotype';

// ---- Supabase ----
const SUPABASE_URL = "https://tsregyrxtmkxrxvpsvot.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_yppYfhMVGsvSrFRxDij81w_7fO-1VSo";
// Пишем в Supabase прямым fetch — надёжнее, чем supabase-js (тот не принимал новый ключ).
async function pushToSupabase(record){
  try{
    await fetch(SUPABASE_URL+'/rest/v1/passport', {
      method:'POST',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,
        'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify(record)
    });
  }catch(e){}
}

// 5-балльная шкала частоты (0..4)
const FREQ = [
  {v:0,l:'Никогда'},{v:1,l:'Редко'},{v:2,l:'Иногда'},{v:3,l:'Часто'},{v:4,l:'Очень часто'}
];
// 4-балльная шкала согласия для AQ (3=точно да … 0=точно нет)
const AGREE_SCALE = [
  {v:3,l:'Точно да'},{v:2,l:'Скорее да'},{v:1,l:'Скорее нет'},{v:0,l:'Точно нет'}
];
// 7-балльная шкала интенсивности для HSPS (подписи только на 1/4/7)
const HSP_SCALE = [
  {v:1,l:'Совсем нет'},{v:2,l:'Чуть-чуть'},{v:3,l:'Немного'},{v:4,l:'Умеренно'},
  {v:5,l:'Заметно'},{v:6,l:'Сильно'},{v:7,l:'Очень сильно'}
];
// 5-балльная шкала согласия TAS-20-R. Подписи — дословно из валидизированного
// русского варианта (Старостина Е.Г. и соавт., 2010): менять их нельзя, иначе
// это уже другой инструмент, а не тот, который проверяли на 298 людях.
const TAS_SCALE = [
  {v:1,l:'Совершенно не согласен'},{v:2,l:'Отчасти не согласен'},
  {v:3,l:'Ни то, ни другое'},{v:4,l:'Отчасти согласен'},
  {v:5,l:'Совершенно согласен'}
];

// ---- Скрины. Встроенные пункты — рабочий перевод, не сертифицированный. ----
const TESTS = [
  {
    key:'adhd', title:'СДВГ', what:'внимание, импульсивность, гиперактивность',
    note:'отвечай про последние 6 месяцев',
    frame:'Это твои ответы про внимание и непоседливость, а не диагноз. Что из этого мешает, а что помогает?',
    lines:[{f:'inattention',l:'Про внимание'},{f:'hyperactivity',l:'Про непоседливость'}],
    // Скрин сработал — ведём к специалисту. Screen and refer, never treat.
    refer:(d)=>!!d.positive,
    src:'ASRS-v1.1 · ВОЗ · рабочий перевод, скрин не диагноз',
    scale:FREQ,
    items:[
      {p:'A', t:'Как часто вам трудно довести проект до конца, когда самое трудное уже позади?'},
      {p:'A', t:'Как часто вам трудно навести порядок в делах, когда задача требует организованности?'},
      {p:'A', t:'Как часто вы забываете о встречах или договорённостях?'},
      {p:'A', t:'Когда задача требует сосредоточенности, как часто вы тянете с началом?'},
      {p:'A', t:'Как часто вы ёрзаете, когда приходится долго сидеть?'},
      {p:'A', t:'Как часто вы чувствуете, будто вас «гонит мотор»?'},
      {p:'B', t:'Как часто вы делаете небрежные ошибки в скучной или трудной работе?'},
      {p:'B', t:'Как часто вам трудно удерживать внимание на скучной или однообразной работе?'},
      {p:'B', t:'Как часто вам трудно вслушиваться в собеседника, даже когда он обращается прямо к вам?'},
      {p:'B', t:'Как часто вы теряете вещи дома или на работе?'},
      {p:'B', t:'Как часто вас отвлекает движение или шум вокруг?'},
      {p:'B', t:'Как часто вы встаёте с места там, где положено сидеть?'},
      {p:'B', t:'Как часто вы чувствуете беспокойство и неусидчивость?'},
      {p:'B', t:'Как часто вам трудно расслабиться, когда есть свободное время?'},
      {p:'B', t:'Как часто вы замечаете, что слишком много говорите?'},
      {p:'B', t:'Как часто вы договариваете фразы за других, не дав им закончить?'},
      {p:'B', t:'Как часто вам трудно дождаться своей очереди?'},
      {p:'B', t:'Как часто вы перебиваете людей, когда они заняты?'}
    ],
    // Скоринг ASRS-v1.1. Часть A (пункты 0..5) — скрин.
    // Пункты 1–3 (idx 0,1,2) в зоне при «Иногда+» (>=2); пункты 4–6 (idx 3,4,5) при «Часто+» (>=3).
    score:(ans)=>{
      let hitsA=0;
      [0,1,2].forEach(i=>{ if(ans[i]!=null && ans[i]>=2) hitsA++; });
      [3,4,5].forEach(i=>{ if(ans[i]!=null && ans[i]>=3) hitsA++; });
      const positive = hitsA>=4;
      // Два симптом-домена (по DSM): невнимательность и гиперактивность/импульсивность, по 9 пунктов.
      // Симптом «есть» = ответ «часто/очень часто» (v>=3).
      const INATT=[0,1,2,3,6,7,8,9,10], HYPER=[4,5,11,12,13,14,15,16,17];
      const cnt=(arr)=>arr.reduce((n,i)=>n+((ans[i]!=null&&ans[i]>=3)?1:0),0);
      const inatt=cnt(INATT), hyper=cnt(HYPER);
      const band = positive
        ? {t:'Скрин положительный — симптомы, совместимые с СДВГ у взрослых → к специалисту', c:'hi'}
        : {t:'Скрин отрицательный по Части A', c:'lo'};
      return {band, nums:`Часть A: ${hitsA}/6 в зоне скрина · невнимательность ${inatt}/9 · гиперактивность ${hyper}/9`,
        data:{partA_hits:hitsA, positive, inattention:inatt, hyperactivity:hyper}};
    }
  },
  {
    key:'autism', title:'Аутистический спектр', what:'соц. навыки, внимание, систематизация, воображение',
    frame:'Это твои ответы про общение и детали, а не диагноз. Где так удобно, а где тяжело?',
    lines:[{f:['subs','соц.навыки'],l:'Про общение'},{f:['subs','переключение'],l:'Про переключение'},
           {f:['subs','детали'],l:'Про детали'},{f:['subs','коммуникация'],l:'Про разговор'},
           {f:['subs','воображение'],l:'Про воображение'}],
    refer:(d)=>!!d.positive,
    src:'AQ-50 · Барон-Коэн, Кембридж · рабочий перевод, скрин не диагноз',
    scale:AGREE_SCALE, numbered:false,
    items:[
      {t:'Я предпочитаю делать что-то вместе с другими, а не в одиночку.'},
      {t:'Я предпочитаю делать одно и то же одним и тем же способом снова и снова.'},
      {t:'Когда я пытаюсь что-то вообразить, мне легко создать образ в голове.'},
      {t:'Я часто так сильно погружаюсь в одно дело, что теряю из виду всё остальное.'},
      {t:'Я часто замечаю тихие звуки, которых не замечают другие.'},
      {t:'Я обычно обращаю внимание на автомобильные номера или похожие наборы символов.'},
      {t:'Мне часто говорят, что я сказал что-то невежливое, хотя мне казалось, что это вежливо.'},
      {t:'Читая историю, я легко представляю, как выглядят персонажи.'},
      {t:'Меня увлекают даты.'},
      {t:'В компании я легко слежу за разговорами сразу нескольких людей.'},
      {t:'Мне легко даются социальные ситуации.'},
      {t:'Я склонен замечать детали, которых не видят другие.'},
      {t:'Я скорее пойду в библиотеку, чем на вечеринку.'},
      {t:'Мне легко сочинять истории.'},
      {t:'Меня больше притягивают люди, чем вещи и предметы.'},
      {t:'У меня бывают очень сильные увлечения, и я расстраиваюсь, если не могу ими заниматься.'},
      {t:'Мне нравится непринуждённая светская болтовня.'},
      {t:'Когда я говорю, другим не всегда легко вставить слово.'},
      {t:'Меня увлекают числа.'},
      {t:'Читая историю, мне трудно понять намерения персонажей.'},
      {t:'Мне не особенно нравится читать художественную литературу.'},
      {t:'Мне трудно заводить новых друзей.'},
      {t:'Я всё время замечаю закономерности в окружающем.'},
      {t:'Я скорее пойду в театр, чем в музей.'},
      {t:'Меня не расстраивает, если мой обычный распорядок нарушается.'},
      {t:'Я часто не знаю, как поддержать разговор.'},
      {t:'Мне легко «читать между строк», когда со мной говорят.'},
      {t:'Обычно я сосредотачиваюсь на общей картине, а не на мелких деталях.'},
      {t:'Я плохо запоминаю телефонные номера.'},
      {t:'Обычно я не замечаю мелких изменений в обстановке или во внешности человека.'},
      {t:'Я понимаю, когда собеседнику становится скучно меня слушать.'},
      {t:'Мне легко делать несколько дел одновременно.'},
      {t:'Разговаривая по телефону, я не всегда понимаю, когда моя очередь говорить.'},
      {t:'Мне нравится делать что-то спонтанно.'},
      {t:'Я часто позже всех понимаю суть шутки.'},
      {t:'Мне легко понять, что человек думает или чувствует, просто по его лицу.'},
      {t:'Если меня прервали, я очень быстро возвращаюсь к прежнему делу.'},
      {t:'Я хорош в непринуждённой светской беседе.'},
      {t:'Мне часто говорят, что я снова и снова возвращаюсь к одной и той же теме.'},
      {t:'В детстве мне нравились игры с другими детьми, где нужно было что-то изображать.'},
      {t:'Мне нравится собирать сведения о категориях вещей (типы машин, птиц, поездов, растений и т. п.).'},
      {t:'Мне трудно представить, каково быть кем-то другим.'},
      {t:'Мне нравится тщательно планировать любые дела, в которых я участвую.'},
      {t:'Мне нравятся общественные мероприятия.'},
      {t:'Мне трудно распознавать намерения людей.'},
      {t:'Новые ситуации вызывают у меня тревогу.'},
      {t:'Мне нравится знакомиться с новыми людьми.'},
      {t:'Я хороший дипломат.'},
      {t:'Я плохо запоминаю дни рождения людей.'},
      {t:'Мне очень легко играть с детьми в игры с воображением и притворством.'}
    ],
    // Скоринг AQ (Baron-Cohen 2001). Значение v: 3=точно да,2=скорее да,1=скорее нет,0=точно нет.
    // «Согласие»-пункты дают балл при «да» (v>=2); остальные — при «нет» (v<=1).
    score:(ans)=>{
      const AGREE=new Set([1,2,4,5,6,7,9,12,13,16,18,19,20,21,22,23,26,33,35,39,41,42,43,45,46]);
      const SUB={
        'соц.навыки':[1,11,13,15,22,36,44,45,47,48],
        'переключение':[2,4,10,16,25,32,34,37,43,46],
        'детали':[5,6,9,12,19,23,28,29,30,49],
        'коммуникация':[7,17,18,26,27,31,33,35,38,39],
        'воображение':[3,8,14,20,21,24,40,41,42,50]
      };
      const pt=(i)=>{ const v=ans[i]; if(v==null) return 0;
        return AGREE.has(i+1) ? (v>=2?1:0) : (v<=1?1:0); };
      let total=0; for(let i=0;i<50;i++) total+=pt(i);
      const subs={}; Object.keys(SUB).forEach(k=>{ subs[k]=SUB[k].reduce((a,ob)=>a+pt(ob-1),0); });
      const positive = total>=32;
      const band = positive
        ? {t:'Выраженные аутистические черты (AQ ≥32) → к специалисту', c:'hi'}
        : (total>=26 ? {t:'Повышенно (26–31) — пограничная зона', c:'mid'}

    // Скоринг EQ (0..59) и SQ-R (60..134). v: 3=точно да,2=скорее да,1=скорее нет,0=точно нет.
    score:(ans)=>{
      const EQ_AGREE=new Set([1,6,19,22,25,26,35,36,37,38,41,42,43,44,52,54,55,57,58,59,60]);
      const EQ_DIS=new Set([4,8,10,11,12,14,15,18,21,27,28,29,32,34,39,46,48,49,50]);
      const SQ_AGREE=new Set([1,2,4,5,7,9,11,12,13,14,16,18,19,20,21,23,25,27,29,30,32,36,38,41,42,43,46,50,53,55,60,61,62,66,68,69,72,74,75]);
      const SQ_DIS=new Set([3,6,8,10,15,17,22,24,26,28,31,33,34,35,37,39,40,44,45,47,48,49,51,52,54,56,57,58,59,63,64,65,67,70,71,73]);
      let eq=0;
      for(let i=0;i<60;i++){ const v=ans[i]; if(v==null) continue; const n=i+1;
        if(EQ_AGREE.has(n)) eq += (v===3?2:(v===2?1:0));
        else if(EQ_DIS.has(n)) eq += (v===0?2:(v===1?1:0)); }
      let sqr=0;
      for(let i=60;i<135;i++){ const v=ans[i]; if(v==null) continue; const n=i-59;
        if(SQ_AGREE.has(n)) sqr += (v===3?2:(v===2?1:0));
        else if(SQ_DIS.has(n)) sqr += (v===0?2:(v===1?1:0)); }
      // Тип мозга (E-S теория): нормируем и берём разницу D.
      const S=(sqr-55.6)/150, E=(eq-44.3)/80, D=(S-E)/2;
      let band;
      if(D< -0.21) band={t:'Крайний тип E — сильный уклон в эмпатию',c:'neu'};
      else if(D< -0.041) band={t:'Тип E — эмпат (эмпатия > систематизация)',c:'neu'};
      else if(D< 0.040) band={t:'Тип B — сбалансированный',c:'neu'};
      else if(D< 0.21) band={t:'Тип S — системщик (систематизация > эмпатия)',c:'neu'};
      else band={t:'Крайний тип S — сильный уклон в систематизацию',c:'neu'};
      return {band, nums:`SQ-R ${sqr}/150 · EQ ${eq}/80`, data:{eq, sqr, D:+D.toFixed(3), type:band.t}};
    }
  },

    ],
    // Ключ TAS-20-R, дословно из той же статьи (с. 32):
    //   ТИЧ — пункты 1, 3, 6, 7, 9, 13, 14 (трудности идентификации чувств);
    //   ТОЧ — пункты 2, 4, 11, 12, 17 (трудности описания чувств другим);
    //   ВОМ — пункты 5, 8, 10, 15, 16, 18, 19, 20 (внешне-ориентированное мышление);
    //   обратные пункты — 4, 5, 10, 18, 19.
    // Разворот обратных считаем как 6 − ответ. В статье напечатано «5 − х», но

    score:(ans)=>{

      // Пункты нумеруем с единицы — как в источнике, чтобы ключ сверялся глазами.
      const val=(n)=>{ const v=ans[n-1]; if(v==null) return 0;
        return REV.indexOf(n)>=0 ? (6-v) : v; };
      const sum=(arr)=>arr.reduce((a,n)=>a+val(n),0);
      const dif=sum(DIF), ddf=sum(DDF), eot=sum(EOT);
      const total=dif+ddf+eot;
      // Пороги суммарного балла — общие для TAS-20: 61 и выше, 52–60, 51 и ниже.

      if(total>=61) band={t:'Назвать чувство словами удаётся редко',c:'hi'};

      else band={t:'Чувства обычно называются',c:'lo'};
      return {band,
        nums:`TAS-20-R: ${total} (20–100) · ТИЧ ${dif}/35 · ТОЧ ${ddf}/25 · ВОМ ${eot}/40`,
        data:{total, dif, ddf, eot, high:total>=61}};
    },
    // Что из этого следует практически. Без баллов, без ярлыка, без «у тебя алекситимия».

    sense:(d)=>{
      if(d.total>=61) return 'По твоим ответам чувство редко находит своё слово. Значит вопрос '
        + '«что ты сейчас чувствуешь» тебе скорее не поможет — и дело не в том, что ты закрытый. '

      if(d.total>=52) return 'По твоим ответам иногда чувство называется, иногда нет. В спокойный день '
        + 'вопрос «что я чувствую» работает, в тяжёлый — упирается в пустоту. Когда упёрся, не ищи слово: '

      return 'По твоим ответам чувство обычно находится и называется. Значит про то, что с тобой '
        + 'происходит, можно говорить прямо — через чувства, без обходных путей через тело и факты.';
    }
  }
];

let answers={};        // {testKey:{i:v}} — ответы, введённые в этой версии
let priorScores={};    // {testKey: scoreObj} — прошлые результаты (для галочек и слияния)
let cur=null;          // {ti,pos} активный тест или null (список)
try{ const s=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');
  if(s.answers) answers=s.answers; if(s.priorScores) priorScores=s.priorScores; if(s.cur) cur=s.cur; }catch(e){}
function save(){ try{localStorage.setItem(STORE_KEY,JSON.stringify({answers,priorScores,cur}));}catch(e){} }

function testFullyAnswered(t){ const a=answers[t.key]||{}; return t.items.every((_,i)=>a[i]!=null); }
function testAnsweredCount(t){ const a=answers[t.key]||{}; return t.items.filter((_,i)=>a[i]!=null).length; }

// Общая картина: свежий результат где отвечено, иначе прошлый (слияние, не затирание).
function combinedScores(){
  const out={};
  TESTS.forEach(t=>{
    if(testFullyAnswered(t)){ const r=t.score(answers[t.key]); out[t.key]={...r.data, nums:r.nums, band:r.band.t, band_c:r.band.c}; }
    else if(priorScores[t.key]){ out[t.key]=priorScores[t.key]; }
  });
  return out;
}

// Что уходит в запись. Только полный разбор: у него есть строка с цифрами.
// Урезанную карту бот присылает адресом, когда полная не влезла, — её в базу
// писать нельзя: бот собирает блок по всем записям, и неполной копией эту
// картину можно только испортить. Галочки в списке она при этом ставит честно.
function pushableScores(){
  const all=combinedScores(), out={};
  Object.keys(all).forEach(k=>{ const s=all[k]; if(s && s.nums) out[k]=s; });
  return out;
}

let pushing=false;   // замок: одна отправка за раз, пять нажатий — одна запись
async function pushCombined(){
  if(pushing) return;
  pushing=true;
  try{
    const scores=pushableScores();
    priorScores=combinedScores();
    if(!Object.keys(scores).length) return;
    const completed_at=new Date().toISOString();
    const record={user_id:UID, block:'neurotype', instrument:'ASRS-v1.1', scores, answers, completed_at};
    await pushToSupabase(record);
    try{ localStorage.setItem(RESULT_KEY, JSON.stringify({scores,answers,completed_at})); }catch(e){}
    try{ localStorage.setItem(RESULT_KEY+'_pushed', completed_at); }catch(e){}
    // Облако Telegram: результаты переживают очистку памяти телефона
    // и подтягиваются при заходе с другого устройства.
    try{
      tg?.CloudStorage?.setItem(CLOUD_KEY, JSON.stringify({scores, completed_at}), ()=>{});
    }catch(e){}
    if(tg&&typeof tg.sendData==='function'){ try{ tg.sendData(JSON.stringify({type:'neurotype',scores})); }catch(e){} }
    save();
  } finally { pushing=false; }
}

function optRow(o, numbered, selected){
  const inner = numbered
    ? `<span class="onum">${o.v}</span><span class="olbl">${o.l||''}</span>`
    : `<span class="olbl">${o.l}</span>`;
  return `<button class="orow ${selected?'sel':''}" data-v="${o.v}">${inner}</button>`;
}

// ===== Результат словами. Ни балла, ни ярлыка =====
// Балл человек читает как приговор, хотя это просто сумма его ответов. Ярлык
// («надёжный», «системщик») — как утверждение о своём характере, а из ответов
// оно не следует. Поэтому человек видит другое: что он сам отметил и куда это
// сдвинулось с прошлого раза. Правила мини-аппов, часть 4; конституция, IV и V.
// В базу подсчёт уходит как раньше — его читает бот, и по нему собирается
// разбор. Меняется только то, что человек читает.
const PREV_KEY = RESULT_KEY+'_prev';
const FIRST_POINT = 'Сравнить пока не с чем — это точка отсчёта.';
const REFER_TEXT = 'В ответах есть то, что стоит обсудить со специалистом. Это не диагноз — это повод сходить.';
let shiftPrev={}, shiftWords={}, shiftRefer={};
try{ const p=JSON.parse(localStorage.getItem(PREV_KEY)||'{}');
  if(p.prev) shiftPrev=p.prev; if(p.words) shiftWords=p.words; if(p.refer) shiftRefer=p.refer; }catch(e){}
function savePrev(){ try{ localStorage.setItem(PREV_KEY,
  JSON.stringify({prev:shiftPrev,words:shiftWords,refer:shiftRefer})); }catch(e){} }

// Значение линии по пути. Нет значения — null, а не догадка.
function lineVal(o,path){
  return (Array.isArray(path)?path:[path]).reduce((x,k)=>(x==null?null:x[k]), o);
}
function lineValues(t,data){ return (t.lines||[]).map(l=>({l:l.l, v:lineVal(data,l.f)})); }

// «Твои ответы» — пункт и выбранный вариант, его собственными словами.
function answerRows(t){
  const a=answers[t.key]||{};
  return t.items.map((it,i)=>{
    const opts=it.opts||t.scale||[];
    const o=opts.find(s=>s.v===a[i]);
    return o ? `<div class="ans-row"><span class="ans-q">${it.t}</span><span class="ans-a">${o.l}</span></div>` : '';
  }).join('');
}

// Сдвиг с прошлого раза — направление словами, без цифр. Прошлого нет — так и
// говорим: сравнить пока не с чем. Без упрёка и без обещаний.
function makeShift(t,data){
  const was=shiftPrev[t.key], now=lineValues(t,data);
  shiftWords[t.key] = was ? now.map(n=>{
    const w=was[n.l];
    return {l:n.l, w:(w==null||n.v==null) ? 'спрашиваем впервые'
      : (n.v>w ? 'выше, чем в прошлый раз'
      : (n.v<w ? 'ниже, чем в прошлый раз' : 'как в прошлый раз'))};
  }) : null;
  const map={}; now.forEach(n=>{ if(n.v!=null) map[n.l]=n.v; });
  shiftPrev[t.key]=map;
  // Скрин сработал — направление к специалисту остаётся. Screen and refer.
  shiftRefer[t.key] = !!(t.refer && t.refer(data));
  savePrev();
}
function shiftBlock(t){
  const words=shiftWords[t.key];
  if(!words||!words.length) return `<div class="first-point">${FIRST_POINT}</div>`;
  return words.map(x=>`<div class="sh-row"><span class="rn">${x.l}</span><span class="shift">${x.w}</span></div>`).join('');
}
function referBlock(t){
  return shiftRefer[t.key] ? `<div class="refer">${REFER_TEXT}</div>` : '';
}

// Что из ответов следует практически — одним абзацем, человеческими словами.
// Есть не у каждого скрина: где практического вывода из ответов не следует,
// честнее промолчать, чем выдумать. Ни балла, ни названия шкалы тут быть не может.
function senseBlock(t){
  if(typeof t.sense!=='function') return '';
  const d=combinedScores()[t.key];
  if(!d) return '';
  const s=t.sense(d);
  return s ? `<div class="refer">${s}</div>` : '';
}

// Экран результата одного теста: рамка, сдвиг, свои ответы.
// Раньше человек после отправки видел только список — самое дорогое место пути
// пропадало. Теперь он читает то, что из его ответов видно.
function renderTestResult(t){
  app.innerHTML=`
    <h1>${t.title}</h1>
    <p class="sub">Ответы записаны и отправлены боту</p>
    <div class="refer">${t.frame}</div>
    ${referBlock(t)}
    ${senseBlock(t)}
    <div class="res-h">С прошлым разом</div>
    <div class="ans-card">${shiftBlock(t)}</div>
    <div class="res-h">Твои ответы</div>
    <div class="ans-card">${answerRows(t)}</div>
    <div class="nav"><button class="btn ghost" id="tolist">← К списку</button></div>`;
  const b=document.getElementById('tolist'); if(b) b.onclick=()=>renderHub();
  window.scrollTo(0,0);
}

function renderHub(msg){
  cur=null; save();
  const rows=TESTS.map((t,idx)=>{
    let status, badge='→';
    // Ярлыка в списке больше нет: «надёжный», «системщик», «высокий» — это
    // утверждения о характере, а из ответов они не следуют.
    if(testFullyAnswered(t)||priorScores[t.key]){ status='ответы записаны'; badge='✓'; }
    else { const c=testAnsweredCount(t); status = c>0 ? ('в процессе · '+c+' из '+t.items.length) : ('не пройден · '+t.items.length+' вопр.'); }
    return `<button class="hubrow" data-ti="${idx}">
      <span class="hb-l"><b>${t.title}</b><span class="hb-s">${status}</span></span>
      <span class="hb-b">${badge}</span></button>`;
  }).join('');
  app.innerHTML=`
    <h1>${PAGE_TITLE}</h1>
    <p class="sub">${PAGE_SUB}</p>
    ${msg?`<div class="refer"><span class="ok">${msg}</span></div>`:''}
    <div class="refer">${PAGE_FRAME}</div>
    <div class="qintro">${PAGE_LEN}</div>
    <div class="hublist">${rows}</div>
    ${Object.keys(combinedScores()).length ? '<button class="btn" id="showres" style="margin-top:16px">📊 Показать результаты</button>' : ''}`;
  const sr=document.getElementById('showres'); if(sr) sr.onclick=()=>renderResults();
  app.querySelectorAll('.hubrow').forEach(el=>el.onclick=()=>{
    const idx=+el.dataset.ti, t=TESTS[idx];
    if(testFullyAnswered(t)||priorScores[t.key]){
      if(!confirm('«'+t.title+'» уже пройден. Пройти заново? Прошлый результат этого теста заменится, остальные не тронутся.')) return;
      answers[t.key]={};
    }
    let p=0; const a=answers[t.key]||{};
    for(let i=0;i<t.items.length;i++){ if(a[i]==null){ p=i; break; } p=i; }
    cur={ti:idx,pos:p}; save(); renderQuestion();
  });
  window.scrollTo(0,0);
}

// Один вопрос активного теста
function renderQuestion(){
  if(!cur){ return renderHub(); }
  const t=TESTS[cur.ti];
  answers[t.key]=answers[t.key]||{};
  if(cur.pos<0) cur.pos=0;
  if(cur.pos>=t.items.length){ return finishTest(t); }
  const it=t.items[cur.pos];
  const numbered=t.numbered!==false;
  const opts=it.opts||t.scale;
  const val=answers[t.key][cur.pos];
  const part= it.p ? (PART_LABEL[it.p]||it.p) : '';
  const intro=(cur.pos===0)?`<div class="qintro">${t.what}${t.note?' · '+t.note:''}</div>`:'';
  app.innerHTML=`
    <div class="qbar"><i style="width:${Math.round(cur.pos/t.items.length*100)}%"></i></div>
    <div class="qmeta">${t.title}${part?' · '+part:''} · вопрос ${cur.pos+1} из ${t.items.length}</div>
    ${intro}
    <div class="qbox"><div class="qtext">${it.t}</div>
      <div class="opts">${opts.map(o=>optRow(o,numbered,val===o.v)).join('')}</div></div>
    <div class="qnav"><button class="btn ghost" id="back">← ${cur.pos===0?'К списку':'Назад'}</button></div>`;
  let locked=false;
  app.querySelectorAll('.orow').forEach(el=>el.onclick=()=>{
    if(locked) return; locked=true;
    answers[t.key][cur.pos]=+el.dataset.v; save();
    app.querySelectorAll('.orow').forEach(o=>o.classList.remove('sel'));
    el.classList.add('sel');
    setTimeout(()=>{ cur.pos++; save(); renderQuestion(); }, 160);
  });
  document.getElementById('back').onclick=()=>{
    if(cur.pos===0){ renderHub(); } else { cur.pos--; save(); renderQuestion(); }
  };
  window.scrollTo(0,0);
}

async function finishTest(t){
  // Активный опросник закрываем СРАЗУ, до отправки. `tg.sendData` закрывает
  // мини-апп — экран результата человек не увидит, и незакрытая метка осталась
  // бы в памяти телефона указывать на последний вопрос. Следующий заход тогда
  // сам доходил до конца опросника и отправлял всё второй раз: владелец
  // 12.08.2026 получил от бота два одинаковых ответа. Отправка идёт только по
  // завершению опросника, а не при открытии.
  cur=null; save();
  app.innerHTML=`<div class="center"><h1>Готово</h1><p class="sub">Сохраняю…</p></div>`;
  const data=t.score(answers[t.key]).data;
  await pushCombined();
  // Сдвиг считаем по прошлому заходу и только потом запоминаем этот.
  makeShift(t,data);
  renderTestResult(t);
}

// Экран результатов (только просмотр)
function renderResults(){
  const scores=combinedScores();
  const rows=TESTS.filter(t=>scores[t.key]).map(t=>`
    <div class="res-block">
      <div class="res-name">${t.title}</div>
      <div class="refer">${t.frame}</div>
      ${referBlock(t)}
      ${senseBlock(t)}
      <div class="res-h">С прошлым разом</div>
      <div class="ans-card">${shiftBlock(t)}</div>
    </div>`).join('');
  app.innerHTML=`
    <h1>${PAGE_TITLE}</h1>
    <p class="sub">${PAGE_SUB}</p>
    <div class="refer">${PAGE_FRAME}</div>
    ${rows||'<p class="sub">Пока ничего не пройдено.</p>'}
    <div class="nav"><button class="btn ghost" id="tolist">← К списку</button></div>`;
  document.getElementById('tolist').onclick=()=>renderHub();
  window.scrollTo(0,0);
}

// ---- Вход ----
let urlResult=null;
try{ const r=new URLSearchParams(location.search).get('r'); if(r) urlResult=JSON.parse(r); }catch(e){}
let savedResult=null;
try{ savedResult=JSON.parse(localStorage.getItem(RESULT_KEY)||'null'); }catch(e){}
if(!savedResult||!savedResult.scores){
  try{ const a=JSON.parse(localStorage.getItem(RESULT_KEY.replace(CLIENT_ID,'anon'))||'null');
    if(a&&a.scores) savedResult=a; }catch(e){}
}
// Сеем прошлые результаты (галочки + слияние).
// Прошлое из адреса подкладываем ВСЕГДА, а не только когда своей памяти нет:
// в памяти телефона бывает один скрин из шести, и раньше он закрывал собой всё,
// что прислал бот. Своё значение сильнее присланного — оно точно полное.
if(urlResult&&urlResult.scores){
  priorScores={...urlResult.scores, ...priorScores};
  save();
}
if(Object.keys(priorScores).length===0){
  if(savedResult&&savedResult.scores) priorScores={...savedResult.scores};
  if(savedResult&&savedResult.answers && Object.keys(answers).length===0) answers={...savedResult.answers};
  save();
}
// Если локально пусто — пробуем поднять из облака Telegram.
try{
  if(Object.keys(priorScores).length===0 && tg?.CloudStorage?.getItem){
    tg.CloudStorage.getItem(CLOUD_KEY, function(err, val){
      if(err || !val) return;
      try{
        const o = JSON.parse(val);
        if(o && o.scores && Object.keys(o.scores).length && Object.keys(priorScores).length===0){
          priorScores = {...o.scores};
          save();
          if(!cur) renderHub('Результаты подтянулись из облака Telegram.');
        }
      }catch(e){}
    });
  }
}catch(e){}

// Вход. Открытие страницы НИКОГДА не отправляет запись: продолжаем опросник
// только там, где остались неотвеченные вопросы. Метка из прошлого захода может
// указывать за последний вопрос — тогда её место в списке, а не в отправке.
function resumable(){
  if(!cur || typeof cur.ti!=='number') return false;
  const t=TESTS[cur.ti];
  return !!t && typeof cur.pos==='number' && cur.pos>=0 && cur.pos<t.items.length;
}
if(resumable()){ renderQuestion(); } else { cur=null; save(); renderHub(); }
</script>
