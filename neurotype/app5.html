<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Нейротип</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --paper:#F4F2EC; --graphite:#1A1A1A; --terra:#B85C38;
    --muted:#7A756B; --rule:#E2DED4; --card:#FBFAF7;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--paper);color:var(--graphite);
    font-family:'Inter',-apple-system,system-ui,sans-serif;font-size:17px;line-height:1.5;}
  .wrap{max-width:620px;margin:0 auto;padding:20px 18px 40px;}
  h1{font-size:22px;margin:0 0 6px;font-weight:700;}
  .sub{color:var(--muted);font-size:14px;margin:0 0 18px;}
  .prog{position:sticky;top:0;background:var(--paper);padding:9px 0;margin-bottom:8px;
    font-size:13px;font-weight:600;color:var(--terra);z-index:5;border-bottom:1px solid var(--rule);}
  /* Одно-вопросный экран */
  .qbar{height:6px;background:var(--rule);border-radius:6px;overflow:hidden;margin:4px 0 8px;}
  .qbar>i{display:block;height:100%;background:var(--terra);transition:width .25s;}
  .qmeta{color:var(--muted);font-size:12.5px;margin-bottom:14px;}
  .qintro{background:#FBEEE7;border:1px solid #EBD5C8;border-radius:10px;padding:10px 13px;
    font-size:13px;color:#8A4527;margin-bottom:14px;line-height:1.45;}
  .qbox{background:var(--card);border:1px solid var(--rule);border-radius:14px;
    padding:22px 18px;margin-bottom:14px;}
  .qtext{font-size:19px;font-weight:600;line-height:1.4;margin-bottom:20px;}
  .opts{display:flex;flex-direction:column;gap:9px;}
  .orow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    padding:14px 15px;border:1.5px solid var(--rule);border-radius:11px;background:#fff;
    font-family:inherit;font-size:15.5px;color:var(--graphite);cursor:pointer;transition:.12s;}
  .orow:active{transform:scale(.99);}
  .orow.sel{border-color:var(--terra);background:#FBEEE7;}
  .orow .onum{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rule);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--muted);}
  .orow.sel .onum{border-color:var(--terra);background:var(--terra);color:#fff;}
  .orow .olbl{flex:1;}
  .qnav{margin-top:6px;}
  .qnav .btn{width:auto;padding:11px 18px;}
  .refer{background:#FBEEE7;border:1px solid #EBD5C8;border-radius:12px;padding:13px 15px;
    font-size:13.5px;margin-bottom:20px;color:#8A4527;line-height:1.45;}
  .tsec{margin-bottom:10px;}
  .thead{font-size:19px;font-weight:700;margin:26px 0 3px;}
  .twhat{color:var(--muted);font-size:14px;margin:0 0 12px;}
  .legend{background:var(--card);border:1px solid var(--rule);border-radius:10px;
    padding:9px 12px;font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.5;}
  .part{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.04em;margin:16px 0 8px;}
  .item{background:var(--card);border:1px solid var(--rule);border-radius:12px;
    padding:14px 14px 12px;margin-bottom:10px;}
  .itext{font-size:15.5px;font-weight:500;margin-bottom:11px;line-height:1.35;}
  .scale{display:flex;gap:6px;}
  .scale.vert{flex-direction:column;}
  .scale.vert .opt{flex:0 0 auto;flex-direction:row;justify-content:flex-start;
    gap:10px;padding:11px 13px;text-align:left;}
  .scale.vert .opt .n{text-align:left;}
  .opt{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:9px 2px;border:1.5px solid var(--rule);border-radius:9px;cursor:pointer;
    background:#fff;transition:.1s;}
  .opt:active{transform:scale(.97);}
  .opt.sel{border-color:var(--terra);background:#FBEEE7;}
  .opt .n{font-size:15px;font-weight:700;}
  .opt.sel .n{color:var(--terra);}
  .opt .l{font-size:10px;color:var(--muted);text-align:center;line-height:1.1;}
  .src{color:var(--muted);font-size:12px;margin:14px 0 4px;}
  .btn{width:100%;padding:15px;border-radius:12px;border:none;font-size:16px;font-weight:700;
    font-family:inherit;cursor:pointer;background:var(--terra);color:#fff;margin-top:20px;}
  .btn:disabled{opacity:.4;pointer-events:none;}
  .btn.ghost{background:transparent;border:1.5px solid var(--rule);color:var(--graphite);}
  .center{text-align:center;padding:40px 0;}
  .res-row{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--rule);}
  .res-row .rn{font-weight:600;flex:0 0 auto;}
  .res-row .rv{text-align:right;}
  .res-row .rv b{display:block;}
  .res-row .rv small{color:var(--muted);font-weight:400;font-size:12.5px;}
  .hi{color:#B85C38;} .lo{color:#2E7D32;} .neu{color:var(--muted);}
  .ok{color:#2E7D32;font-weight:600;}
  .nav{display:flex;gap:10px;margin-top:20px;}
  .nav .btn{margin-top:0;}
  .warn{color:#B85C38;font-size:13px;margin-top:10px;min-height:18px;text-align:center;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// ---- Telegram ----
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
function uidFromUrl(){try{const u=new URLSearchParams(location.search).get('u');if(u&&u.indexOf('tg_')===0){const n=parseInt(u.slice(3),10);if(!isNaN(n))return n;}}catch(e){}return null;}
const UID = (tg?.initDataUnsafe?.user?.id) || uidFromUrl() || null;
const CLIENT_ID = UID ? ('tg_'+UID) : 'anon';
const STORE_KEY = 'neurotype_'+CLIENT_ID;
const RESULT_KEY = 'neurotype_result_'+CLIENT_ID;

// ---- Supabase ----
const SUPABASE_URL = "https://tsregyrxtmkxrxvpsvot.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_yppYfhMVGsvSrFRxDij81w_7fO-1VSo";
// Пишем в Supabase прямым fetch — надёжнее, чем supabase-js (тот не принимал новый ключ).
async function pushToSupabase(record){
  try{
    await fetch(SUPABASE_URL+'/rest/v1/passport', {
      method:'POST',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,
        'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify(record)
    });
  }catch(e){}
}

// 5-балльная шкала частоты (0..4)
const FREQ = [
  {v:0,l:'Никогда'},{v:1,l:'Редко'},{v:2,l:'Иногда'},{v:3,l:'Часто'},{v:4,l:'Очень часто'}
];
// 4-балльная шкала согласия для AQ (3=точно да … 0=точно нет)
const AGREE_SCALE = [
  {v:3,l:'Точно да'},{v:2,l:'Скорее да'},{v:1,l:'Скорее нет'},{v:0,l:'Точно нет'}
];
// 7-балльная шкала интенсивности для HSPS (подписи только на 1/4/7)
const HSP_SCALE = [
  {v:1,l:'Совсем нет'},{v:2,l:''},{v:3,l:''},{v:4,l:'Умеренно'},{v:5,l:''},{v:6,l:''},{v:7,l:'Крайне'}
];

// ---- Скрины. Встроенные пункты — рабочий перевод, не сертифицированный. ----
const TESTS = [
  {
    key:'adhd', title:'СДВГ', what:'внимание, импульсивность, гиперактивность',
    note:'отвечай про последние 6 месяцев',
    src:'ASRS-v1.1 · ВОЗ · рабочий перевод, скрин не диагноз',
    scale:FREQ,
    items:[
      {p:'A', t:'Как часто вам трудно довести проект до конца, когда самое трудное уже позади?'},
      {p:'A', t:'Как часто вам трудно навести порядок в делах, когда задача требует организованности?'},
      {p:'A', t:'Как часто вы забываете о встречах или договорённостях?'},
      {p:'A', t:'Когда задача требует сосредоточенности, как часто вы тянете с началом?'},
      {p:'A', t:'Как часто вы ёрзаете, когда приходится долго сидеть?'},
      {p:'A', t:'Как часто вы чувствуете, будто вас «гонит мотор»?'},
      {p:'B', t:'Как часто вы делаете небрежные ошибки в скучной или трудной работе?'},
      {p:'B', t:'Как часто вам трудно удерживать внимание на скучной или однообразной работе?'},
      {p:'B', t:'Как часто вам трудно вслушиваться в собеседника, даже когда он обращается прямо к вам?'},
      {p:'B', t:'Как часто вы теряете вещи дома или на работе?'},
      {p:'B', t:'Как часто вас отвлекает движение или шум вокруг?'},
      {p:'B', t:'Как часто вы встаёте с места там, где положено сидеть?'},
      {p:'B', t:'Как часто вы чувствуете беспокойство и неусидчивость?'},
      {p:'B', t:'Как часто вам трудно расслабиться, когда есть свободное время?'},
      {p:'B', t:'Как часто вы замечаете, что слишком много говорите?'},
      {p:'B', t:'Как часто вы договариваете фразы за других, не дав им закончить?'},
      {p:'B', t:'Как часто вам трудно дождаться своей очереди?'},
      {p:'B', t:'Как часто вы перебиваете людей, когда они заняты?'}
    ],
    // Скоринг ASRS-v1.1. Часть A (пункты 0..5) — скрин.
    // Пункты 1–3 (idx 0,1,2) в зоне при «Иногда+» (>=2); пункты 4–6 (idx 3,4,5) при «Часто+» (>=3).
    score:(ans)=>{
      let hitsA=0;
      [0,1,2].forEach(i=>{ if(ans[i]!=null && ans[i]>=2) hitsA++; });
      [3,4,5].forEach(i=>{ if(ans[i]!=null && ans[i]>=3) hitsA++; });
      const positive = hitsA>=4;
      let load=0; for(let i=0;i<18;i++){ if(ans[i]!=null && ans[i]>=3) load++; }
      const band = positive
        ? {t:'Скрин положительный — симптомы, совместимые с СДВГ у взрослых → к специалисту', c:'hi'}
        : {t:'Скрин отрицательный по Части A', c:'lo'};
      return {band, nums:`Часть A: ${hitsA}/6 в зоне скрина · часто/очень часто: ${load}/18`,
        data:{partA_hits:hitsA, positive, symptom_load:load}};
    }
  },
  {
    key:'autism', title:'Аутистический спектр', what:'соц. навыки, внимание, систематизация, воображение',
    src:'AQ-50 · Барон-Коэн, Кембридж · рабочий перевод, скрин не диагноз',
    scale:AGREE_SCALE, numbered:false,
    items:[
      {t:'Я предпочитаю делать что-то вместе с другими, а не в одиночку.'},
      {t:'Я предпочитаю делать одно и то же одним и тем же способом снова и снова.'},
      {t:'Когда я пытаюсь что-то вообразить, мне легко создать образ в голове.'},
      {t:'Я часто так сильно погружаюсь в одно дело, что теряю из виду всё остальное.'},
      {t:'Я часто замечаю тихие звуки, которых не замечают другие.'},
      {t:'Я обычно обращаю внимание на автомобильные номера или похожие наборы символов.'},
      {t:'Мне часто говорят, что я сказал что-то невежливое, хотя мне казалось, что это вежливо.'},
      {t:'Читая историю, я легко представляю, как выглядят персонажи.'},
      {t:'Меня увлекают даты.'},
      {t:'В компании я легко слежу за разговорами сразу нескольких людей.'},
      {t:'Мне легко даются социальные ситуации.'},
      {t:'Я склонен замечать детали, которых не видят другие.'},
      {t:'Я скорее пойду в библиотеку, чем на вечеринку.'},
      {t:'Мне легко сочинять истории.'},
      {t:'Меня сильнее тянет к людям, чем к вещам.'},
      {t:'У меня бывают очень сильные увлечения, и я расстраиваюсь, если не могу ими заниматься.'},
      {t:'Мне нравится непринуждённая светская болтовня.'},
      {t:'Когда я говорю, другим не всегда легко вставить слово.'},
      {t:'Меня увлекают числа.'},
      {t:'Читая историю, мне трудно понять намерения персонажей.'},
      {t:'Мне не особенно нравится читать художественную литературу.'},
      {t:'Мне трудно заводить новых друзей.'},
      {t:'Я постоянно замечаю закономерности в вещах.'},
      {t:'Я скорее пойду в театр, чем в музей.'},
      {t:'Меня не расстраивает, если мой обычный распорядок нарушается.'},
      {t:'Я часто не знаю, как поддержать разговор.'},
      {t:'Мне легко «читать между строк», когда со мной говорят.'},
      {t:'Обычно я сосредотачиваюсь на общей картине, а не на мелких деталях.'},
      {t:'Я плохо запоминаю телефонные номера.'},
      {t:'Обычно я не замечаю мелких изменений в обстановке или во внешности человека.'},
      {t:'Я понимаю, когда собеседнику становится скучно меня слушать.'},
      {t:'Мне легко делать несколько дел одновременно.'},
      {t:'Разговаривая по телефону, я не всегда понимаю, когда моя очередь говорить.'},
      {t:'Мне нравится делать что-то спонтанно.'},
      {t:'Я часто позже всех понимаю суть шутки.'},
      {t:'Мне легко понять, что человек думает или чувствует, просто по его лицу.'},
      {t:'Если меня прервали, я очень быстро возвращаюсь к прежнему делу.'},
      {t:'Я хорош в непринуждённой светской беседе.'},
      {t:'Мне часто говорят, что я снова и снова возвращаюсь к одной и той же теме.'},
      {t:'В детстве мне нравились игры с другими детьми, где нужно было что-то изображать.'},
      {t:'Мне нравится собирать сведения о категориях вещей (типы машин, птиц, поездов, растений и т. п.).'},
      {t:'Мне трудно представить, каково быть кем-то другим.'},
      {t:'Мне нравится тщательно планировать любые дела, в которых я участвую.'},
      {t:'Мне нравятся общественные мероприятия.'},
      {t:'Мне трудно распознавать намерения людей.'},
      {t:'Новые ситуации вызывают у меня тревогу.'},
      {t:'Мне нравится знакомиться с новыми людьми.'},
      {t:'Я хороший дипломат.'},
      {t:'Я плохо запоминаю дни рождения людей.'},
      {t:'Мне очень легко играть с детьми в игры с воображением и притворством.'}
    ],
    // Скоринг AQ (Baron-Cohen 2001). Значение v: 3=точно да,2=скорее да,1=скорее нет,0=точно нет.
    // «Согласие»-пункты дают балл при «да» (v>=2); остальные — при «нет» (v<=1).
    score:(ans)=>{
      const AGREE=new Set([1,2,4,5,6,7,9,12,13,16,18,19,20,21,22,23,26,33,35,39,41,42,43,45,46]);
      const SUB={
        'соц.навыки':[1,11,13,15,22,36,44,45,47,48],
        'переключение':[2,4,10,16,25,32,34,37,43,46],
        'детали':[5,6,9,12,19,23,28,29,30,49],
        'коммуникация':[7,17,18,26,27,31,33,35,38,39],
        'воображение':[3,8,14,20,21,24,40,41,42,50]
      };
      const pt=(i)=>{ const v=ans[i]; if(v==null) return 0;
        return AGREE.has(i+1) ? (v>=2?1:0) : (v<=1?1:0); };
      let total=0; for(let i=0;i<50;i++) total+=pt(i);
      const subs={}; Object.keys(SUB).forEach(k=>{ subs[k]=SUB[k].reduce((a,ob)=>a+pt(ob-1),0); });
      const positive = total>=32;
      const band = positive
        ? {t:'Выраженные аутистические черты (AQ ≥32) → к специалисту', c:'hi'}
        : (total>=26 ? {t:'Повышенно (26–31) — пограничная зона', c:'mid'}
                     : {t:'Ниже порога (по скрину АС-диагноз маловероятен)', c:'lo'});
      const subStr=Object.keys(subs).map(k=>k+' '+subs[k]).join(' · ');
      return {band, nums:`AQ: ${total}/50 · `+subStr, data:{total, positive, subs}};
    }
  },
  {
    key:'hsp', title:'Высокая чувствительность', what:'глубина обработки, лёгкая перегрузка от стимулов',
    src:'HSPS · Э. Арон, 1997 · рабочий перевод, скрин не диагноз',
    scale:HSP_SCALE, numbered:true,
    items:[
      {t:'Меня легко перегружает сильный поток ощущений.'},
      {t:'Я замечаю тонкие детали вокруг.'},
      {t:'Настроение других людей передаётся мне.'},
      {t:'Я острее чувствую боль.'},
      {t:'В напряжённые дни мне нужно уединиться — уйти туда, где тихо и никто не трогает.'},
      {t:'Я чувствителен к кофеину.'},
      {t:'Меня легко выбивают яркий свет, сильные запахи, грубая ткань или сирена рядом.'},
      {t:'У меня богатая и сложная внутренняя жизнь.'},
      {t:'Громкий шум мне неприятен.'},
      {t:'Искусство и музыка глубоко меня трогают.'},
      {t:'Иногда нервы так измотаны, что мне надо побыть одному.'},
      {t:'Я добросовестный.'},
      {t:'Я легко вздрагиваю от неожиданности.'},
      {t:'Меня выбивает из колеи, когда надо много успеть за короткое время.'},
      {t:'Когда людям неуютно в помещении, я понимаю, что изменить — свет, рассадку.'},
      {t:'Меня раздражает, когда от меня хотят сразу много дел.'},
      {t:'Я стараюсь не ошибаться и ничего не забывать.'},
      {t:'Я избегаю жестоких фильмов и передач.'},
      {t:'Когда вокруг много всего происходит, я перевозбуждаюсь.'},
      {t:'Сильный голод резко бьёт по мне — сбивает настроение и концентрацию.'},
      {t:'Перемены выбивают меня из колеи.'},
      {t:'Я замечаю и люблю тонкие запахи, вкусы, звуки, искусство.'},
      {t:'Мне неприятно, когда всё наваливается разом.'},
      {t:'Я стараюсь устроить жизнь так, чтобы избегать перегрузок и потрясений.'},
      {t:'Меня беспокоят резкие раздражители — громкий шум, хаос вокруг.'},
      {t:'Когда за мной наблюдают или я соревнуюсь, я так нервничаю, что справляюсь хуже обычного.'},
      {t:'В детстве родители или учителя считали меня чувствительным или застенчивым.'}
    ],
    // Скоринг HSPS (Aron 1997). Пункт «верно про меня» = ответ 5–7. Автор: больше 14 из 27 → вероятно ВЧЛ.
    score:(ans)=>{
      let count=0, sum=0, n=0;
      for(let i=0;i<27;i++){ const v=ans[i]; if(v==null) continue; n++; sum+=v; if(v>=5) count++; }
      const positive = count>14;
      const mean = n ? (sum/n).toFixed(1) : '0';
      const band = positive
        ? {t:'Вероятно высокочувствительный тип (ВЧЛ)', c:'hi'}
        : {t:'Ниже порога ВЧЛ', c:'lo'};
      return {band, nums:`«Верно про меня» (5–7): ${count}/27 · средний балл ${mean}/7`,
        data:{true_count:count, mean:+mean, positive}};
    }
  },
  {

      {p:'SQ', t:'Я не следую какой-то системе, когда убираюсь дома.'},
      {p:'SQ', t:'Мне не нравятся глубокие политические дискуссии.'},
      {p:'SQ', t:'Я не очень скрупулёзен, когда занимаюсь ремонтом или самоделками дома.'},
      {p:'SQ', t:'Мне не понравилось бы планировать бизнес с нуля до запуска.'},
      {p:'SQ', t:'Покупая аудиосистему, я хотел бы знать её точные технические характеристики.'},
      {p:'SQ', t:'Я склонен хранить вещи, которые другие выбросили бы, на случай, если они пригодятся в будущем.'},
      {p:'SQ', t:'Я избегаю ситуаций, которые не могу контролировать.'},
      {p:'SQ', t:'Мне неважно знать названия растений, которые я вижу.'},
      {p:'SQ', t:'Слушая прогноз погоды, я не очень интересуюсь метеорологическими закономерностями.'},
      {p:'SQ', t:'Меня не беспокоит, если вещи в доме лежат не на своих местах.'},
      {p:'SQ', t:'В математике меня увлекают правила и закономерности, управляющие числами.'},
      {p:'SQ', t:'Мне трудно ориентироваться в новом городе.'},
      {p:'SQ', t:'Я мог бы по памяти перечислить свои любимые 10 книг с названиями и авторами.'},
      {p:'SQ', t:'Читая газету, я обращаю внимание на таблицы — футбольные турнирные таблицы или биржевые индексы.'},
      {p:'SQ', t:'Находясь в самолёте, я не думаю об аэродинамике.'},
      {p:'SQ', t:'Я не веду тщательный учёт своих домашних счетов.'},
      {p:'SQ', t:'Когда у меня много покупок, я люблю спланировать, в какие магазины и в каком порядке зайти.'},
      {p:'SQ', t:'Когда я готовлю, я не думаю о том, как именно разные способы и ингредиенты влияют на результат.'},
      {p:'SQ', t:'Слушая музыку, я всегда замечаю, как она построена.'},
      {p:'SQ', t:'Я мог бы по памяти составить список своих любимых 10 песен с названиями и исполнителями.'}
    ],
    // Скоринг EQ (0..59) и SQ-R (60..134). v: 3=точно да,2=скорее да,1=скорее нет,0=точно нет.
    score:(ans)=>{
      const EQ_AGREE=new Set([1,6,19,22,25,26,35,36,37,38,41,42,43,44,52,54,55,57,58,59,60]);
      const EQ_DIS=new Set([4,8,10,11,12,14,15,18,21,27,28,29,32,34,39,46,48,49,50]);
      const SQ_AGREE=new Set([1,2,4,5,7,9,11,12,13,14,16,18,19,20,21,23,25,27,29,30,32,36,38,41,42,43,46,50,53,55,60,61,62,66,68,69,72,74,75]);
      const SQ_DIS=new Set([3,6,8,10,15,17,22,24,26,28,31,33,34,35,37,39,40,44,45,47,48,49,51,52,54,56,57,58,59,63,64,65,67,70,71,73]);
      let eq=0;
      for(let i=0;i<60;i++){ const v=ans[i]; if(v==null) continue; const n=i+1;
        if(EQ_AGREE.has(n)) eq += (v===3?2:(v===2?1:0));
        else if(EQ_DIS.has(n)) eq += (v===0?2:(v===1?1:0)); }
      let sqr=0;
      for(let i=60;i<135;i++){ const v=ans[i]; if(v==null) continue; const n=i-59;
        if(SQ_AGREE.has(n)) sqr += (v===3?2:(v===2?1:0));
        else if(SQ_DIS.has(n)) sqr += (v===0?2:(v===1?1:0)); }
      // Тип мозга (E-S теория): нормируем и берём разницу D.
      const S=(sqr-55.6)/150, E=(eq-44.3)/80, D=(S-E)/2;
      let band;
      if(D< -0.21) band={t:'Крайний тип E — сильный уклон в эмпатию',c:'neu'};
      else if(D< -0.041) band={t:'Тип E — эмпат (эмпатия > систематизация)',c:'neu'};
      else if(D< 0.040) band={t:'Тип B — сбалансированный',c:'neu'};
      else if(D< 0.21) band={t:'Тип S — системщик (систематизация > эмпатия)',c:'neu'};
      else band={t:'Крайний тип S — сильный уклон в систематизацию',c:'neu'};
      return {band, nums:`SQ-R ${sqr}/150 · EQ ${eq}/80`, data:{eq, sqr, D:+D.toFixed(3), type:band.t}};
    }
  }
];

const app = document.getElementById('app');
const PART_LABEL={A:'Часть A — скрин',B:'Часть B — дополнительные симптомы',
  EQ:'Эмпатия (EQ)', SQ:'Систематизация (SQ-R)'};

// Разворачиваем все тесты в один линейный список вопросов
const FLAT=[];
TESTS.forEach(t=>t.items.forEach((it,i)=>FLAT.push({t,i,it})));

let answers={};   // {testKey:{itemIdx:значение}}
let pos=0;        // текущий вопрос в общем списке
try{ const s=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');
  if(s.answers) answers=s.answers; if(typeof s.pos==='number') pos=s.pos; }catch(e){}
function save(){ try{localStorage.setItem(STORE_KEY,JSON.stringify({answers,pos}));}catch(e){} }

function answeredCount(){
  return FLAT.filter(f=> answers[f.t.key] && answers[f.t.key][f.i]!=null).length;
}

function optRow(o, numbered, selected){
  const inner = numbered
    ? `<span class="onum">${o.v}</span><span class="olbl">${o.l||''}</span>`
    : `<span class="olbl">${o.l}</span>`;
  return `<button class="orow ${selected?'sel':''}" data-v="${o.v}">${inner}</button>`;
}

// Один вопрос на экран. Тап по ответу → сразу следующий.
function renderQuestion(){
  const total=FLAT.length;
  if(pos<0) pos=0;
  if(pos>=total){ return finish(); }
  const {t,i,it}=FLAT[pos];
  answers[t.key]=answers[t.key]||{};
  const numbered = t.numbered!==false;
  const opts = it.opts || t.scale;
  const cur = answers[t.key][i];
  const done = answeredCount();
  const part = it.p ? (PART_LABEL[it.p]||it.p) : '';
  // подводка на первом вопросе каждого теста
  const intro = (i===0) ? `<div class="qintro">${t.what}${t.note?' · '+t.note:''}</div>` : '';
  app.innerHTML=`
    <div class="qbar"><i style="width:${Math.round(done/total*100)}%"></i></div>
    <div class="qmeta">${t.title}${part?' · '+part:''} · вопрос ${pos+1} из ${total}</div>
    ${intro}
    <div class="qbox">
      <div class="qtext">${it.t}</div>
      <div class="opts">${opts.map(o=>optRow(o,numbered,cur===o.v)).join('')}</div>
    </div>
    <div class="qnav"><button class="btn ghost" id="back" ${pos===0?'disabled':''}>← Назад</button></div>`;
  let locked=false;
  app.querySelectorAll('.orow').forEach(el=>el.onclick=()=>{
    if(locked) return; locked=true;
    answers[t.key][i]=+el.dataset.v; save();
    app.querySelectorAll('.orow').forEach(o=>o.classList.remove('sel'));
    el.classList.add('sel');
    setTimeout(()=>{ pos++; save(); renderQuestion(); }, 160);
  });
  const b=document.getElementById('back');
  if(b) b.onclick=()=>{ pos=Math.max(0,pos-1); save(); renderQuestion(); };
  window.scrollTo(0,0);
}

async function finish(){
  // если где-то пропущен ответ — прыгаем на первый пропущенный вопрос
  const gap = FLAT.findIndex(f=> !(answers[f.t.key] && answers[f.t.key][f.i]!=null));
  if(gap!==-1){ pos=gap; save(); renderQuestion(); return; }
  app.innerHTML=`<div class="center"><h1>Готово</h1><p class="sub">Считаю и сохраняю…</p></div>`;
  // Всё складываем внутрь scores (JSON) — таблица passport не меняется под каждый блок.
  const scores={};
  TESTS.forEach(t=>{ const r=t.score(answers[t.key]);
    scores[t.key]={...r.data, nums:r.nums, band:r.band.t, band_c:r.band.c}; });
  const completed_at=new Date().toISOString();
  const record={user_id:UID, block:'neurotype', instrument:'ASRS-v1.1',
    scores, answers, completed_at};
  await pushToSupabase(record);
  try{ localStorage.setItem(RESULT_KEY+'_pushed', completed_at); }catch(e){}
  if(tg&&typeof tg.sendData==='function'){
    try{ tg.sendData(JSON.stringify({type:'neurotype',scores})); }catch(e){}
  }
  const res={scores,answers,completed_at};
  try{ localStorage.setItem(RESULT_KEY, JSON.stringify(res)); }catch(e){}
  localStorage.removeItem(STORE_KEY);
  renderResult(res, true);
}

function renderResult(res, justFinished){
  const {scores}=res;
  const when=res.completed_at?' · '+res.completed_at.slice(0,10):'';
  const rows=TESTS.filter(t=>scores[t.key]).map(t=>{
    const s=scores[t.key];
    const c = s.band_c || ((s.band||'').includes('положительн')?'hi':'lo');
    return `<div class="res-row"><span class="rn">${t.title}</span>
      <span class="rv"><b class="${c}">${s.band||'—'}</b><small>${s.nums||''}</small></span></div>`;
  }).join('');
  app.innerHTML=`
    <h1>Твой нейротип</h1>
    <p class="sub">Скрины${when}</p>
    <div class="refer">Это скрины, не диагноз. Высокий балл — к специалисту.</div>
    ${rows}
    ${justFinished?'<p class="sub" style="margin-top:16px"><span class="ok">Отправил боту — вернись в чат, я разберу.</span></p>':''}
    <div class="nav">
      <button class="btn ghost" id="retake">🔁 Пройти заново</button>
      ${justFinished?'<button class="btn" onclick="Telegram.WebApp.close()">В чат</button>':''}
    </div>`;
  document.getElementById('retake').onclick=()=>{
    if(confirm('Пройти заново? Текущие ответы заменятся.')){
      answers={}; pos=0; try{localStorage.removeItem(RESULT_KEY);localStorage.removeItem(STORE_KEY);}catch(e){}
      renderQuestion();
    }
  };
}

// Вход. Приоритет: результат из URL (передал бот) → localStorage → форма.
let urlResult=null;
try{ const r=new URLSearchParams(location.search).get('r'); if(r) urlResult=JSON.parse(r); }catch(e){}
let savedResult=null;
try{ savedResult=JSON.parse(localStorage.getItem(RESULT_KEY)||'null'); }catch(e){}
// Подхват старого результата под ключом 'anon' (когда id ещё не читался)
if(!savedResult||!savedResult.scores){
  try{ const a=JSON.parse(localStorage.getItem(RESULT_KEY.replace(CLIENT_ID,'anon'))||'null');
    if(a&&a.scores){ savedResult=a; localStorage.setItem(RESULT_KEY, JSON.stringify(a)); } }catch(e){}
}
const inProgress=TESTS.some(t=>answers[t.key]&&Object.keys(answers[t.key]).length>0);
if(urlResult&&urlResult.scores&&!inProgress){
  try{ localStorage.setItem(RESULT_KEY,JSON.stringify(urlResult)); }catch(e){}
  renderResult(urlResult,false);
}else if(savedResult&&savedResult.scores&&!inProgress){
  // Показать результат, затем досыл + диагностика на экране.
  renderResult(savedResult,false);
  pushToSupabase({user_id:UID, block:'neurotype', instrument:'ASRS-v1.1',
    scores:savedResult.scores, answers:savedResult.answers||{}, completed_at:savedResult.completed_at});
}else{
  renderQuestion();
}
</script>
