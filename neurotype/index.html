<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Нейротип</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#F4F2EC; --graphite:#1A1A1A; --terra:#B85C38;
    --muted:#7A756B; --rule:#E2DED4; --card:#FBFAF7;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--paper);color:var(--graphite);
    font-family:'Inter',-apple-system,system-ui,sans-serif;font-size:17px;line-height:1.5;}
  .wrap{max-width:620px;margin:0 auto;padding:20px 18px 40px;}
  h1{font-size:22px;margin:0 0 6px;font-weight:700;}
  .sub{color:var(--muted);font-size:14px;margin:0 0 18px;}
  .prog{position:sticky;top:0;background:var(--paper);padding:9px 0;margin-bottom:8px;
    font-size:13px;font-weight:600;color:var(--terra);z-index:5;border-bottom:1px solid var(--rule);}
  .refer{background:#FBEEE7;border:1px solid #EBD5C8;border-radius:12px;padding:13px 15px;
    font-size:13.5px;margin-bottom:20px;color:#8A4527;line-height:1.45;}
  .tsec{margin-bottom:10px;}
  .thead{font-size:19px;font-weight:700;margin:26px 0 3px;}
  .twhat{color:var(--muted);font-size:14px;margin:0 0 12px;}
  .legend{background:var(--card);border:1px solid var(--rule);border-radius:10px;
    padding:9px 12px;font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.5;}
  .part{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.04em;margin:16px 0 8px;}
  .item{background:var(--card);border:1px solid var(--rule);border-radius:12px;
    padding:14px 14px 12px;margin-bottom:10px;}
  .itext{font-size:15.5px;font-weight:500;margin-bottom:11px;line-height:1.35;}
  .scale{display:flex;gap:6px;}
  .scale.vert{flex-direction:column;}
  .scale.vert .opt{flex:0 0 auto;flex-direction:row;justify-content:flex-start;
    gap:10px;padding:11px 13px;text-align:left;}
  .scale.vert .opt .n{text-align:left;}
  .opt{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:9px 2px;border:1.5px solid var(--rule);border-radius:9px;cursor:pointer;
    background:#fff;transition:.1s;}
  .opt:active{transform:scale(.97);}
  .opt.sel{border-color:var(--terra);background:#FBEEE7;}
  .opt .n{font-size:15px;font-weight:700;}
  .opt.sel .n{color:var(--terra);}
  .opt .l{font-size:10px;color:var(--muted);text-align:center;line-height:1.1;}
  .src{color:var(--muted);font-size:12px;margin:14px 0 4px;}
  .btn{width:100%;padding:15px;border-radius:12px;border:none;font-size:16px;font-weight:700;
    font-family:inherit;cursor:pointer;background:var(--terra);color:#fff;margin-top:20px;}
  .btn:disabled{opacity:.4;pointer-events:none;}
  .btn.ghost{background:transparent;border:1.5px solid var(--rule);color:var(--graphite);}
  .center{text-align:center;padding:40px 0;}
  .res-row{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--rule);}
  .res-row .rn{font-weight:600;flex:0 0 auto;}
  .res-row .rv{text-align:right;}
  .res-row .rv b{display:block;}
  .res-row .rv small{color:var(--muted);font-weight:400;font-size:12.5px;}
  .hi{color:#B85C38;} .lo{color:#2E7D32;} .neu{color:var(--muted);}
  .ok{color:#2E7D32;font-weight:600;}
  .nav{display:flex;gap:10px;margin-top:20px;}
  .nav .btn{margin-top:0;}
  .warn{color:#B85C38;font-size:13px;margin-top:10px;min-height:18px;text-align:center;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// ---- Telegram ----
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
const UID = tg?.initDataUnsafe?.user?.id || null;
const CLIENT_ID = UID ? ('tg_'+UID) : 'anon';
const STORE_KEY = 'neurotype_'+CLIENT_ID;
const RESULT_KEY = 'neurotype_result_'+CLIENT_ID;

// ---- Supabase ----
const SUPABASE_URL = "https://tsregyrxtmkxrxvpsvot.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_yppYfhMVGsvSrFRxDij81w_7fO-1VSo";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// 5-балльная шкала частоты (0..4)
const FREQ = [
  {v:0,l:'Никогда'},{v:1,l:'Редко'},{v:2,l:'Иногда'},{v:3,l:'Часто'},{v:4,l:'Очень часто'}
];
// 4-балльная шкала согласия для AQ (3=точно да … 0=точно нет)
const AGREE_SCALE = [
  {v:3,l:'Точно да'},{v:2,l:'Скорее да'},{v:1,l:'Скорее нет'},{v:0,l:'Точно нет'}
];
// 7-балльная шкала интенсивности для HSPS (подписи только на 1/4/7)
const HSP_SCALE = [
  {v:1,l:'Совсем нет'},{v:2,l:''},{v:3,l:''},{v:4,l:'Умеренно'},{v:5,l:''},{v:6,l:''},{v:7,l:'Крайне'}
];

// ---- Скрины. Встроенные пункты — рабочий перевод, не сертифицированный. ----
const TESTS = [
  {
    key:'adhd', title:'СДВГ', what:'внимание, импульсивность, гиперактивность',
    src:'ASRS-v1.1 · ВОЗ · рабочий перевод, скрин не диагноз',
    scale:FREQ,
    items:[
      {p:'A', t:'Как часто вам трудно завершить последние детали проекта, когда самое сложное уже позади?'},
      {p:'A', t:'Как часто вам трудно привести дела в порядок, когда задача требует организованности?'},
      {p:'A', t:'Как часто у вас бывают проблемы с тем, чтобы вспомнить о встречах или обязательствах?'},
      {p:'A', t:'Когда задача требует серьёзных раздумий, как часто вы избегаете или откладываете начало?'},
      {p:'A', t:'Как часто вы ёрзаете руками или ногами, когда приходится долго сидеть?'},
      {p:'A', t:'Как часто вы чувствуете избыток активности, будто вас «гонит мотор»?'},
      {p:'B', t:'Как часто вы допускаете небрежные ошибки в скучной или трудной работе?'},
      {p:'B', t:'Как часто вам трудно удерживать внимание на скучной или однообразной работе?'},
      {p:'B', t:'Как часто вам трудно сосредоточиться на словах собеседника, даже когда он обращается прямо к вам?'},
      {p:'B', t:'Как часто вы теряете вещи или с трудом находите их дома или на работе?'},
      {p:'B', t:'Как часто вас отвлекает движение или шум вокруг?'},
      {p:'B', t:'Как часто вы встаёте с места на встречах или там, где положено сидеть?'},
      {p:'B', t:'Как часто вы чувствуете беспокойство или неусидчивость?'},
      {p:'B', t:'Как часто вам трудно расслабиться и отдохнуть, когда есть свободное время?'},
      {p:'B', t:'Как часто вы замечаете, что слишком много говорите в общении?'},
      {p:'B', t:'Как часто в разговоре вы заканчиваете фразы за других, не дав им договорить?'},
      {p:'B', t:'Как часто вам трудно дождаться своей очереди там, где это нужно?'},
      {p:'B', t:'Как часто вы перебиваете других, когда они заняты?'}
    ],
    // Скоринг ASRS-v1.1. Часть A (пункты 0..5) — скрин.
    // Пункты 1–3 (idx 0,1,2) в зоне при «Иногда+» (>=2); пункты 4–6 (idx 3,4,5) при «Часто+» (>=3).
    score:(ans)=>{
      let hitsA=0;
      [0,1,2].forEach(i=>{ if(ans[i]!=null && ans[i]>=2) hitsA++; });
      [3,4,5].forEach(i=>{ if(ans[i]!=null && ans[i]>=3) hitsA++; });
      const positive = hitsA>=4;
      let load=0; for(let i=0;i<18;i++){ if(ans[i]!=null && ans[i]>=3) load++; }
      const band = positive
        ? {t:'Скрин положительный — симптомы, совместимые с СДВГ у взрослых → к специалисту', c:'hi'}
        : {t:'Скрин отрицательный по Части A', c:'lo'};
      return {band, nums:`Часть A: ${hitsA}/6 в зоне скрина · часто/очень часто: ${load}/18`,
        data:{partA_hits:hitsA, positive, symptom_load:load}};
    }
  },
  {
    key:'autism', title:'Аутистический спектр', what:'соц. навыки, внимание, систематизация, воображение',
    src:'AQ-50 · Барон-Коэн, Кембридж · рабочий перевод, скрин не диагноз',
    scale:AGREE_SCALE, numbered:false,
    items:[
      {t:'Я предпочитаю делать что-то вместе с другими, а не в одиночку.'},
      {t:'Я предпочитаю делать одно и то же одним и тем же способом снова и снова.'},
      {t:'Когда я пытаюсь что-то вообразить, мне легко создать образ в голове.'},
      {t:'Я часто так сильно погружаюсь в одно дело, что теряю из виду всё остальное.'},
      {t:'Я часто замечаю тихие звуки, которых не замечают другие.'},
      {t:'Я обычно обращаю внимание на автомобильные номера или похожие наборы символов.'},
      {t:'Мне часто говорят, что я сказал что-то невежливое, хотя мне казалось, что это вежливо.'},
      {t:'Читая историю, я легко представляю, как выглядят персонажи.'},
      {t:'Меня увлекают даты.'},
      {t:'В компании я легко слежу за разговорами сразу нескольких людей.'},
      {t:'Мне легко даются социальные ситуации.'},
      {t:'Я склонен замечать детали, которых не видят другие.'},
      {t:'Я скорее пойду в библиотеку, чем на вечеринку.'},
      {t:'Мне легко сочинять истории.'},
      {t:'Меня сильнее тянет к людям, чем к вещам.'},
      {t:'У меня бывают очень сильные увлечения, и я расстраиваюсь, если не могу ими заниматься.'},
      {t:'Мне нравится непринуждённая светская болтовня.'},
      {t:'Когда я говорю, другим не всегда легко вставить слово.'},
      {t:'Меня увлекают числа.'},
      {t:'Читая историю, мне трудно понять намерения персонажей.'},
      {t:'Мне не особенно нравится читать художественную литературу.'},
      {t:'Мне трудно заводить новых друзей.'},
      {t:'Я постоянно замечаю закономерности в вещах.'},
      {t:'Я скорее пойду в театр, чем в музей.'},
      {t:'Меня не расстраивает, если мой обычный распорядок нарушается.'},
      {t:'Я часто не знаю, как поддержать разговор.'},
      {t:'Мне легко «читать между строк», когда со мной говорят.'},
      {t:'Обычно я сосредотачиваюсь на общей картине, а не на мелких деталях.'},
      {t:'Я плохо запоминаю телефонные номера.'},
      {t:'Обычно я не замечаю мелких изменений в обстановке или во внешности человека.'},
      {t:'Я понимаю, когда собеседнику становится скучно меня слушать.'},
      {t:'Мне легко делать несколько дел одновременно.'},
      {t:'Разговаривая по телефону, я не всегда понимаю, когда моя очередь говорить.'},
      {t:'Мне нравится делать что-то спонтанно.'},
      {t:'Я часто позже всех понимаю суть шутки.'},
      {t:'Мне легко понять, что человек думает или чувствует, просто по его лицу.'},
      {t:'Если меня прервали, я очень быстро возвращаюсь к прежнему делу.'},
      {t:'Я хорош в непринуждённой светской беседе.'},
      {t:'Мне часто говорят, что я снова и снова возвращаюсь к одной и той же теме.'},
      {t:'В детстве мне нравились игры с другими детьми, где нужно было что-то изображать.'},
      {t:'Мне нравится собирать сведения о категориях вещей (типы машин, птиц, поездов, растений и т. п.).'},
      {t:'Мне трудно представить, каково быть кем-то другим.'},
      {t:'Мне нравится тщательно планировать любые дела, в которых я участвую.'},
      {t:'Мне нравятся общественные мероприятия.'},
      {t:'Мне трудно распознавать намерения людей.'},
      {t:'Новые ситуации вызывают у меня тревогу.'},
      {t:'Мне нравится знакомиться с новыми людьми.'},
      {t:'Я хороший дипломат.'},
      {t:'Я плохо запоминаю дни рождения людей.'},
      {t:'Мне очень легко играть с детьми в игры с воображением и притворством.'}
    ],
    // Скоринг AQ (Baron-Cohen 2001). Значение v: 3=точно да,2=скорее да,1=скорее нет,0=точно нет.
    // «Согласие»-пункты дают балл при «да» (v>=2); остальные — при «нет» (v<=1).
    score:(ans)=>{
      const AGREE=new Set([1,2,4,5,6,7,9,12,13,16,18,19,20,21,22,23,26,33,35,39,41,42,43,45,46]);
      const SUB={
        'соц.навыки':[1,11,13,15,22,36,44,45,47,48],
        'переключение':[2,4,10,16,25,32,34,37,43,46],
        'детали':[5,6,9,12,19,23,28,29,30,49],
        'коммуникация':[7,17,18,26,27,31,33,35,38,39],
        'воображение':[3,8,14,20,21,24,40,41,42,50]
      };
      const pt=(i)=>{ const v=ans[i]; if(v==null) return 0;
        return AGREE.has(i+1) ? (v>=2?1:0) : (v<=1?1:0); };
      let total=0; for(let i=0;i<50;i++) total+=pt(i);
      const subs={}; Object.keys(SUB).forEach(k=>{ subs[k]=SUB[k].reduce((a,ob)=>a+pt(ob-1),0); });
      const positive = total>=32;
      const band = positive
        ? {t:'Выраженные аутистические черты (AQ ≥32) → к специалисту', c:'hi'}
        : (total>=26 ? {t:'Повышенно (26–31) — пограничная зона', c:'mid'}
                     : {t:'Ниже порога (по скрину АС-диагноз маловероятен)', c:'lo'});
      const subStr=Object.keys(subs).map(k=>k+' '+subs[k]).join(' · ');
      return {band, nums:`AQ: ${total}/50 · `+subStr, data:{total, positive, subs}};
    }
  },
  {
    key:'hsp', title:'Высокая чувствительность', what:'глубина обработки, лёгкая перегрузка от стимулов',
    src:'HSPS · Э. Арон, 1997 · рабочий перевод, скрин не диагноз',
    scale:HSP_SCALE, numbered:true,
    items:[
      {t:'Легко ли вас перегружает сильный сенсорный поток?'},
      {t:'Замечаете ли вы тонкие детали окружающей обстановки?'},
      {t:'Влияет ли на вас настроение других людей?'},
      {t:'Склонны ли вы острее чувствовать боль?'},
      {t:'В напряжённые дни вам нужно уединиться — лечь, уйти в тёмную комнату или туда, где можно побыть одному и отдохнуть от раздражителей?'},
      {t:'Особенно ли вы чувствительны к действию кофеина?'},
      {t:'Легко ли вас перегружают яркий свет, сильные запахи, грубые ткани или сирена рядом?'},
      {t:'Богата ли и сложна ваша внутренняя жизнь?'},
      {t:'Доставляет ли вам дискомфорт громкий шум?'},
      {t:'Глубоко ли вас трогают искусство или музыка?'},
      {t:'Бывает ли ваша нервная система настолько измотана, что вам необходимо уединиться?'},
      {t:'Добросовестны ли вы?'},
      {t:'Легко ли вы вздрагиваете от неожиданности?'},
      {t:'Выбивает ли вас из колеи, когда нужно много успеть за короткое время?'},
      {t:'Когда людям некомфортно в помещении, обычно ли вы понимаете, что нужно изменить (свет, рассадку), чтобы стало удобнее?'},
      {t:'Раздражает ли вас, когда от вас хотят слишком много дел сразу?'},
      {t:'Сильно ли вы стараетесь не допускать ошибок и ничего не забывать?'},
      {t:'Стараетесь ли вы избегать жестоких фильмов и передач?'},
      {t:'Возникает ли у вас неприятное перевозбуждение, когда вокруг много всего происходит?'},
      {t:'Вызывает ли сильный голод у вас резкую реакцию, сбивая концентрацию или настроение?'},
      {t:'Выбивают ли вас из колеи перемены в жизни?'},
      {t:'Замечаете ли вы и наслаждаетесь ли тонкими запахами, вкусами, звуками, произведениями искусства?'},
      {t:'Неприятно ли вам, когда одновременно происходит много всего?'},
      {t:'Стараетесь ли вы в первую очередь устроить жизнь так, чтобы избегать расстраивающих или перегружающих ситуаций?'},
      {t:'Беспокоят ли вас интенсивные раздражители — громкий шум или хаотичные сцены?'},
      {t:'Когда приходится соревноваться или работать под наблюдением, становитесь ли вы настолько нервным, что справляетесь заметно хуже обычного?'},
      {t:'В детстве родители или учителя считали вас чувствительным или застенчивым?'}
    ],
    // Скоринг HSPS (Aron 1997). Пункт «верно про меня» = ответ 5–7. Автор: больше 14 из 27 → вероятно ВЧЛ.
    score:(ans)=>{
      let count=0, sum=0, n=0;
      for(let i=0;i<27;i++){ const v=ans[i]; if(v==null) continue; n++; sum+=v; if(v>=5) count++; }
      const positive = count>14;
      const mean = n ? (sum/n).toFixed(1) : '0';
      const band = positive
        ? {t:'Вероятно высокочувствительный тип (ВЧЛ)', c:'hi'}
        : {t:'Ниже порога ВЧЛ', c:'lo'};
      return {band, nums:`«Верно про меня» (5–7): ${count}/27 · средний балл ${mean}/7`,
        data:{true_count:count, mean:+mean, positive}};
    }
  },
  {
    key:'chrono', title:'Хронотип', what:'жаворонок / сова — биологические золотые часы',
    src:'MEQ · Хорн-Остберг / Terman · рабочий перевод',
    numbered:false, vertical:true,   // у каждого пункта свои варианты со своими баллами
    items:[
      {t:'Когда бы вы вставали, если бы могли полностью свободно планировать день?', opts:[
        {v:5,l:'05:00–06:30'},{v:4,l:'06:30–07:45'},{v:3,l:'07:45–09:45'},{v:2,l:'09:45–11:00'},{v:1,l:'11:00–12:00'}]},
      {t:'Во сколько бы вы ложились спать, если бы могли свободно планировать вечер?', opts:[
        {v:5,l:'20:00–21:00'},{v:4,l:'21:00–22:15'},{v:3,l:'22:15–00:30'},{v:2,l:'00:30–01:45'},{v:1,l:'01:45–03:00'}]},
      {t:'Если утром обычно нужно вставать в определённое время, насколько вы зависите от будильника?', opts:[
        {v:4,l:'Совсем не завишу'},{v:3,l:'Немного'},{v:2,l:'Довольно сильно'},{v:1,l:'Очень сильно'}]},
      {t:'Насколько легко вам вставать по утрам, когда вас не будят неожиданно?', opts:[
        {v:1,l:'Очень трудно'},{v:2,l:'Довольно трудно'},{v:3,l:'Довольно легко'},{v:4,l:'Очень легко'}]},
      {t:'Насколько бодрым вы чувствуете себя в первые полчаса после пробуждения?', opts:[
        {v:1,l:'Совсем не бодрым'},{v:2,l:'Слегка бодрым'},{v:3,l:'Довольно бодрым'},{v:4,l:'Очень бодрым'}]},
      {t:'Насколько сильный голод вы ощущаете в первые полчаса после пробуждения?', opts:[
        {v:1,l:'Совсем не голоден'},{v:2,l:'Слегка'},{v:3,l:'Довольно'},{v:4,l:'Очень голоден'}]},
      {t:'Как вы себя чувствуете в первые полчаса после пробуждения?', opts:[
        {v:1,l:'Очень усталым'},{v:2,l:'Довольно усталым'},{v:3,l:'Довольно свежим'},{v:4,l:'Очень свежим'}]},
      {t:'Если бы на следующий день не было дел, во сколько бы вы легли по сравнению с обычным временем?', opts:[
        {v:4,l:'Редко или никогда не позже'},{v:3,l:'Меньше чем на час позже'},{v:2,l:'На 1–2 часа позже'},{v:1,l:'Более чем на 2 часа позже'}]},
      {t:'Вы решили заниматься спортом час, дважды в неделю, с 07:00 до 08:00. Ориентируясь только на внутренние часы — как справитесь?', opts:[
        {v:4,l:'Был бы в хорошей форме'},{v:3,l:'Был бы в приемлемой форме'},{v:2,l:'Было бы трудно'},{v:1,l:'Было бы очень трудно'}]},
      {t:'Во сколько бы вы легли спать, если бы могли спать тогда, когда захочется?', opts:[
        {v:5,l:'20:00–21:00'},{v:4,l:'21:00–22:15'},{v:3,l:'22:15–00:45'},{v:2,l:'00:45–02:00'},{v:1,l:'02:00–03:00'}]},
      {t:'Хотите быть на пике для двухчасового умственно изматывающего теста. День свободен. Какое время выберете?', opts:[
        {v:6,l:'08:00–10:00'},{v:4,l:'11:00–13:00'},{v:2,l:'15:00–17:00'},{v:0,l:'19:00–21:00'}]},
      {t:'Если бы вы легли спать в 23:00, насколько уставшим вы были бы?', opts:[
        {v:0,l:'Совсем не уставшим'},{v:2,l:'Немного уставшим'},{v:3,l:'Довольно уставшим'},{v:5,l:'Очень уставшим'}]},
      {t:'Вы легли на несколько часов позже обычного, но вставать утром в определённое время не нужно. Что вероятнее всего?', opts:[
        {v:4,l:'Проснусь в обычное время и больше не усну'},{v:3,l:'Проснусь в обычное время, потом буду дремать'},{v:2,l:'Проснусь в обычное время, но снова засну'},{v:1,l:'Проснусь позже обычного'}]},
      {t:'Ночью нужно бодрствовать с 04:00 до 06:00 на дежурстве, назавтра дел нет. Что подошло бы лучше всего?', opts:[
        {v:1,l:'Не ложиться, пока дежурство не закончится'},{v:2,l:'Вздремнуть до дежурства и поспать после'},{v:3,l:'Хорошо выспаться до и вздремнуть после'},{v:4,l:'Спать только до дежурства'}]},
      {t:'У вас два часа тяжёлой физической работы, день свободен. Какое время выберете?', opts:[
        {v:4,l:'08:00–10:00'},{v:3,l:'11:00–13:00'},{v:2,l:'15:00–17:00'},{v:1,l:'19:00–21:00'}]},
      {t:'Вы решили заниматься спортом час, дважды в неделю, с 22:00 до 23:00. Как справитесь?', opts:[
        {v:1,l:'Был бы в хорошей форме'},{v:2,l:'Был бы в приемлемой форме'},{v:3,l:'Было бы трудно'},{v:4,l:'Было бы очень трудно'}]},
      {t:'Можете выбрать свой график: 5 часов в день (с перерывами), работа интересная, оплата по результату. Во сколько начнёте?', opts:[
        {v:5,l:'5 часов, начиная с 04:00–08:00'},{v:4,l:'5 часов, начиная с 08:00–09:00'},{v:3,l:'5 часов, начиная с 09:00–14:00'},{v:2,l:'5 часов, начиная с 14:00–17:00'},{v:1,l:'5 часов, начиная с 17:00–04:00'}]},
      {t:'Примерно в какое время суток вы обычно чувствуете себя лучше всего?', opts:[
        {v:5,l:'05:00–08:00'},{v:4,l:'08:00–10:00'},{v:3,l:'10:00–17:00'},{v:2,l:'17:00–22:00'},{v:1,l:'22:00–05:00'}]},
      {t:'Вы «утренний тип» или «вечерний тип»?', opts:[
        {v:6,l:'Определённо утренний'},{v:4,l:'Скорее утренний, чем вечерний'},{v:2,l:'Скорее вечерний, чем утренний'},{v:0,l:'Определённо вечерний'}]}
    ],
    // Скоринг MEQ: сумма баллов выбранных вариантов, 16–86.
    score:(ans)=>{
      let total=0; for(let i=0;i<19;i++){ if(ans[i]!=null) total+=ans[i]; }
      let band;
      if(total>=70) band={t:'Явный жаворонок',c:'lo'};
      else if(total>=59) band={t:'Умеренный жаворонок',c:'lo'};
      else if(total>=42) band={t:'Промежуточный тип',c:'neu'};
      else if(total>=31) band={t:'Умеренная сова',c:'mid'};
      else band={t:'Явная сова',c:'mid'};
      return {band, nums:`MEQ: ${total} (16–86)`, data:{total}};
    }
  }
];

const app = document.getElementById('app');
let answers = {};  // {testKey:{itemIdx:0..4}}
try{ const s=JSON.parse(localStorage.getItem(STORE_KEY)||'{}'); if(s.answers) answers=s.answers; }catch(e){}
function save(){ try{localStorage.setItem(STORE_KEY,JSON.stringify({answers}));}catch(e){} }

function renderForm(){
  const partLabel={A:'Часть A — скрин',B:'Часть B — дополнительные симптомы'};
  let html = `
    <h1>Нейротип</h1>
    <p class="sub">Проводка мозга · опросники · это скрины, не диагноз</p>
    <div class="prog" id="prog"></div>
    <div class="refer">Высокий балл — <b>повод сходить к специалисту</b>, а не ярлык.
      Диагноз ставит только врач. Отвечай по последним 6 месяцам.</div>`;

  TESTS.forEach(t=>{
    answers[t.key]=answers[t.key]||{};
    const numbered = t.numbered!==false;
    const vert = !!t.vertical;
    const legend = t.scale
      ? `<div class="legend">${t.scale.filter(o=>o.l).map(o=>numbered?(o.v+' — '+o.l):o.l).join(' · ')}</div>`
      : '';
    html += `<div class="tsec">
      <div class="thead">${t.title}</div>
      <div class="twhat">${t.what}</div>
      ${legend}`;
    let curPart='';
    t.items.forEach((it,i)=>{
      if((it.p||'')!==curPart){ curPart=it.p||''; if(curPart) html+=`<div class="part">${partLabel[curPart]||''}</div>`; }
      const cur=answers[t.key][i];
      const opts = it.opts || t.scale;   // MEQ: у каждого пункта свои варианты
      html += `<div class="item"><div class="itext">${i+1}. ${it.t}</div>
        <div class="scale ${vert?'vert':''}">${opts.map(o=>`
          <div class="opt ${cur===o.v?'sel':''}" data-t="${t.key}" data-i="${i}" data-v="${o.v}">
            ${numbered?`<span class="n">${o.v}</span><span class="l">${o.l}</span>`
                     :`<span class="n" style="font-size:${vert?'14px':'12.5px'};line-height:1.2">${o.l}</span>`}
          </div>`).join('')}
        </div></div>`;
    });
    html += `<div class="src">${t.src}</div></div>`;
  });

  html += `<div class="warn" id="warn"></div>
    <button class="btn" id="save">Сохранить результат</button>`;
  app.innerHTML=html;

  app.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
    const tk=el.dataset.t, i=+el.dataset.i, v=+el.dataset.v;
    answers[tk][i]=v; save();
    // подсветить выбранное в этой строке
    el.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
    el.classList.add('sel');
    document.getElementById('warn').textContent='';
    updateProg();
  });
  document.getElementById('save').onclick=finish;
  updateProg();
}

function updateProg(){
  const el=document.getElementById('prog'); if(!el) return;
  let total=0, done=0;
  TESTS.forEach(t=>{ total+=t.items.length;
    done+=t.items.filter((_,i)=>answers[t.key] && answers[t.key][i]!=null).length; });
  el.textContent=`Отвечено ${done} из ${total}`;
}

function allAnswered(t){ return t.items.every((_,i)=>answers[t.key][i]!=null); }

async function finish(){
  // требуем ответы на все пункты для чистого скрина
  const missing = TESTS.find(t=>!allAnswered(t));
  if(missing){
    const first = missing.items.findIndex((_,i)=>answers[missing.key][i]==null);
    document.getElementById('warn').textContent=`Ответь на все пункты (не хватает №${first+1}).`;
    const nodes=app.querySelectorAll('.item');
    if(nodes[first]) nodes[first].scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }
  app.innerHTML=`<div class="center"><h1>Готово</h1><p class="sub">Считаю и сохраняю…</p></div>`;
  // Всё складываем внутрь scores (JSON) — таблица passport не меняется под каждый блок.
  const scores={};
  TESTS.forEach(t=>{ const r=t.score(answers[t.key]);
    scores[t.key]={...r.data, nums:r.nums, band:r.band.t, band_c:r.band.c}; });
  const completed_at=new Date().toISOString();
  const record={user_id:UID, block:'neurotype', instrument:'ASRS-v1.1',
    scores, answers, completed_at};
  try{ await sb.from('passport').insert(record); }catch(e){}
  if(tg&&typeof tg.sendData==='function'){
    try{ tg.sendData(JSON.stringify({type:'neurotype',scores})); }catch(e){}
  }
  const res={scores,completed_at};
  try{ localStorage.setItem(RESULT_KEY, JSON.stringify(res)); }catch(e){}
  localStorage.removeItem(STORE_KEY);
  renderResult(res, true);
}

function renderResult(res, justFinished){
  const {scores}=res;
  const when=res.completed_at?' · '+res.completed_at.slice(0,10):'';
  const rows=TESTS.filter(t=>scores[t.key]).map(t=>{
    const s=scores[t.key];
    const c = s.band_c || ((s.band||'').includes('положительн')?'hi':'lo');
    return `<div class="res-row"><span class="rn">${t.title}</span>
      <span class="rv"><b class="${c}">${s.band||'—'}</b><small>${s.nums||''}</small></span></div>`;
  }).join('');
  app.innerHTML=`
    <h1>Твой нейротип</h1>
    <p class="sub">Скрины${when}</p>
    <div class="refer">Это скрины, не диагноз. Высокий балл — к специалисту.</div>
    ${rows}
    ${justFinished?'<p class="sub" style="margin-top:16px"><span class="ok">Отправил боту — вернись в чат, я разберу.</span></p>':''}
    <div class="nav">
      <button class="btn ghost" id="retake">🔁 Пройти заново</button>
      ${justFinished?'<button class="btn" onclick="Telegram.WebApp.close()">В чат</button>':''}
    </div>`;
  document.getElementById('retake').onclick=()=>{
    if(confirm('Пройти заново? Текущие ответы заменятся.')){
      answers={}; try{localStorage.removeItem(RESULT_KEY);localStorage.removeItem(STORE_KEY);}catch(e){}
      renderForm();
    }
  };
}

// Вход. Приоритет: результат из URL (передал бот) → localStorage → форма.
let urlResult=null;
try{ const r=new URLSearchParams(location.search).get('r'); if(r) urlResult=JSON.parse(r); }catch(e){}
let savedResult=null;
try{ savedResult=JSON.parse(localStorage.getItem(RESULT_KEY)||'null'); }catch(e){}
const inProgress=TESTS.some(t=>answers[t.key]&&Object.keys(answers[t.key]).length>0);
if(urlResult&&urlResult.scores&&!inProgress){
  try{ localStorage.setItem(RESULT_KEY,JSON.stringify(urlResult)); }catch(e){}
  renderResult(urlResult,false);
}else if(savedResult&&savedResult.scores&&!inProgress){
  renderResult(savedResult,false);
}else{
  renderForm();
}
</script>
