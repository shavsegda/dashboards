<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Команда</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Цвета. Каждый — из темы Телеграма, запасное значение — палитра Алексея
   paper/graphite/terracotta. Тема есть — идём за клиентом; темы нет (браузер) —
   страница выглядит как раньше.
   Полупрозрачные оттенки собраны из триплетов --ink-rgb и --alert-rgb: добавить
   альфу к чужому цвету средствами CSS нельзя, поэтому триплеты считает скрипт и
   обновляет по themeChanged. */
:root {
  --paper: #F4F2EC;
  --stone: #E8E5DC;
  --graphite: #1A1A1A;
  --ink-rgb: 26,26,26;
  --graphite-90: rgba(var(--ink-rgb),0.9);
  --graphite-75: rgba(var(--ink-rgb),0.75);
  --graphite-65: rgba(var(--ink-rgb),0.65);
  --graphite-50: rgba(var(--ink-rgb),0.5);
  --graphite-30: rgba(var(--ink-rgb),0.3);
  --graphite-15: rgba(var(--ink-rgb),0.15);
  --graphite-08: rgba(var(--ink-rgb),0.08);
  /* Акцент свой: в теме Телеграма аналога нет — button_color у каждого клиента
     свой и рвёт вид страницы. На тёмном фоне терракота не читается, поэтому для
     тёмной темы ниже задан более светлый оттенок. */
  --terracotta: #B85C38;
  --accent-rgb: 184,92,56;
  --terracotta-tint: rgba(var(--accent-rgb),0.08);
  --alert: var(--tg-theme-destructive_text_color, #B91C1C);
  --alert-rgb: 185,28,28;
  --alert-tint: rgba(var(--alert-rgb),0.06);
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}

/* Телеграма нет, а система в тёмной теме: держим страницу тёмной целиком, иначе
   получится светлый лист в тёмном окне. Значения запасные — тема клиента и
   скрипт всегда сильнее. */
@media (prefers-color-scheme: dark) {
  :root {
    --paper: var(--tg-theme-bg_color, #17171A);
    --stone: var(--tg-theme-secondary_bg_color, #202024);
    --graphite: var(--tg-theme-text_color, #F0EEE8);
    --ink-rgb: 240,238,232;
    --terracotta: #E08A63;
    --accent-rgb: 224,138,99;
    --alert: var(--tg-theme-destructive_text_color, #F27A7A);
    --alert-rgb: 242,122,122;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { font-family: var(--font-sans); background: var(--paper); color: var(--graphite); line-height: 1.55; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
/* Высота — стабильная высота окна Телеграма: её ставит скрипт из
   viewportStableHeight. У viewportHeight она меняется во время жестов, и низ
   страницы прыгает под пальцем. */
body { min-height: var(--tg-vh, 100vh); }

.progress { position: sticky; top: 0; background: var(--paper); padding: calc(14px + var(--tg-content-safe-area-inset-top, 0px)) 0 10px; z-index: 10; border-bottom: 1px solid var(--graphite-08); }
.progress-track { max-width: 640px; margin: 0 auto; padding: 0 24px; }
.progress-bar { height: 2px; background: var(--graphite-08); position: relative; overflow: hidden; }
.progress-fill { height: 100%; background: var(--terracotta); transition: width 0.3s ease; width: 0%; }
.progress-text { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--graphite-50); margin-top: 8px; display: flex; justify-content: space-between; }

/* Безопасные зоны Телеграма: без них верх уезжает под вырез, а низ под панель */
main {
  max-width: 640px; margin: 0 auto;
  padding-top: 40px;
  padding-bottom: calc(80px + var(--tg-safe-area-inset-bottom, 0px));
  padding-left: calc(24px + var(--tg-safe-area-inset-left, 0px));
  padding-right: calc(24px + var(--tg-safe-area-inset-right, 0px));
}
h1 { font-size: 34px; font-weight: 500; letter-spacing: -0.025em; line-height: 1.05; margin-bottom: 10px; }
h2 { font-size: 20px; font-weight: 500; letter-spacing: -0.015em; margin: 28px 0 10px; }
p { margin-bottom: 12px; color: var(--graphite-75); }
.lead { font-size: 17px; line-height: 1.5; color: var(--graphite-75); margin-bottom: 24px; max-width: 540px; }
.note { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--graphite-50); }
.sub { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--terracotta); margin-bottom: 22px; }

button { background: var(--graphite); color: var(--paper); padding: 14px 28px; border: none; border-radius: 0; font-size: 14px; cursor: pointer; transition: background 0.2s; font-family: var(--font-sans); font-weight: 500; letter-spacing: 0.02em; }
button:hover { background: var(--terracotta); }
button.secondary { background: transparent; color: var(--graphite); border: 1px solid var(--graphite-30); padding: 13px 27px; }
button.secondary:hover { background: transparent; color: var(--terracotta); border-color: var(--terracotta); }
.actions { margin-top: 28px; display: flex; gap: 12px; flex-wrap: wrap; }

/* Плашка «это погода, а не характер» — повторяется в списке и в результатах */
.weather { border-left: 2px solid var(--terracotta); background: var(--terracotta-tint); padding: 14px 16px; margin: 22px 0; font-size: 14px; line-height: 1.5; color: var(--graphite-75); }

.hub-item { border: 1px solid var(--graphite-15); padding: 20px; margin-bottom: 12px; }
.hub-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.hub-title { font-size: 18px; font-weight: 500; letter-spacing: -0.01em; }
.hub-when { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--graphite-50); white-space: nowrap; }
.hub-what { font-size: 14px; color: var(--graphite-75); margin-bottom: 4px; }
.hub-note { font-size: 13px; color: var(--graphite-50); margin-bottom: 14px; }
.hub-item button { padding: 11px 20px; font-size: 13px; }

/* Метка «рабочий перевод» — рядом с названием теста, где нет официальной русской версии */
.tag-wt { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--terracotta); border: 1px solid var(--terracotta); padding: 2px 6px; margin-left: 8px; white-space: nowrap; vertical-align: middle; }

.q-card { margin: 0 0 8px; }
.q-block { font-family: var(--font-mono); font-size: 11px; color: var(--graphite-50); text-transform: uppercase; letter-spacing: 0.2em; margin-bottom: 6px; }
/* Окно наблюдения показываем на каждом экране — иначе человек съезжает на «вообще по жизни» */
.q-window { font-family: var(--font-mono); font-size: 11px; color: var(--terracotta); text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 16px; }
.q-text { font-size: 22px; line-height: 1.25; margin-bottom: 20px; font-weight: 500; letter-spacing: -0.015em; }
.q-instr { font-size: 15px; color: var(--graphite-65); margin-bottom: 18px; line-height: 1.5; }
.q-options { display: grid; gap: 8px; }
.q-option { display: flex; align-items: center; padding: 16px 18px; border: 1px solid var(--graphite-15); cursor: pointer; transition: all 0.15s; background: transparent; user-select: none; }
.q-option:hover { border-color: var(--terracotta); color: var(--terracotta); }
.q-option.selected { border-color: var(--terracotta); background: var(--terracotta); color: var(--paper); }
.q-option-text { font-size: 15px; flex: 1; }

.result-card { border: 1px solid var(--graphite-08); margin-bottom: 20px; }
.result-row { display: flex; align-items: baseline; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--graphite-08); gap: 12px; }
.result-row:last-child { border-bottom: 0; }
.result-name { font-size: 14px; color: var(--graphite); font-weight: 500; }
/* Результат словами. Балла человек не видит: сумму своих ответов он читает как
   приговор. Вместо неё — то, что он сам отметил, и сдвиг с прошлого раза. */
.res-h { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--graphite-50); margin: 24px 0 8px; }
.ans-row { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; padding: 13px 20px; border-bottom: 1px solid var(--graphite-08); }
.ans-row:last-child { border-bottom: 0; }
.ans-q { font-size: 14px; color: var(--graphite-75); flex: 1; }
.ans-a { font-size: 14px; color: var(--graphite); font-weight: 500; text-align: right; max-width: 46%; }
.shift-word { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; color: var(--terracotta); text-align: right; }
.first-point { font-size: 14px; color: var(--graphite-75); padding: 16px 20px; }
.band { font-size: 16px; line-height: 1.45; margin-bottom: 18px; }
.band.warn { color: var(--alert); }

.soft-card { border: 1px solid var(--graphite-30); padding: 18px 20px; margin-bottom: 22px; }
.soft-card p { margin-bottom: 0; color: var(--graphite-75); font-size: 14px; line-height: 1.55; }
.soft-card.hard { border-color: var(--alert); background: var(--alert-tint); }
.soft-card p + p { margin-top: 10px; }
.sync-status { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--terracotta); margin-top: 14px; }
.sync-status.error { color: var(--alert); }

@media (max-width: 600px) {
  main { padding: 28px 20px 80px; }
  h1 { font-size: 28px; }
  .q-text { font-size: 19px; }
  .result-row { padding: 16px; }
  .ans-row { padding: 12px 16px; }
  .ans-a { max-width: 52%; }
}
</style>
</head>
<body>
<header class="progress" id="progressBar" style="display:none;">
  <div class="progress-track">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text"><span id="progressText">Начало</span><span id="progressCount"></span></div>
  </div>
</header>
<main id="app"></main>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
// === Telegram WebApp ===
const tg = window.Telegram?.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

/* ---- Тема Телеграма, безопасные зоны и высота ----
 *
 * Правило из «мини-аппы-правила.md»: цвета брать из темы клиента и слушать
 * themeChanged. Раньше цвета были прибиты гвоздями, и у человека с тёмной темой
 * страница светила белым листом.
 *
 * Как поделена работа. Без Телеграма (браузер) за вид отвечает CSS: светлая
 * палитра в `:root`, тёмная — в блоке про тёмную тему системы. С Телеграмом за
 * вид отвечает этот код: он берёт цвета у клиента и доставляет то, чего в CSS не
 * выразить, — полупрозрачные оттенки от чужого цвета текста.
 *
 * Акцент остаётся своим: в теме Телеграма аналога нет, а button_color у каждого
 * клиента свой и рвёт вид страницы. На тёмном фоне терракота не читается —
 * поэтому для тёмной темы задан свой более светлый оттенок.
 *
 * Высота берётся из viewportStableHeight, а не viewportHeight: второй меняется
 * во время жестов, и низ страницы прыгает под пальцем.
 *
 * Ключей полей, вопросов и сборки записи этот блок не касается.
 */
(function () {
  var t = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (!t) return;                    // браузер: остаёмся на палитре из CSS
  var root = document.documentElement;
  if (!root || !root.style || !root.style.setProperty) return;

  // Две палитры. Те же значения стоят в CSS: там они запасные для браузера,
  // здесь — на случай, если клиент какого-то цвета не дал.
  var LIGHT = { paper: "#F4F2EC", stone: "#E8E5DC", ink: "#1A1A1A",
                inkRgb: "26,26,26", alert: "#B91C1C", alertRgb: "185,28,28",
                accent: "#B85C38", accentRgb: "184,92,56" };
  var DARK = { paper: "#17171A", stone: "#202024", ink: "#F0EEE8",
               inkRgb: "240,238,232", alert: "#F27A7A", alertRgb: "242,122,122",
               accent: "#E08A63", accentRgb: "224,138,99" };

  /** «#1A1A1A» → «26,26,26». Не цвет — ничего не отдаём, возьмётся запасное. */
  function trio(hex) {
    var m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(hex == null ? "" : hex).trim());
    if (!m) return null;
    var h = m[1];
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16),
            parseInt(h.slice(4, 6), 16)].join(",");
  }

  /** Светлый ли цвет. Не цвет — null: догадка тут хуже, чем «не знаю». */
  function bright(hex) {
    var c = trio(hex);
    if (!c) return null;
    var p = c.split(",");
    return (Number(p[0]) * 299 + Number(p[1]) * 587 + Number(p[2]) * 114) / 1000 > 140;
  }

  function set(name, value) { root.style.setProperty(name, value); }

  function paintTheme() {
    var p = t.themeParams || {};
    var dark = (t.colorScheme === "dark") || (bright(p.bg_color) === false);
    var pal = dark ? DARK : LIGHT;
    set("--paper", p.bg_color || pal.paper);
    set("--stone", p.secondary_bg_color || pal.stone);
    set("--graphite", p.text_color || pal.ink);
    set("--ink-rgb", trio(p.text_color) || pal.inkRgb);
    set("--alert", p.destructive_text_color || pal.alert);
    set("--alert-rgb", trio(p.destructive_text_color) || pal.alertRgb);
    set("--terracotta", pal.accent);
    set("--accent-rgb", pal.accentRgb);
    // Шапка и фон окна того же цвета, что страница: иначе виден чужой кант.
    try { t.setHeaderColor("bg_color"); } catch (e) {}
    try { t.setBackgroundColor("bg_color"); } catch (e) {}
  }

  function measureHeight() {
    var h = t.viewportStableHeight;
    if (typeof h === "number" && h > 0) set("--tg-vh", h + "px");
  }

  paintTheme();
  measureHeight();
  try { t.onEvent("themeChanged", paintTheme); } catch (e) {}
  try { t.onEvent("viewportChanged", measureHeight); } catch (e) {}
})();


// === Идентификатор клиента: сначала ?u= из URL (его подставляет бот), потом Telegram, потом локальный ===
function getOrCreateLocalUid() {
  let id = localStorage.getItem("local_uid");
  if (!id) { id = "u" + Math.random().toString(36).slice(2, 12); localStorage.setItem("local_uid", id); }
  return id;
}
function getClientId() {
  const params = new URLSearchParams(window.location.search);
  const u = params.get('u');
  if (u) return u;
  const tgId = tg?.initDataUnsafe?.user?.id;
  if (tgId) return "tg_" + tgId;
  return "local_" + getOrCreateLocalUid();
}
const CLIENT_ID = getClientId();
// В базе user_id — число, поэтому из «tg_123» достаём сам номер.
// Со строкой запись падала бы с ошибкой типа.
const UID = (function () {
  const m = /^tg_(\d+)$/.exec(CLIENT_ID);
  return m ? parseInt(m[1], 10) : null;
})();

// === Ключи хранения ===
const STORE_KEY = 'state_team_' + CLIENT_ID;          // незаконченный проход
const RESULT_KEY = 'state_team_result_' + CLIENT_ID;  // последние результаты по каждому тесту
const CLOUD_KEY = 'res_state_team';                   // облачная копия результатов (Telegram CloudStorage)

// === Supabase (пишем прямым fetch, без библиотеки) ===
const SUPABASE_URL = "https://tsregyrxtmkxrxvpsvot.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_yppYfhMVGsvSrFRxDij81w_7fO-1VSo";
const SUPABASE_TABLE = "passport";
const BLOCK = 'state_team';
const INSTRUMENT = 'Шкала психологической безопасности команды (Edmondson, 1999)';

// Плашка-напоминание: один замер ничего не значит, смысл появляется на линии
const WEATHER_TEXT = 'Это про команду, а не про тебя. Смысл появляется в сравнении с прошлым кварталом.';
// Мягкая плашка, когда сработал хоть один порог
const ALERT_TEXT = 'Это скрин, а не диагноз. Он говорит одно: стоит посмотреть внимательнее вместе со специалистом.';

// Шкала психологической безопасности Эдмондсон — согласие с утверждением, 1–7
const SCALE_SAFETY = [
  {v: 1, l: 'Совершенно не согласен'},
  {v: 2, l: 'Не согласен'},
  {v: 3, l: 'Скорее не согласен'},
  {v: 4, l: 'Что-то среднее'},
  {v: 5, l: 'Скорее согласен'},
  {v: 6, l: 'Согласен'},
  {v: 7, l: 'Полностью согласен'}
];

// === Тест про команду ===
// Приехал из месячного (004, FR-013, FR-015). Своя карточка, а не пункт
// внутри чужой: метка контейнера «Работа» ставится на карточку.
// wt: true — официальной русской версии нет, используется рабочий перевод
// filter — развилка перед тестом: если человек отвечает «нет», тест целиком пропускается
const TESTS = [
  {
    key: 'safety',
    title: 'Команда',
    what: 'можно ли в этой команде говорить правду и признавать ошибки',
    note: 'про команду, а не про начальника лично',
    window: 'Окно: последние месяцы работы с этой командой',
    wt: true,
    src: 'Шкала психологической безопасности команды (Edmondson, 1999) · 7 пунктов · рабочий перевод',
    instruction: 'Думай про ту команду, с которой работаешь чаще всего. Отметь, насколько ты согласен с каждым утверждением.',
    scale: SCALE_SAFETY,
    filter: {
      q: 'Есть ли команда или люди, с которыми ты работаешь регулярно?',
      yes: 'Есть',
      no: 'Нет сейчас',
      skipBand: 'Нет команды сейчас'
    },
    // rev: true — обратные пункты 1, 3, 5 оригинала, считаются как 8 минус ответ
    items: [
      {t: 'Если в этой команде ты ошибаешься, это часто ставят тебе в вину.', rev: true},
      {t: 'В этой команде люди могут поднимать проблемы и трудные вопросы.'},
      {t: 'Люди в этой команде иногда отвергают других за непохожесть.', rev: true},
      {t: 'В этой команде безопасно рискнуть.'},
      {t: 'В этой команде трудно попросить помощи у других.', rev: true},
      {t: 'Никто в этой команде не станет намеренно действовать так, чтобы подорвать мои усилия.'},
      {t: 'В работе с этой командой мои умения и таланты ценят и используют.'}
    ]
  }
];

function getTest(key) { return TESTS.find(t => t.key === key); }
// Шкала конкретного пункта: своя, если задана, иначе общая шкала теста
function itemScale(t, item) { return item.scale || t.scale; }

// === Скоринг ===
// Каждая функция возвращает {nums, band, c, data}

// Эдмондсон: среднее 1–7 с учётом обратных пунктов 1, 3, 5
function scoreSafety(ans) {
  const t = getTest('safety');
  let sum = 0;
  t.items.forEach((it, i) => {
    const v = ans[i] || 0;
    // Обратный пункт: 8 минус ответ (шкала 1–7)
    sum += it.rev ? (8 - v) : v;
  });
  const mean = Math.round((sum / t.items.length) * 100) / 100;
  let band;
  if (mean >= 5.5) band = 'В этой команде можно говорить правду и признавать ошибки — это не стоит тебе места и репутации.';
  else if (mean >= 4) band = 'Правду говорить можно, но не про всё: часть тем в команде обходят стороной.';
  else if (mean >= 2.5) band = 'Говорить правду рискованно: ошибку здесь проще скрыть, чем признать.';
  else band = 'Признавать ошибки и говорить прямо в этой команде почти нельзя — безопаснее молчать.';
  return {
    nums: [{l: 'Психологическая безопасность', v: mean, range: '1–7'}],
    band: band,
    c: 'ok',
    data: {mean: mean}
  };
}

const SCORERS = {safety: scoreSafety};

// === Хранение результатов ===
let results = {};       // {pss: {...}, isi: {...}, ...}
// Тесты, отвеченные В ЭТОМ заходе. Живёт только в памяти страницы: перезагрузили
// — снова пусто, и это правильно. В базу уходят ТОЛЬКО эти ключи (sessionKeys).
// Без такого фильтра ответ на один тест отправлял заодно все прошлые как
// свежие: `results` поднимается из памяти телефона и из облака, и в линии
// появлялись точки, которых человек не давал.
const answeredNow = new Set();
let cloudRestored = false;

function loadResultsLocal() {
  try {
    const s = localStorage.getItem(RESULT_KEY);
    if (s) results = JSON.parse(s) || {};
  } catch (e) { results = {}; }
}

function saveResultsLocal() {
  try { localStorage.setItem(RESULT_KEY, JSON.stringify(results)); } catch (e) {}
}

// Облачное восстановление: если на этом устройстве пусто, поднимаем историю из Telegram CloudStorage
function restoreFromCloud() {
  return new Promise(resolve => {
    if (!tg || !tg.CloudStorage || typeof tg.CloudStorage.getItem !== 'function') { resolve(false); return; }
    try {
      tg.CloudStorage.getItem(CLOUD_KEY, (err, value) => {
        if (err || !value) { resolve(false); return; }
        try {
          const cloud = JSON.parse(value) || {};
          // Берём из облака только то, что свежее локального
          Object.keys(cloud).forEach(k => {
            const local = results[k];
            if (!local || new Date(cloud[k].completed_at) > new Date(local.completed_at)) results[k] = cloud[k];
          });
          saveResultsLocal();
          resolve(true);
        } catch (e) { resolve(false); }
      });
    } catch (e) { resolve(false); }
  });
}

function saveToCloud() {
  if (!tg || !tg.CloudStorage || typeof tg.CloudStorage.setItem !== 'function') return;
  try { tg.CloudStorage.setItem(CLOUD_KEY, JSON.stringify(results), () => {}); } catch (e) {}
}

// === Прогресс прохождения (черновик незаконченного теста) ===
function saveProgress() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({key: state.key, idx: state.idx, answers: state.answers})); } catch (e) {}
}
function clearProgress() {
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
}

// === Общий флаг тревоги по всем снятым тестам ===
// Поднимается, если сработало любое из шести условий
function anyAlert() {
  return TESTS.some(t => {
    const r = results[t.key];
    return !!(r && r.data && r.data.alert === true);
  });
}

// === Отправка результата ===
function ownKeys() {
  return Object.keys(results).filter(k => TESTS.some(t => t.key === k));
}

// Что можно писать в базу: тест есть в реестре страницы И отвечен в этом заходе.
// Первое отсекает убранные тесты, второе — поднятые из памяти и из облака.
function sessionKeys() {
  return ownKeys().filter(k => answeredNow.has(k));
}

// Флаг тревоги для ЗАПИСИ считается ТОЛЬКО по тестам этого захода. Иначе запись
// говорит про сегодня то, что человек отвечал неделю назад: сигнал из прошлого
// замера уже лежит в базе своей точкой, дублировать его свежей датой нельзя.
function sessionAlert() {
  return sessionKeys().some(k => {
    const r = results[k];
    return !!(r && r.data && r.data.alert === true);
  });
}

function buildScores() {
  // В scores складываем всё, что уже снято, плюс метку источника и общий флаг
  const scores = {source: 'manual'};
  sessionKeys().forEach(k => {
    // Кладём и цифры, и человеческую формулировку: по band бот показывает
    // результат в разговоре и в панели, без него замер выглядит пустым.
    scores[k] = Object.assign({}, results[k].data, {
      band: results[k].band,
      nums: results[k].nums
    });
  });
  scores.alert = sessionAlert();
  return scores;
}

function buildAnswers() {
  const answers = {};
  sessionKeys().forEach(k => { answers[k] = results[k].answers; });
  return answers;
}

async function pushToSupabase(record) {
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/' + SUPABASE_TABLE, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(record)
    });
    return res.ok;
  } catch (e) {
    console.error('Supabase push failed:', e);
    return false;
  }
}

function sendToBot(record) {
  if (!tg || typeof tg.sendData !== 'function') return false;
  try {
    tg.sendData(JSON.stringify({type: 'state_team', payload: record}));
    return true;
  } catch (e) {
    console.error('sendData failed:', e);
    return false;
  }
}

// === Состояние экрана ===
const state = {screen: 'hub', key: null, idx: 0, answers: {}, sync: '', syncMsg: ''};
const app = document.getElementById('app');

// === Прогресс-бар ===
function updateProgress() {
  const bar = document.getElementById('progressBar');
  const fill = document.getElementById('progressFill');
  const text = document.getElementById('progressText');
  const count = document.getElementById('progressCount');
  if (state.screen !== 'test') { bar.style.display = 'none'; return; }
  const t = getTest(state.key);
  const done = Object.keys(state.answers).length;
  bar.style.display = 'block';
  fill.style.width = ((done / t.items.length) * 100) + '%';
  text.textContent = t.title;
  count.textContent = done + ' / ' + t.items.length;
}

// === Сколько дней назад был замер ===
function pluralDays(n) {
  const n10 = n % 10, n100 = n % 100;
  if (n10 === 1 && n100 !== 11) return 'день';
  if (n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) return 'дня';
  return 'дней';
}
function lastSeen(key) {
  const r = results[key];
  if (!r || !r.completed_at) return 'замеров ещё не было';
  const days = Math.floor((Date.now() - new Date(r.completed_at).getTime()) / 86400000);
  if (days <= 0) return 'последний замер сегодня';
  return 'последний замер ' + days + ' ' + pluralDays(days) + ' назад';
}

// Метка «рабочий перевод» рядом с названием теста
function wtTag(t) { return t.wt ? '<span class="tag-wt">рабочий перевод</span>' : ''; }

// Тест пропущен по развилке — цифр нет, показываем только фразу
function isSkipped(key) {
  const r = results[key];
  return !!(r && r.data && r.data.skipped);
}

// Мягкая плашка при сработавшем пороге
function alertCard() {
  if (!anyAlert()) return '';
  return '<div class="soft-card hard"><p>' + ALERT_TEXT + '</p></div>';
}

// === Экран списка (хаб) ===
function renderHub() {
  state.screen = 'hub';
  const items = TESTS.map(t => `
    <div class="hub-item">
      <div class="hub-head">
        <div class="hub-title">${t.title}${wtTag(t)}</div>
        <div class="hub-when">${lastSeen(t.key)}</div>
      </div>
      <div class="hub-what">${t.what}</div>
      <div class="hub-note">${t.note}</div>
      <button onclick="startTest('${t.key}')">Снять новый замер</button>
    </div>
  `).join('');
  app.innerHTML = `
    <h1>Команда</h1>
    <div class="sub">Можно ли здесь ошибаться и говорить вслух · 7 утверждений · 2 минуты</div>
    <div class="weather">${WEATHER_TEXT}</div>
    ${alertCard()}
    ${items}
    ${Object.keys(results).length ? '<div class="actions"><button class="secondary" onclick="renderAllResults()">Показать последние результаты</button></div>' : ''}
  `;
  updateProgress();
}

// === Экран вопроса ===
function renderQuestion() {
  const t = getTest(state.key);
  const item = t.items[state.idx];
  const scale = itemScale(t, item);
  const selected = state.answers[state.idx];
  app.innerHTML = `
    <div class="q-card">
      <div class="q-block">${t.title}${wtTag(t)}</div>
      <div class="q-window">${t.window}</div>
      ${(state.idx === 0 && t.instruction) ? `<div class="q-instr">${t.instruction}</div>` : ''}
      <div class="q-text">${item.t}</div>
      <div class="q-options">
        ${scale.map(s => `
          <div class="q-option ${selected === s.v ? 'selected' : ''}" onclick="answer(${s.v})">
            <span class="q-option-text">${s.l}</span>
          </div>
        `).join('')}
      </div>
    </div>
    <div class="actions">
      ${state.idx === 0
        ? '<button class="secondary" onclick="renderHub()">К списку</button>'
        : '<button class="secondary" onclick="prev()">Назад</button>'}
    </div>
  `;
  updateProgress();
}

// === Экран развилки перед тестом ===
// Первым экраном спрашиваем, есть ли вообще то, про что тест. Нет — пункты не задаём.
function renderFilter() {
  state.screen = 'filter';
  const t = getTest(state.key);
  app.innerHTML = `
    <div class="q-card">
      <div class="q-block">${t.title}${wtTag(t)}</div>
      <div class="q-window">${t.window}</div>
      <div class="q-text">${t.filter.q}</div>
      <div class="q-options">
        <div class="q-option" onclick="answerFilter(true)"><span class="q-option-text">${t.filter.yes}</span></div>
        <div class="q-option" onclick="answerFilter(false)"><span class="q-option-text">${t.filter.no}</span></div>
      </div>
    </div>
    <div class="actions">
      <button class="secondary" onclick="renderHub()">К списку</button>
    </div>
  `;
  updateProgress();
}

// === Результат словами ===
// Ни балла, ни диапазона: сумма ответов человеку не показывается. Он читает то,
// что сам отметил, и куда это сдвинулось с прошлого раза. Правила мини-аппов,
// часть 4: балл человек примет как приговор, хотя это просто сумма его ответов.
function answerRows(key) {
  const t = getTest(key);
  const r = results[key] || {};
  const ans = r.answers || {};
  return t.items.map((it, i) => {
    const scale = it.scale || t.scale;
    const opt = (scale || []).find(s => s.v === ans[i]);
    if (!opt) return '';
    return `<div class="ans-row"><div class="ans-q">${it.t}</div><div class="ans-a">${opt.l}</div></div>`;
  }).join('');
}

// Сдвиг с прошлого раза — направление словами, без цифр. Прошлого нет — так и
// говорим: сравнить пока не с чем. Без упрёка и без обещаний.
function shiftRows(key) {
  const r = results[key] || {};
  const prev = r.prev && r.prev.nums;
  if (!prev) return '<div class="first-point">Сравнить пока не с чем — это точка отсчёта.</div>';
  return (r.nums || []).map(n => {
    const was = prev.find(p => p.l === n.l);
    const word = !was ? 'спрашиваем впервые'
      : (n.v > was.v ? 'выше, чем в прошлый раз'
      : (n.v < was.v ? 'ниже, чем в прошлый раз' : 'как в прошлый раз'));
    return `<div class="result-row"><div class="result-name">${n.l}</div><div class="shift-word">${word}</div></div>`;
  }).join('');
}

// === Экран результата одного теста ===
function renderResult(key) {
  state.screen = 'result';
  const t = getTest(key);
  const r = results[key];
  const skipped = r.data && r.data.skipped;
  const rows = shiftRows(key);
  const answers = answerRows(key);
  const syncBlock = state.sync
    ? `<p class="sync-status${state.sync === 'error' ? ' error' : ''}">${state.syncMsg}</p>`
    : '';
  app.innerHTML = `
    <h1>${t.title}</h1>
    <div class="sub">${skipped ? 'Тест пропущен — записали как есть.' : 'Замер записан. Следующий — через квартал.'}</div>
    <div class="band ${r.c === 'warn' ? 'warn' : ''}">${r.band}</div>
    ${skipped ? '' : `
      <div class="res-h">Что ты ответил</div>
      <div class="result-card">${answers}</div>
      <div class="res-h">С прошлым разом</div>
      <div class="result-card">${rows}</div>`}
    ${alertCard()}
    <div class="weather">${WEATHER_TEXT}</div>
    ${syncBlock}
    <div class="actions">
      <button class="secondary" onclick="renderHub()">К списку</button>
      ${tg ? '<button onclick="closeApp()">Закрыть</button>' : ''}
    </div>
  `;
  updateProgress();
}

// === Экран «все последние результаты» ===
function renderAllResults() {
  state.screen = 'result';
  const blocks = TESTS.filter(t => results[t.key]).map(t => {
    const r = results[t.key];
    const rows = shiftRows(t.key);
    return `
      <h2>${t.title}${wtTag(t)}</h2>
      <div class="hub-when" style="margin-bottom:10px;">${lastSeen(t.key)}</div>
      <div class="band ${r.c === 'warn' ? 'warn' : ''}">${r.band}</div>
      ${isSkipped(t.key) ? '' : `<div class="result-card">${rows}</div>`}
    `;
  }).join('');
  app.innerHTML = `
    <h1>Команда</h1>
    <div class="sub">Последние результаты</div>
    ${alertCard()}
    ${blocks}
    <div class="weather">${WEATHER_TEXT}</div>
    <div class="actions">
      <button class="secondary" onclick="renderHub()">К списку</button>
      ${tg ? '<button onclick="closeApp()">Закрыть</button>' : ''}
    </div>
  `;
  updateProgress();
}

function closeApp() { try { tg.close(); } catch (e) {} }

// === Действия ===
// Повторный замер — это норма, никаких переспрашиваний перед стартом
function startTest(key) {
  state.key = key;
  state.idx = 0;
  state.answers = {};
  state.sync = '';
  state.syncMsg = '';
  // У теста с развилкой первым идёт вопрос-фильтр, а не пункты
  if (getTest(key).filter) { renderFilter(); return; }
  state.screen = 'test';
  renderQuestion();
}

// Ответ на вопрос-фильтр: «есть» — идём в тест, «нет сейчас» — тест пропускается целиком
function answerFilter(has) {
  if (has) {
    state.screen = 'test';
    state.idx = 0;
    state.answers = {};
    renderQuestion();
    return;
  }
  skipTest(state.key);
}

function answer(v) {
  const t = getTest(state.key);
  state.answers[state.idx] = v;
  saveProgress();
  if (state.idx < t.items.length - 1) {
    state.idx++;
    renderQuestion();
  } else {
    finish();
  }
}

function prev() {
  if (state.idx > 0) { state.idx--; renderQuestion(); }
}

async function finish() {
  await store(state.key, SCORERS[state.key](state.answers), {...state.answers});
}

// Тест пропущен по развилке: цифр нет, в базу уходит {skipped: true} и живая фраза
async function skipTest(key) {
  const t = getTest(key);
  await store(key, {nums: [], band: t.filter.skipBand, c: 'ok', data: {skipped: true}}, {});
}

// Общая часть: сохранить результат локально, в облако и в базу
async function store(key, scored, answers) {
  // Прошлый результат остаётся рядом: по нему считается сдвиг словами. В базу
  // он не уходит — запись собирается из data, band и nums.
  const before = results[key];
  results[key] = {
    prev: before ? {nums: before.nums, completed_at: before.completed_at} : null,
    nums: scored.nums,
    band: scored.band,
    c: scored.c,
    data: scored.data,
    answers: answers,
    completed_at: new Date().toISOString()
  };
  answeredNow.add(key);
  saveResultsLocal();
  saveToCloud();
  clearProgress();

  // Ни одного ответа в этом заходе — записи нет вовсе. Пустая запись хуже
  // отсутствия: она нарисует в линии точку, которой не было.
  if (!sessionKeys().length) {
    state.sync = 'error';
    state.syncMsg = 'Записывать пока нечего: в этот раз ни один тест не пройден.';
    // Экран результата рисуем только для существующего теста: по чужому ключу
    // рисовать нечего, и попытка уронила бы страницу.
    if (TESTS.some(t => t.key === key)) renderResult(key);
    return;
  }

  const record = {
    user_id: UID,
    block: BLOCK,
    instrument: INSTRUMENT,
    scores: buildScores(),
    answers: buildAnswers(),
    completed_at: results[key].completed_at
  };

  // sendData НЕ вызываем: он мгновенно закрывает мини-апп, и запись в базу
  // просто не успевает уйти — замер теряется целиком. Пишем напрямую.
  state.sync = 'saving';
  state.syncMsg = 'Сохраняю…';
  renderResult(key);

  const ok = await pushToSupabase(record);
  state.sync = ok ? 'ok' : 'error';
  state.syncMsg = ok
    ? 'Замер записан. Можно вернуться к списку и пройти остальное.'
    : 'Не удалось сохранить — открой замер через бота и попробуй ещё раз.';
  if (state.screen === 'result') renderResult(key);
}

// === Старт ===
(async () => {
  loadResultsLocal();
  cloudRestored = await restoreFromCloud();
  renderHub();
})();

/* ---- Кнопка назад и подтверждение выхода (спека 012) ----
 *
 * Дефект с живого телефона: из страницы некуда вернуться, только закрыть
 * мини-апп. Оба требования записаны в правилах и не были выполнены.
 *
 * Кнопку показываем ТОЛЬКО если есть куда возвращаться: неработающая кнопка
 * хуже отсутствующей. Подтверждение выхода включаем после первого ответа —
 * тому, кто просто заглянул, оно ни к чему; снимаем после результата, потому
 * что работа уже сделана и держать человека незачем.
 */
(function () {
  var t = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (!t) return;
  try {
    if (history.length > 1 && t.BackButton) {
      t.BackButton.onClick(function () { try { history.back(); } catch (e) {} });
      t.BackButton.show();
    }
  } catch (e) {}

  var armed = false;
  function arm() {
    if (armed) return;
    armed = true;
    try { t.enableClosingConfirmation(); } catch (e) {}
  }
  function relax() {
    armed = false;
    try { t.disableClosingConfirmation(); } catch (e) {}
  }
  document.addEventListener("click", arm, true);
  document.addEventListener("input", arm, true);

  // Результат показан — держать человека больше не нужно.
  ["renderResult", "renderDone", "showResult", "showDone"].forEach(function (name) {
    var fn = window[name];
    if (typeof fn !== "function") return;
    window[name] = function () { relax(); return fn.apply(this, arguments); };
  });
})();

</script>
