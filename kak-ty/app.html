<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Что со мной?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F4F2EC;
  --stone: #E8E5DC;
  --graphite: #1A1A1A;
  --graphite-90: rgba(26,26,26,0.9);
  --graphite-75: rgba(26,26,26,0.75);
  --graphite-65: rgba(26,26,26,0.65);
  --graphite-50: rgba(26,26,26,0.5);
  --graphite-30: rgba(26,26,26,0.3);
  --graphite-15: rgba(26,26,26,0.15);
  --graphite-08: rgba(26,26,26,0.08);
  --terracotta: #B85C38;
  --terracotta-tint: rgba(184,92,56,0.08);
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { font-family: var(--font-sans); background: var(--paper); color: var(--graphite); line-height: 1.5; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body { min-height: 100vh; }

/* Безопасные зоны Телеграма: без них верх уезжает под вырез, а низ под панель */
main {
  max-width: 560px; margin: 0 auto;
  padding-top: calc(28px + var(--tg-content-safe-area-inset-top, 0px));
  padding-bottom: calc(44px + var(--tg-safe-area-inset-bottom, 0px));
  padding-left: calc(20px + var(--tg-safe-area-inset-left, 0px));
  padding-right: calc(20px + var(--tg-safe-area-inset-right, 0px));
}
h1 { font-size: 30px; font-weight: 500; letter-spacing: -0.025em; line-height: 1.05; margin-bottom: 22px; }
.note { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--graphite-50); }

/* Наблюдение — главное на экране. Отдаём раньше, чем просим */
.obs { margin-bottom: 26px; }
/* Под наблюдением стоит строка про слепую зону: они про одно, и «рядом
   значит связано» — поэтому зазор до неё меньше, чем до просьбы */
.obs-tight { margin-bottom: 10px; }
.obs-head { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--terracotta); padding-bottom: 8px; border-bottom: 1px solid var(--terracotta); }
.obs-text { font-size: 19px; line-height: 1.4; padding-top: 14px; }

/* Слепая зона — одна тихая строка. Ни счётчика, ни полосы заполнения */
.blind { font-size: 15px; line-height: 1.45; color: var(--graphite-65); margin-bottom: 26px; }

/* Честная строка, когда данных нет или просьбы нет */
.honest { font-size: 17px; line-height: 1.45; margin-bottom: 22px; }
.honest .quiet { display: block; font-size: 15px; color: var(--graphite-65); margin-top: 8px; }

/* Просьба — ровно одна */
.ask-head { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--graphite-50); padding-bottom: 8px; border-bottom: 1px solid var(--graphite-15); }

/* Карточка замера */
.card { padding: 15px 0; border-bottom: 1px solid var(--graphite-08); }
.card-open { display: block; text-decoration: none; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.card-name { font-size: 16px; font-weight: 500; }
.card-open:hover .card-name { color: var(--terracotta); }
.card-sub { font-size: 13px; color: var(--graphite-65); margin-top: 3px; }
.card-when { font-family: var(--font-mono); font-size: 11px; color: var(--graphite-30); margin-top: 6px; }
.card-size { font-family: var(--font-mono); font-size: 11px; color: var(--graphite-50); margin-top: 9px; }
.ask .card { border-bottom: none; }
.ask .card-name { font-size: 20px; }

/* Вход в дорожку «несколько за раз». Отдельная ссылка, не главная просьба */
.runall { margin-top: 30px; }
.runall a { display: inline-block; font-size: 15px; font-weight: 500; color: var(--graphite); text-decoration: none; -webkit-tap-highlight-color: transparent; }
.runall a::after { content: " →"; color: var(--graphite-30); }
.runall a:hover { color: var(--terracotta); }

/* Полный список — за одним нажатием */
.all { margin-top: 30px; border-top: 1px solid var(--graphite-15); }
.all > summary { list-style: none; cursor: pointer; padding: 16px 0; font-size: 15px; font-weight: 500; -webkit-tap-highlight-color: transparent; }
.all > summary::-webkit-details-marker { display: none; }
.all > summary::after { content: " →"; color: var(--graphite-30); }
.all[open] > summary::after { content: " ↑"; }
.all > summary:hover { color: var(--terracotta); }
.all-lead { font-size: 14px; color: var(--graphite-65); margin-bottom: 6px; }

/* Область жизни — свёрнутая строка. На первом развороте списка человек видит
   семь строк со структурой, а не двадцать три карточки подряд */
.area { margin-top: 0; }
.area-head { display: flex; align-items: baseline; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--graphite-15); list-style: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.area-head::-webkit-details-marker { display: none; }
.area-name { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--graphite-50); flex: 1; }
.area-count { font-family: var(--font-mono); font-size: 11px; color: var(--graphite-30); }
/* Знак «раскрыть»: без него свёрнутая строка не выглядит нажимаемой */
.area-head::after { content: "+"; font-family: var(--font-mono); font-size: 13px; line-height: 1; color: var(--graphite-30); }
.area[open] > .area-head::after { content: "–"; }
.area[open] > .area-head .area-name { color: var(--terracotta); }
.area-head:hover .area-name { color: var(--terracotta); }
.area-cards { padding-bottom: 12px; }

/* Замер, который проходится в разговоре с ботом, а не в мини-аппе */
.chat { margin-top: 10px; border: 1px solid var(--graphite-15); padding: 12px; }
.chat-phrase { font-family: var(--font-mono); font-size: 14px; padding: 9px 11px; background: var(--stone); word-break: break-word; }
.chat-acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.chat-hint { font-size: 12px; color: var(--graphite-50); margin-top: 8px; }
/* То же самое одной строкой — для списка, где карточек два десятка */
.chat-line { font-size: 12px; color: var(--graphite-50); margin-top: 6px; }
button.act, a.act { display: inline-block; background: var(--graphite); color: var(--paper); padding: 11px 18px; border: none; font-size: 14px; cursor: pointer; font-family: var(--font-sans); font-weight: 500; text-decoration: none; }
button.act:hover, a.act:hover { background: var(--terracotta); }
button.ghost { background: transparent; color: var(--graphite); border: 1px solid var(--graphite-30); padding: 10px 16px; font-size: 14px; cursor: pointer; font-family: var(--font-sans); }
button.ghost:hover { color: var(--terracotta); border-color: var(--terracotta); }

.foot { margin-top: 34px; padding-top: 16px; border-top: 1px solid var(--graphite-08); font-size: 13px; color: var(--graphite-50); }

@media (max-width: 380px) {
  h1 { font-size: 26px; }
  .obs-text { font-size: 17px; }
  .card-name { font-size: 15px; }
}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
/* ==== ЧИСТАЯ ЛОГИКА: НАЧАЛО ====
   Всё внутри этих границ не трогает DOM и не ходит в сеть.
   Скрипт проверок вырезает этот блок и прогоняет функции на выдуманных данных.
   Менять только вместе с проверками. */

// ---- Контейнеры жизни ----
// Закрытый список из семи, перенос из bot.py (LIFE_CONTAINERS) один в один.
var LIFE_CONTAINERS = ["Семья", "Работа", "Тело", "Деньги", "Я сам", "Круг", "Время на себя"];

// Порядок областей жизни на экране (007, FR-010). Тот же набор, что выше, но
// свой порядок: список читается сверху вниз и начинается с себя.
// Проверка следит, чтобы это была та же семёрка, а не новая таксономия.
var AREA_ORDER = ["Я сам", "Тело", "Семья", "Круг", "Работа", "Деньги", "Время на себя"];

// ---- Ритмы ----
// Сроки замеров. Человеку они больше не показываются: он не приходит с
// периодом, он приходит с вопросом про себя (007, «Что убирается как шум»).
// Список остаётся как перенос из bot.py — по нему проверка сверяет поле
// `section` каждой карточки с реестром бота. Это служебные данные, не экран.
var RHYTHMS = [
  { id: "day",     name: "День",     sub: "сутки" },
  { id: "week",    name: "Неделя",   sub: "семь дней" },
  { id: "month",   name: "Месяц",    sub: "тридцать дней" },
  { id: "quarter", name: "Квартал",  sub: "тринадцать недель" },
  { id: "rare",    name: "Реже",     sub: "полгода" },
  { id: "year",    name: "Раз в год", sub: "двенадцать месяцев" }
];

// ---- Реестр замеров ----
// Перенос из bot.py, COVERAGE_MAP: замеры состояния, список из FR-002a.
// Поля key / label / days взяты БУКВАЛЬНО из COVERAGE_MAP — их сверяет
// отдельная проверка. Каталог ничего не добавляет от себя: новых замеров нет,
// новых вопросов нет, сводных чисел нет (конституция, принцип IV).
//
// Чего здесь СОЗНАТЕЛЬНО нет: level, ztpi, stressrisk и все блоки паспорта.
// Это замеры структуры — стиль совладания, риск-профиль, временная
// перспектива, черты. Они спрашивают «какой я», а не «как мне сейчас», и
// живут за кнопкой «🪞 Как я устроен» (FR-002b, FR-002f).
//
//   key        — ключ блока в таблице passport
//   label      — название, как его видит человек
//   what       — что это даст, одной строкой (пятое поле COVERAGE_MAP)
//   group      — группа из COVERAGE_MAP: Состояние / Пара / Группа
//   days       — срок годности в днях, null — разовый
//   section    — срок из реестра бота; служебное поле, на экране его нет
//   containers — области жизни, которые замер задевает; перенос из CARD_META
//                бота один в один (FR-020, FR-021). Служебное поле: по нему
//                бот считает покрытие. Место карточки в списке — не по нему
//   area       — ОДНА главная область по смыслу замера. Только по ней карточка
//                встаёт в список, и поэтому она стоит там ровно один раз
//   size       — честная длина; посчитано по самим замерам, не придумано
//   url        — адрес мини-аппа; перенос из констант *_MINI_APP_URL в bot.py
//   phrase     — точный текст кнопки бота, если замер проходится в разговоре
//   cond       — условие показа: "clinical" — только когда сработал недельный
//                датчик (приходит `cl=1`); "team" — пока человек прямо не
//                сказал, что команды нет (приходит `tm=0`)
//   once       — разовый: заполнен — карточка уходит (FR-010)
//
// Названия карточек — по СОДЕРЖАНИЮ, а не по сроку (007, FR-011). В `bot.py`
// те же карточки пока называются по сроку — расхождение сознательное.
//
// Строка `what` — одна строка на телефоне. Длинная превращает список в стену
// текста: человек листает двадцать три карточки, а не читает каждую.
var REGISTRY = [
  {
    // Главная область — Тело: сон и тонус мерятся телом, часть полей приезжает
    // с часов. Настроение приходит вместе с ними, поэтому «ещё: Я сам».
    key: "state_day", label: "Тонус и сон", group: "Состояние", days: 1, section: "day",
    what: "тонус, сон и настроение день за днём",
    containers: ["Я сам", "Тело"], area: "Тело",
    size: "6 полей · 20 секунд",
    url: "https://shapovalov-aleksey.ru/state-day/app.html"
  },
  {
    key: "state_week", label: "Самочувствие", group: "Состояние", days: 7, section: "week",
    what: "силы, настроение и поток за неделю",
    containers: ["Я сам"], area: "Я сам",
    size: "25 вопросов · 2 минуты",
    url: "https://shapovalov-aleksey.ru/state-week/app4.html"
  },
  // Четыре короткие карточки недели. Проходятся разговором с ботом, не формой:
  // короткое дешевле спросить в чате, и это уже работает (004, FR-008).
  {
    key: "state_move", label: "Движение", group: "Состояние", days: 7, section: "week",
    what: "сколько дней и минут движения за неделю",
    containers: ["Тело"], area: "Тело",
    size: "2 вопроса · полминуты",
    phrase: "🏃 Движение"
  },
  {
    key: "state_people", label: "Люди рядом", group: "Состояние", days: 7, section: "week",
    what: "одиночество и живые встречи за неделю",
    containers: ["Круг"], area: "Круг",
    size: "4 вопроса · минута",
    phrase: "🫂 Люди рядом"
  },
  {
    // Внутри — все семь областей жизни. Главной выбрано «Время на себя»: это
    // единственный замер, который про него спрашивает. У остальных шести есть
    // свои карточки, а у времени на себя больше нет ничего.
    key: "state_facts", label: "Восемь фактов", group: "Состояние", days: 7, section: "week",
    what: "что было за неделю в каждой области",
    containers: ["Семья", "Работа", "Тело", "Деньги", "Я сам", "Круг", "Время на себя"],
    area: "Время на себя",
    size: "8 отметок · меньше минуты",
    phrase: "✅ Восемь фактов"
  },
  {
    key: "state_note", label: "Что ещё стоит знать", group: "Состояние", days: 7, section: "week",
    what: "одна свободная строка про что угодно",
    containers: ["Я сам"], area: "Я сам",
    size: "одна строка · можно пропустить",
    phrase: "✍️ Что ещё стоит знать"
  },
  {
    key: "pair_state", label: "Как я в наших отношениях", group: "Пара", days: 7, section: "week",
    what: "насколько хорошо вам двоим сейчас",
    containers: ["Семья"], area: "Семья",
    size: "7 вопросов",
    phrase: "🫂 Как я в наших отношениях"
  },
  {
    key: "pair_detector", label: "Детектор взрыва", group: "Пара", days: 7, section: "week",
    what: "маркеры напряжения за неделю",
    containers: ["Семья"], area: "Семья",
    size: "24 маркера · минута",
    phrase: "🌡 Детектор взрыва"
  },
  {
    key: "forum_scales", label: "Цифры группы", group: "Группа", days: 7, section: "week",
    what: "ясность, энергия, продвижение, напряжение",
    containers: ["Круг"], area: "Круг",
    size: "4 шкалы",
    phrase: "👥 Встреча форум-группы"
  },
  {
    // Разовый: уходит, как только заполнен (FR-010).
    key: "pair_context", label: "Про нас", group: "Пара", days: null, section: "once",
    what: "сколько вы вместе, дети и быт",
    containers: ["Семья"], area: "Семья",
    size: "5 вопросов · один раз",
    phrase: "👨‍👩‍👧 Про нас",
    once: true
  },
  {
    // Ядро квартала: проходится разговором, страницы у него нет (005).
    // Метки контейнеров — из CARD_META бота, шесть, а не семь. Главная область —
    // «Я сам»: замер про то, насколько ТЕБЯ устраивает каждая область.
    key: "state_domains", label: "Области жизни", group: "Состояние",
    days: 91, section: "quarter",
    what: "что устраивает в каждой области и что важно",
    containers: ["Семья", "Работа", "Тело", "Деньги", "Я сам", "Круг"],
    area: "Я сам",
    size: "8 областей · 2 минуты",
    phrase: "🌍 Области жизни"
  },
  {
    key: "state_month", label: "Стресс и сон", group: "Состояние", days: 30, section: "month",
    what: "управляемость месяца и как шёл сон",
    containers: ["Я сам", "Тело"], area: "Я сам",
    size: "17 вопросов · 3 минуты",
    url: "https://shapovalov-aleksey.ru/state-month/app3.html"
  },
  {
    key: "state_money", label: "Деньги за месяц", group: "Состояние", days: 30, section: "month",
    what: "хватило ли, запас, долги за месяц",
    containers: ["Деньги"], area: "Деньги",
    size: "5 цифр · можно пропустить",
    phrase: "💵 Деньги за месяц"
  },
  {
    // Условная карточка: появляется, только когда сработал короткий недельный
    // датчик. По умолчанию её нет — лишнее приглашение на девять вопросов про
    // настроение не безобидно (004, FR-010).
    key: "state_clinical", label: "Настроение и тревога подробно",
    group: "Состояние", days: 30, section: "month",
    what: "подробнее, чем четыре вопроса в чате",
    containers: ["Я сам"], area: "Я сам",
    size: "21 вопрос · 4 минуты",
    cond: "clinical",
    url: "https://shapovalov-aleksey.ru/state-clinical/app.html"
  },
  {
    key: "pair_are", label: "Тест ОНИ", group: "Пара", days: 30, section: "month",
    what: "насколько связь надёжна",
    containers: ["Семья"], area: "Семья",
    size: "15 утверждений",
    phrase: "🧭 Тест ОНИ"
  },
  {
    key: "pair_load", label: "Нагрузка по дому", group: "Пара", days: 30, section: "month",
    what: "кто сколько несёт по дому",
    containers: ["Семья"], area: "Семья",
    size: "3 вопроса",
    phrase: "⚖️ Нагрузка"
  },
  {
    key: "state_quarter", label: "Удовлетворённость и смысл", group: "Состояние",
    days: 91, section: "quarter",
    what: "устраивает ли жизнь и есть ли смысл",
    containers: ["Я сам"], area: "Я сам",
    size: "68 вопросов · 7 минут",
    url: "https://shapovalov-aleksey.ru/state-quarter/app3.html"
  },
  {
    // Потребности переехали из месячного: величина медленная, за месяц не
    // двигается (004, FR-013). Своя карточка, а не пункт внутри квартального:
    // так её видно и так же устроен реестр бота.
    key: "state_needs", label: "Потребности", group: "Состояние",
    days: 91, section: "quarter",
    what: "свобода, умение и близость",
    containers: ["Я сам"], area: "Я сам",
    size: "24 вопроса · 4 минуты",
    url: "https://shapovalov-aleksey.ru/state-needs/app.html"
  },
  {
    // Первый замер в области «Работа». Условная наоборот: показывается,
    // пока человек прямо не сказал, что команды нет (004, FR-015).
    key: "state_team", label: "Психобезопасность команды", group: "Состояние",
    days: 91, section: "quarter",
    what: "можно ли в команде ошибаться и говорить",
    containers: ["Работа"], area: "Работа",
    size: "7 утверждений · 2 минуты",
    cond: "team",
    url: "https://shapovalov-aleksey.ru/state-team/app.html"

// и не догадывается: базу он читать не может, а догадка — это уже толкование.
//
//   o=   текст наблюдения, urlencoded, до 400 символов
//   ask= ключ ровно одной предложенной карточки
//   bs=  строка про слепую зону, urlencoded, до 200 символов

  var s = String(raw == null ? "" : raw).trim();
  if (!s) return null;
  return s.length > limit ? s.slice(0, limit) : s;

/**

 * Пусто или пробелы — значит наблюдения нет, а не «пустое наблюдение».
 * Длиннее предела — режем: контракт с ботом 400 символов, и рвать вёрстку

 * Параметра нет — строки нет вообще (008, FR-009).

 */

/** Остальные области, которые замер задевает, кроме своей главной. */

 * «Восемь фактов» задевают все семь, и перечислять шесть имён — это шум.
 */

// ---- Когда замер был ----
// Считается по СУТКАМ, а не по часам: разница часовых поясов не важна.
// Сутки берём по UTC — так же, как бот группирует точки в базе.
function utcMidnight(iso) {
  var d = new Date(iso);
  if (isNaN(d.getTime())) return null;
  return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
}

function daysBetween(fromISO, nowISO) {
  var a = utcMidnight(fromISO), b = utcMidnight(nowISO);
  if (a === null || b === null) return null;
  return Math.round((b - a) / 86400000);
}

/**
 * Что известно про один замер: когда он был и не вышел ли срок.
 *
 * Человеку из этого показывается ТОЛЬКО «когда был». Разница между «ни разу»
 * и «даты не приехали» служебная: человеку в обоих случаях одно — можно
 * пройти (007, «Что убирается как шум»). Само состояние остаётся внутри: по
 * нему уходит из списка разовая карточка, которую уже заполнили.
 *
 * @param lastISO  дата последнего замера или null
 * @param ttlDays  срок годности в днях, null — разовый замер
 * @param nowISO   сейчас
 * @param known    приехали ли даты вообще
 */
function freshness(lastISO, ttlDays, nowISO, known) {
  if (known === false) return { state: "unknown", daysAgo: null, overdue: null };
  if (lastISO === null || lastISO === undefined || lastISO === "") {
    return { state: "never", daysAgo: null, overdue: null };
  }
  var d = daysBetween(lastISO, nowISO);
  if (d === null) return { state: "unknown", daysAgo: null, overdue: null };
  if (d < 0) d = 0;                       // дата из будущего — считаем «сегодня»
  // Разовый замер: прошёл один раз — и хватит, пересдавать нечего.
  if (ttlDays === null || ttlDays === undefined) {
    return { state: "fresh", daysAgo: d, overdue: null };
  }
  // Граница ровно как у бота: `days >= shelf` — срок вышел.
  return { state: d >= ttlDays ? "due" : "fresh", daysAgo: d, overdue: d - ttlDays };
}

/** «сегодня» · «9 дн. назад» · «3 мес назад» — словами бота, чтобы совпадало. */
function agoText(daysAgo) {
  if (daysAgo === null || daysAgo === undefined) return "";
  if (daysAgo < 1) return "сегодня";
  if (daysAgo < 60) return daysAgo + " дн. назад";
  return Math.max(1, Math.floor(daysAgo / 30)) + " мес назад";
}

/**
 * Какие карточки вообще показывать.
 * Парные и групповые прячутся, только если бот прямо сказал «пары нет».
 * Молчание — не признак: у большинства парная работа есть, и спрятать
 * замеры по умолчанию значило бы потерять их снова (FR-012).
 *
 * Условные карточки устроены по-разному, и разница сознательная:
 *   cond "clinical" — УТВЕРЖДЕНИЕ. Нет сигнала — карточки нет. Лишняя парная
 *     карточка безобидна, лишнее приглашение на девять вопросов про
 *     настроение — нет.
 *   cond "team" — ОТРИЦАНИЕ. Карточка показывается, пока человек прямо не
 *     сказал, что команды нет. «Не спрашивали» ≠ «нет».
 */
function visibleCards(registry, opts) {
  var o = opts || {};
  return registry.filter(function (r) {
    if (r.group === "Пара" && o.hasPair === false) return false;
    if (r.group === "Группа" && o.hasForum === false) return false;
    if (r.cond === "clinical" && o.clinicalFired !== true) return false;
    if (r.cond === "team" && o.hasTeam === false) return false;
    return true;
  });
}

/**
 * Собрать карточки и добавить к ним, когда замер был. lastDates — {ключ: ISO}.
 * Разовая карточка, которую уже заполнили, из списка уходит: спрашивать нечего
 * (FR-010). Пока даты неизвестны — остаётся, иначе мы бы её прятали зря.
 */
function buildCards(registry, lastDates, nowISO, known) {
  var d = lastDates || {};
  return registry.map(function (r) {
    var f = freshness(d[r.key] === undefined ? null : d[r.key], r.days, nowISO, known);
    return {
      key: r.key, label: r.label, what: r.what, group: r.group, days: r.days,
      section: r.section, containers: r.containers, area: r.area, size: r.size,
      url: r.url, phrase: r.phrase, after: r.after, once: r.once,
      state: f.state, daysAgo: f.daysAgo
    };
  }).filter(function (c) {
    return !(c.once && c.state === "fresh");
  });
}

/**
 * Разобрать даты замеров от бота: «state_day:2026-08-06,state_week:2026-07-28».
 * Бот читает базу сервисным ключом и знает даты, которых мини-апп не видит.
 * Ключа в строке нет — значит замер не проходили ни разу.
 */
function parseFreshParam(s) {
  var raw = String(s == null ? "" : s).trim();
  if (!raw) return null;

  });
  return out;
}

  });
}

/** Адрес замера с подставленным человеком: без него запись некуда положить. */
function cardHref(card) {
  if (!card.url) return null;
  var sep = card.url.indexOf("?") >= 0 ? "&" : "?";
  return card.url + sep + "v=1&u=tg_" + USER_ID;
}

/**
 * Служебная строка карточки в списке: когда замер был и какие ещё области он
 * задевает. Обе части в ОДНОЙ строке — карточка от них не становится выше.
 *
 * Про «когда был» — только это, и только если знаем. Ни «пора», ни
 * «просрочено»: сроки — забота бота, а не упрёк человеку.
 */
function metaHtml(card) {
  var parts = [];
  if (card.daysAgo || card.daysAgo === 0) {
    parts.push("последний замер " + agoText(card.daysAgo));
  }
  var also = alsoText(card);
  if (also) parts.push(also);
  if (!parts.length) return "";
  return '<div class="card-when">' + esc(parts.join(" · ")) + "</div>";
}

/**
 * Карточка замера. `inList` — карточка стоит в полном списке, а не в просьбе.
 *
 * Разница сознательная. В просьбе карточка одна, и ей можно дать всё: подсказку
 * с фразой, кнопку и запасной путь. В списке карточек два десятка, часть из них
 * стоит сразу в нескольких областях жизни — там подробная подсказка пять раз
 * подряд превращается в шум. В списке остаётся одна строка, а сама карточка и
 * так открывает разговор нажатием.
 *
 * Строка «последний замер … · ещё: …» наоборот: она нужна в списке и не нужна в
 * просьбе. Просьба про то, что будет, а не про то, чего не было, и метка
 * области на единственной карточке первого экрана ей ни к чему (007).
 */
function cardHtml(card, inList) {
  var href = cardHref(card);
  var head =
    '<div class="card-name">' + esc(card.label) + "</div>" +
    '<div class="card-sub">' + esc(card.what) + "</div>" +
    (inList ? metaHtml(card) : "");

  // Замер разговором: нажал карточку — боту уходит `sendData`, и он сам начинает
  // этот замер. Ссылка на переписку остаётся в разметке запасным путём.
  var chatLink = (!href && card.phrase) ? botLink(BOT_NAME, card.key) : null;
  // Обе метки на одном теге: `data-send` — основной путь, `data-tglink` —
  // запасной. Какой сработает, решается в момент нажатия.
  var send = chatLink
    ? ' data-send="' + esc(cardPayload(card.key)) +
      '" data-tglink="' + esc(chatLink) + '"'
    : "";

  var openable;
  if (href) {
    openable = '<a class="card-open" href="' + esc(href) + '">' + head + "</a>";
  } else if (chatLink) {
    openable = '<a class="card-open" href="' + esc(chatLink) + '"' + send + ">" +
      head + "</a>";
  } else {
    openable = "<div>" + head + "</div>";
  }

  var chat = "";
  if (chatLink && inList) {
    chat = '<div class="chat-line">идёт разговором — нажми, бот начнёт сам</div>';
  } else if (chatLink) {
    chat =
      '<div class="chat">' +
        '<div class="chat-phrase">' + esc(card.phrase) + "</div>" +
        '<div class="chat-acts">' +
          '<a class="act" href="' + esc(chatLink) + '"' + send + ">Открыть разговор</a>" +
          '<button class="ghost" data-copy="' + esc(card.phrase) + '">Скопировать фразу</button>' +
        "</div>" +
        '<div class="chat-hint">Этот замер идёт разговором, не формой. Нажми — бот начнёт сам. ' +
        "Если ничего не произошло, скопируй фразу и отправь её в чат.</div>" +
      "</div>";
  }
  if (!href && !card.phrase && card.after) {
    chat = '<div class="chat-line">идёт следом за квартальным замером, сразу после него</div>';
  }

  return '<div class="card">' + openable +
    '<div class="card-size">' + esc(card.size) + "</div>" +
    chat + "</div>";
}

/** Блок наблюдения. Текст бота — как есть, вокруг только подпись. */
function obsHtml(text, tight) {
  return '<div class="obs' + (tight ? " obs-tight" : "") + '">' +
    '<div class="obs-head">Что видно по твоим ответам</div>' +
    '<div class="obs-text">' + esc(text) + "</div></div>";
}

/**
 * Строка про слепую зону. Ровно текст бота и ничего больше: ни подписи, ни
 * счётчика, ни своей формулировки. Разметку внутри обезвреживаем — как в
 * наблюдении: текст приезжает из адреса, и живой тег из него ничего не делает.
 */
function blindHtml(text) {
  return '<div class="blind">' + esc(text) + "</div>";
}

/** Первый экран: сначала отдали, потом попросили. И попросили одно. */
function firstScreenHtml(obs, ask, blind) {
  var state = screenState(obs, ask);
  var out = "";

  if (state === "observation_ask" || state === "observation_only") {
    out += obsHtml(obs, !!blind);
  } else {
    out += '<div class="honest">Про тебя я пока ничего не знаю.';
    if (state === "quiet") {
      out += '<span class="quiet">Просьбы сейчас тоже нет. Загляни через неделю ' +
        "— или открой список ниже и выбери сам.</span>";
    }
    out += "</div>";
  }

  // Слепая зона стоит под наблюдением и выше просьбы: сначала честно про то,
  // что бот видит и чего не видит, и только потом просьба.
  if (blind) out += blindHtml(blind);

  if (state === "observation_ask") {
    out += '<div class="ask"><div class="ask-head">Чтобы сказать точнее, не хватает одного</div>' +
      cardHtml(ask, false) + "</div>";
  } else if (state === "first_step") {
    out += '<div class="ask"><div class="ask-head">Начни с этого — оно открывает больше всего</div>' +
      cardHtml(ask, false) + "</div>";
  } else if (state === "observation_only") {
    out += '<div class="honest">Сейчас ничего не нужно. Загляни через неделю.</div>';
  }

  return out;
}

/**
 * Вход в дорожку «несколько за раз». Отдельная ссылка ниже одной просьбы, а не
 * вместо неё: просьба на экране остаётся одна (008, FR-010).
 *
 * Текст честно говорит, кому это надо: тому, кто пришёл разбираться сам.
 * Обещаний «узнай себя полностью» тут нет — за вечер получается широкий срез,
 * а не линия, и говорит об этом бот на входе в дорожку.
 */
function runAllHtml() {
  var href = runAllLink(BOT_NAME);
  return '<div class="runall"><a href="' + esc(href) +
    '" data-send="' + esc(runAllPayload()) +
    '" data-tglink="' + esc(href) + '">' +
    "Хочешь разобраться, а не ответить на напоминание — пройти несколько за раз" +
    "</a></div>";
}

/**
 * Одна область жизни в полном списке — СВЁРНУТАЯ.
 *
 * Человек открывает список и видит семь строк со структурой, а не двадцать три
 * карточки подряд. Нужную область раскрывает сам. Ничего не отнимаем: все
 * замеры на месте, просто их не выливают все сразу.
 */
function areaHtml(group) {
  return '<details class="area"><summary class="area-head">' +
    '<span class="area-name">' + esc(group.area) + "</span>" +
    '<span class="area-count">' + group.cards.length + "</span></summary>" +
    '<div class="area-cards">' +
    group.cards.map(function (c) { return cardHtml(c, true); }).join("") +
    "</div></details>";
}

/** Полный список — за одним нажатием, по областям жизни. */
function allHtml(cards) {
  return '<details id="all" class="all"><summary>Посмотреть всё</summary>' +
    '<p class="all-lead">Всё, что можно про себя померить, по областям жизни. ' +
    "Это не список дел: проходи то, про что самому интересно.</p>" +
    byArea(cards).map(areaHtml).join("") +
    '<div class="foot">Одного числа на всё нет и не будет: разные замеры мерят разное, ' +
    "складывать их — терять то, ради чего мерили." +
    "<br><br>Здесь только состояние: как тебе сейчас. Из чего ты устроен — личность, нейротип, " +
    "ценности, уровень мышления, ощущение времени, стресс и риск — за кнопкой " +
    "«🪞 Как я устроен». Один замер не бывает за двумя дверями.</div>" +
    "</details>";
}

function render() {
  var cards = buildCards(visibleCards(REGISTRY, {
                           hasPair: HAS_PAIR, hasForum: HAS_FORUM,
                           clinicalFired: CLINICAL_FIRED, hasTeam: HAS_TEAM
                         }),
                         lastDates, new Date().toISOString(), dataKnown);
  var ask = pickAsk(cards, ASK_KEY);

  app.innerHTML =
    "<h1>Что со мной?</h1>" +
    firstScreenHtml(OBSERVATION, ask, BLIND_SPOT) +
    runAllHtml() +
    allHtml(cards);

  bind();
}

function bind() {
  // Открыть замер-разговор. Три пути, по убыванию надёжности:
  //   1. `sendData` — боту уходит апдейт `web_app_data`, он начинает замер сам;
  //   2. `openTelegramLink` — открывает переписку. Старт-параметр в ней
  //      теряется, если чат уже существует, поэтому это запасной путь, а не
  //      основной. Рядом всегда есть фраза, которую можно скопировать;
  //   3. обычная ссылка — так работает в браузере вне Телеграма.
  //
  // Слушатель ставится на элементы ТОЛЬКО что собранной разметки: каждый render
  // делает их заново, поэтому навесить дважды на один элемент нельзя.
  app.querySelectorAll("[data-tglink]").forEach(function (el) {
    el.addEventListener("click", function (ev) {
      var payload = el.getAttribute("data-send");
      if (payload && canSendData(tg)) {
        ev.preventDefault();
        ev.stopPropagation();
        try {
          tg.sendData(payload);
          return;
        } catch (e) {}                  // не ушло — падаем в запасной путь
      }
      if (!tg || typeof tg.openTelegramLink !== "function") return;
      ev.preventDefault();
      ev.stopPropagation();
      try { tg.openTelegramLink(el.getAttribute("data-tglink")); } catch (e) {}
    });
  });

  app.querySelectorAll("[data-copy]").forEach(function (el) {
    el.addEventListener("click", function (ev) {
      ev.stopPropagation();
      var text = el.getAttribute("data-copy");
      var done = function () { el.textContent = "Скопировано"; };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
        } else { fallbackCopy(text, done); }
      } catch (e) { fallbackCopy(text, done); }
    });
  });
}

function fallbackCopy(text, done) {
  try {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    done();
  } catch (e) {}
}

// ---- Старт ----
async function start() {
  // Сначала показываем экран — наблюдение и просьба уже приехали в адресе.
  // Даты замеров догоняют: они нужны только полному списку.
  if (FRESH_PARAM) { lastDates = FRESH_PARAM; dataKnown = true; }
  render();

  var fromDb = await fetchPassportDates();
  if (fromDb) {
    Object.keys(fromDb).forEach(function (k) { lastDates[k] = fromDb[k]; });
    dataKnown = true;
    render();
  }
}

if (!USER_ID) {
  app.innerHTML =
    "<h1>Что со мной?</h1>" +
    '<p class="honest">Этот экран открывается из бота — так он знает, чьи это замеры ' +
    "и что по ним видно.</p>" +
    '<p class="note">Если открыл ссылку из браузера, вернись в Телеграм.</p>';
} else {
  start();
}
</script>
</body>
