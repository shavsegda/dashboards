<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Что со мной?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F4F2EC;
  --stone: #E8E5DC;
  --graphite: #1A1A1A;
  --graphite-90: rgba(26,26,26,0.9);
  --graphite-75: rgba(26,26,26,0.75);
  --graphite-65: rgba(26,26,26,0.65);
  --graphite-50: rgba(26,26,26,0.5);
  --graphite-30: rgba(26,26,26,0.3);
  --graphite-15: rgba(26,26,26,0.15);
  --graphite-08: rgba(26,26,26,0.08);
  --terracotta: #B85C38;
  --terracotta-tint: rgba(184,92,56,0.08);
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { font-family: var(--font-sans); background: var(--paper); color: var(--graphite); line-height: 1.5; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body { min-height: 100vh; }

/* Безопасные зоны Телеграма: без них верх уезжает под вырез, а низ под панель */
main {
  max-width: 560px; margin: 0 auto;
  padding-top: calc(28px + var(--tg-content-safe-area-inset-top, 0px));
  padding-bottom: calc(44px + var(--tg-safe-area-inset-bottom, 0px));
  padding-left: calc(20px + var(--tg-safe-area-inset-left, 0px));
  padding-right: calc(20px + var(--tg-safe-area-inset-right, 0px));
}
h1 { font-size: 30px; font-weight: 500; letter-spacing: -0.025em; line-height: 1.05; margin-bottom: 22px; }
.note { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--graphite-50); }

/* Наблюдение — главное на экране. Отдаём раньше, чем просим */
.obs { margin-bottom: 26px; }
/* Под наблюдением стоит строка про слепую зону: они про одно, и «рядом
   значит связано» — поэтому зазор до неё меньше, чем до просьбы */
.obs-tight { margin-bottom: 10px; }
.obs-head { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--terracotta); padding-bottom: 8px; border-bottom: 1px solid var(--terracotta); }
.obs-text { font-size: 19px; line-height: 1.4; padding-top: 14px; }

/* Слепая зона — одна тихая строка. Ни счётчика, ни полосы заполнения */
.blind { font-size: 15px; line-height: 1.45; color: var(--graphite-65); margin-bottom: 26px; }

/* Честная строка, когда данных нет или просьбы нет */
.honest { font-size: 17px; line-height: 1.45; margin-bottom: 22px; }
.honest .quiet { display: block; font-size: 15px; color: var(--graphite-65); margin-top: 8px; }

/* Просьба — ровно одна */
.ask-head { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--graphite-50); padding-bottom: 8px; border-bottom: 1px solid var(--graphite-15); }

/* Карточка замера */
.card { padding: 15px 0; border-bottom: 1px solid var(--graphite-08); }
.card-open { display: block; text-decoration: none; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.card-name { font-size: 16px; font-weight: 500; }
.card-open:hover .card-name { color: var(--terracotta); }
.card-sub { font-size: 13px; color: var(--graphite-65); margin-top: 3px; }
.card-when { font-family: var(--font-mono); font-size: 11px; color: var(--graphite-30); margin-top: 6px; }
.card-size { font-family: var(--font-mono); font-size: 11px; color: var(--graphite-50); margin-top: 9px; }
.ask .card { border-bottom: none; }
.ask .card-name { font-size: 20px; }

/* Замер, на который бот не приглашает: тихий блок ниже просьбы. Не карточка —
   карточка на первом экране читается как просьба, а просьба одна (спека 020) */
.mine { margin-top: 26px; }
.mine-head { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--graphite-50); padding-bottom: 8px; border-bottom: 1px solid var(--graphite-08); }
.mine-open { display: block; text-decoration: none; color: inherit; padding-top: 13px; -webkit-tap-highlight-color: transparent; }
.mine-name { font-size: 16px; font-weight: 500; }
.mine-open:hover .mine-name { color: var(--terracotta); }
.mine-sub { font-size: 13px; color: var(--graphite-65); margin-top: 3px; }
.mine-size { font-family: var(--font-mono); font-size: 11px; color: var(--graphite-50); margin-top: 9px; }
.mine-why { font-size: 12px; color: var(--graphite-50); margin-top: 8px; }

/* Вход в дорожку «несколько за раз». Отдельная ссылка, не главная просьба */
.runall { margin-top: 30px; }
.runall a { display: inline-block; font-size: 15px; font-weight: 500; color: var(--graphite); text-decoration: none; -webkit-tap-highlight-color: transparent; }
.runall a::after { content: " →"; color: var(--graphite-30); }
.runall a:hover { color: var(--terracotta); }

/* Экраны дорожки: строка и действия. Своя рамка, чтобы дорожка не читалась
   ни как карточка замера, ни как просьба */
.track { margin-top: 22px; border: 1px solid var(--graphite-15); padding: 14px 16px; }
.track-line { font-size: 15px; line-height: 1.45; }
.track-acts { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

/* Сшитый итог — один текст, а не столбик результатов */
.stitch { font-size: 17px; line-height: 1.55; margin-bottom: 6px; }

/* Полный список — за одним нажатием */
.all { margin-top: 30px; border-top: 1px solid var(--graphite-15); }
.all > summary { list-style: none; cursor: pointer; padding: 16px 0; font-size: 15px; font-weight: 500; -webkit-tap-highlight-color: transparent; }
.all > summary::-webkit-details-marker { display: none; }
.all > summary::after { content: " →"; color: var(--graphite-30); }
.all[open] > summary::after { content: " ↑"; }
.all > summary:hover { color: var(--terracotta); }
.all-lead { font-size: 14px; color: var(--graphite-65); margin-bottom: 6px; }

/* Ритм — свёрнутая строка. На первом развороте списка человек видит строки со
   структурой, а не двадцать три карточки подряд */
.rhythm { margin-top: 0; }
.rhythm-head { display: flex; align-items: baseline; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--graphite-15); list-style: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.rhythm-head::-webkit-details-marker { display: none; }
.rhythm-name { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--graphite-50); flex: 1; }
.rhythm-count { font-family: var(--font-mono); font-size: 11px; color: var(--graphite-30); }
/* Знак «раскрыть»: без него свёрнутая строка не выглядит нажимаемой */
.rhythm-head::after { content: "+"; font-family: var(--font-mono); font-size: 13px; line-height: 1; color: var(--graphite-30); }
.rhythm[open] > .rhythm-head::after { content: "–"; }
.rhythm[open] > .rhythm-head .rhythm-name { color: var(--terracotta); }
.rhythm-head:hover .rhythm-name { color: var(--terracotta); }
.rhythm-cards { padding-bottom: 12px; }

/* Замер, который проходится в разговоре с ботом, а не в мини-аппе */
.chat { margin-top: 10px; border: 1px solid var(--graphite-15); padding: 12px; }
.chat-phrase { font-family: var(--font-mono); font-size: 14px; padding: 9px 11px; background: var(--stone); word-break: break-word; }
.chat-acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.chat-hint { font-size: 12px; color: var(--graphite-50); margin-top: 8px; }
/* То же самое одной строкой — для списка, где карточек два десятка */
.chat-line { font-size: 12px; color: var(--graphite-50); margin-top: 6px; }
/* Карточка, у которой своей кнопки нет: она запускается следом за другим
   замером. Приглушённое имя — чтобы она не выглядела кнопкой (спека 020) */
.card-noopen .card-name { color: var(--graphite-50); font-weight: 400; }
button.act, a.act { display: inline-block; background: var(--graphite); color: var(--paper); padding: 11px 18px; border: none; font-size: 14px; cursor: pointer; font-family: var(--font-sans); font-weight: 500; text-decoration: none; }
button.act:hover, a.act:hover { background: var(--terracotta); }
button.ghost { background: transparent; color: var(--graphite); border: 1px solid var(--graphite-30); padding: 10px 16px; font-size: 14px; cursor: pointer; font-family: var(--font-sans); }
button.ghost:hover { color: var(--terracotta); border-color: var(--terracotta); }

.foot { margin-top: 34px; padding-top: 16px; border-top: 1px solid var(--graphite-08); font-size: 13px; color: var(--graphite-50); }

@media (max-width: 380px) {
  h1 { font-size: 26px; }
  .obs-text { font-size: 17px; }
  .card-name { font-size: 15px; }
}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
/* ==== ЧИСТАЯ ЛОГИКА: НАЧАЛО ====
   Всё внутри этих границ не трогает DOM и не ходит в сеть.
   Скрипт проверок вырезает этот блок и прогоняет функции на выдуманных данных.
   Менять только вместе с проверками. */

// ---- Контейнеры жизни ----
// Закрытый список из семи, перенос из bot.py (LIFE_CONTAINERS) один в один.
var LIFE_CONTAINERS = ["Семья", "Работа", "Тело", "Деньги", "Я сам", "Круг", "Время на себя"];

// Порядок областей жизни. С 10.08.2026 список по ним больше не группируется —
// область стала меткой на карточке. Порядок остаётся нужен дорожке: по нему она
// решает, какую область закрывать раньше. Проверка следит, чтобы это была та же
// семёрка из bot.py, а не новая таксономия.
var AREA_ORDER = ["Я сам", "Тело", "Семья", "Круг", "Работа", "Деньги", "Время на себя"];

// ---- Ритмы ----
//
// ПРАВКА 10.08.2026, решение Алексея. Список внутри «Посмотреть всё» идёт
// РИТМАМИ, а не областями жизни. Дословно: «мне неудобно сейчас пользоваться
// этой кнопкой, мне бы было удобно поделить замеры на: ежедневно, еженедельно,
// ежемесячно, квартально, полгода, год». Шесть ритмов, для всех людей одни и те
// же, в порядке от частого к редкому.
//
// Почему так. У человека, который пришёл впервые, работа одна — «что со мной
// вообще», и её закрывает первый экран. У вернувшегося работа другая — «что мне
// пора пройти», и по областям жизни он этого не находит: ему нужен срок, а не
// тема. Спека 007 (FR-010) убрала ритмы совсем и вместе с первой работой убила
// вторую. Теперь обе на месте: список идёт ритмами, область видна меткой на
// карточке.
//
// Идентификаторы — перенос поля `section` из CARD_META бота, один в один.
// Название — то, что видит человек.
var RHYTHMS = [
  { id: "day",     name: "Сутки" },
  { id: "week",    name: "Неделя" },
  { id: "month",   name: "Месяц" },
  { id: "quarter", name: "Квартал" },
  { id: "rare",    name: "Полгода" },
  { id: "year",    name: "Год" }
];

// Разовый замер — не ритм: он проходится один раз и уходит. Поэтому он стоит
// последним отдельным блоком и назван по-честному, а не приписан к сроку,
// которого у него нет. В CARD_META бота у него та же метка — `once`.
var ONCE_RHYTHM = { id: "once", name: "Один раз" };

// ---- Реестр замеров ----
// Перенос из bot.py, COVERAGE_MAP: замеры состояния, список из FR-002a.
// Поля key / label / days взяты БУКВАЛЬНО из COVERAGE_MAP — их сверяет
// отдельная проверка. Каталог ничего не добавляет от себя: новых замеров нет,
// новых вопросов нет, сводных чисел нет (конституция, принцип IV).
//
// Чего здесь СОЗНАТЕЛЬНО нет: level, ztpi, stressrisk и все блоки паспорта.
// Это замеры структуры — стиль совладания, риск-профиль, временная
// перспектива, черты. Они спрашивают «какой я», а не «как мне сейчас», и
// живут за кнопкой «🪞 Как я устроен» (FR-002b, FR-002f).
//
//   key        — ключ блока в таблице passport
//   label      — название, как его видит человек
//   what       — что это даст, одной строкой (пятое поле COVERAGE_MAP)
//   group      — группа из COVERAGE_MAP: Состояние / Пара / Группа
//   days       — срок годности в днях, null — разовый
//   section    — РИТМ замера, перенос из CARD_META бота. С 10.08.2026 по нему
//                карточка встаёт в список, и поэтому стоит там ровно один раз
//   containers — области жизни, которые замер задевает; перенос из CARD_META
//                бота один в один (FR-020, FR-021). Служебное поле: по нему
//                бот считает покрытие. Место карточки в списке — не по нему
//   area       — ОДНА главная область по смыслу замера. Метка на карточке и
//                порядок дорожки. Место в списке задаёт ритм, не она
//   size       — честная длина; посчитано по самим замерам, не придумано
//   url        — адрес мини-аппа; перенос из констант *_MINI_APP_URL в bot.py
//   track      — страница умеет дорожку «несколько за раз»: сама открывает
//                следующий замер. Не умеет — в очередь не берём, иначе цепочка
//                оборвётся на ней и человек застрянет (011, История 3)
//   phrase     — точный текст кнопки бота, если замер проходится в разговоре
//   need       — что человеку нужно принести, чтобы замер имел смысл: "pair" —
//                второй человек, "group" — группа, "labs" — PDF анализов. Стоит
//                только у карточек без своей страницы: им и предупреждать
//                (спека 020)
//   cond       — условие показа: "clinical" — только когда сработал недельный
//                датчик (приходит `cl=1`); "team" — пока человек прямо не
//                сказал, что команды нет (приходит `tm=0`)
//   once       — разовый: заполнен — карточка уходит (FR-010)
//
// Названия карточек — по СОДЕРЖАНИЮ, а не по сроку (007, FR-011). В `bot.py`
// те же карточки пока называются по сроку — расхождение сознательное.
//
// Строка `what` — одна строка на телефоне. Длинная превращает список в стену
// текста: человек листает двадцать три карточки, а не читает каждую.
var REGISTRY = [
  {
    // Главная область — Тело: сон и тонус мерятся телом, часть полей приезжает
    // с часов. Настроение приходит вместе с ними, поэтому «ещё: Я сам».
    key: "state_day", label: "Тонус и сон", group: "Состояние", days: 1, section: "day",
    what: "тонус, сон и настроение день за днём",
    containers: ["Я сам", "Тело"], area: "Тело",
    size: "6 полей · 20 секунд",
    url: "https://shapovalov-aleksey.ru/state-day/app.html"
  },
  {
    key: "state_week", label: "Самочувствие", group: "Состояние", days: 7, section: "week",
    what: "силы, настроение и поток за неделю",
    containers: ["Я сам"], area: "Я сам",
    size: "25 вопросов · 2 минуты",
    url: "https://shapovalov-aleksey.ru/state-week/app4.html"
  },
  // Четыре короткие карточки недели. Раньше проходились разговором с ботом.
  // Переехали на страницы 07.08.2026 (спека 011): человек нажимал карточку и
  // оказывался в чате — без списка, без кнопки назад и без понятного конца
  // замера. Плюс сам мост не работал: Телеграм выбрасывает параметр ссылки,
  // если чат с ботом уже есть.
  {
    key: "state_move", label: "Движение", group: "Состояние", days: 7, section: "week",
    what: "сколько дней и минут движения за неделю",
    containers: ["Тело"], area: "Тело",
    size: "2 вопроса · полминуты",
    track: true,
    url: "https://shapovalov-aleksey.ru/state-move/app.html"
  },
  {
    key: "state_people", label: "Люди рядом", group: "Состояние", days: 7, section: "week",
    what: "одиночество и живые встречи за неделю",
    containers: ["Круг"], area: "Круг",
    size: "4 вопроса · минута",
    track: true,
    url: "https://shapovalov-aleksey.ru/state-people/app.html"
  },
  {
    // Внутри — все семь областей жизни. Главной выбрано «Время на себя»: это
    // единственный замер, который про него спрашивает. У остальных шести есть
    // свои карточки, а у времени на себя больше нет ничего.
    key: "state_facts", label: "Восемь фактов", group: "Состояние", days: 7, section: "week",
    what: "что было за неделю в каждой области",
    containers: ["Семья", "Работа", "Тело", "Деньги", "Я сам", "Круг", "Время на себя"],
    area: "Время на себя",
    size: "8 отметок · меньше минуты",
    track: true,
    url: "https://shapovalov-aleksey.ru/state-facts/app.html"
  },
  {
    key: "state_note", label: "Что ещё стоит знать", group: "Состояние", days: 7, section: "week",
    what: "одна свободная строка про что угодно",
    containers: ["Я сам"], area: "Я сам",
    size: "одна строка · можно пропустить",
    track: true,
    url: "https://shapovalov-aleksey.ru/state-note/app.html"
  },
  {
    key: "pair_state", label: "Как я в наших отношениях", group: "Пара", days: 7, section: "week",
    what: "насколько хорошо вам двоим сейчас",
    containers: ["Семья"], area: "Семья",
    size: "7 вопросов",
    need: "pair",
    phrase: "🫂 Как я в наших отношениях"
  },
  {
    key: "pair_detector", label: "Детектор взрыва", group: "Пара", days: 7, section: "week",
    what: "маркеры напряжения за неделю",
    containers: ["Семья"], area: "Семья",
    size: "24 маркера · минута",
    need: "pair",
    phrase: "🌡 Детектор взрыва"
  },
  {
    key: "forum_scales", label: "Цифры группы", group: "Группа", days: 7, section: "week",
    what: "ясность, энергия, продвижение, напряжение",
    containers: ["Круг"], area: "Круг",
    size: "4 шкалы",
    need: "group",
    phrase: "👥 Встреча форум-группы"
  },
  {
    // Разовый: уходит, как только заполнен (FR-010).
    key: "pair_context", label: "Про нас", group: "Пара", days: null, section: "once",
    what: "сколько вы вместе, дети и быт",
    containers: ["Семья"], area: "Семья",
    size: "5 вопросов · один раз",
    need: "pair",
    phrase: "👨‍👩‍👧 Про нас",
    once: true
  },
  {

// и не догадывается: базу он читать не может, а догадка — это уже толкование.

//   o=   текст наблюдения, urlencoded, до 400 символов

//   bs=  строка про слепую зону, urlencoded, до 200 символов

// Нет `bs` — строки про слепую зону нет вовсе, пустого места не остаётся.

  var s = String(raw == null ? "" : raw).trim();
  if (!s) return null;
  return s.length > limit ? s.slice(0, limit) : s;
}

/**
 * Текст наблюдения к показу. Показывается КАК ЕСТЬ: ни слова от мини-аппа.
 * Пусто или пробелы — значит наблюдения нет, а не «пустое наблюдение».
 * Длиннее предела — режем: контракт с ботом 400 символов, и рвать вёрстку
 * длинным текстом ни к чему.

 * Параметра нет — строки нет вообще (008, FR-009).

/**
 * Карточка просьбы по ключу от бота. Ключа нет среди видимых карточек — значит

  var k = String(key == null ? "" : key).trim();

 *   first_step       — наблюдения нет: сказать честно и предложить первый шаг
 *   quiet            — нет ни того, ни другого

  if (obs && ask) return "observation_ask";

/**

// ---- Когда замер был ----
// Считается по СУТКАМ, а не по часам: разница часовых поясов не важна.

function utcMidnight(iso) {

  return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());

function daysBetween(fromISO, nowISO) {
  var a = utcMidnight(fromISO), b = utcMidnight(nowISO);
  if (a === null || b === null) return null;
  return Math.round((b - a) / 86400000);
}

/**
 * Что известно про один замер: когда он был и не вышел ли срок.
 *
 * Человеку из этого показывается ТОЛЬКО «когда был». Разница между «ни разу»
 * и «даты не приехали» служебная: человеку в обоих случаях одно — можно
 * пройти (007, «Что убирается как шум»). Само состояние остаётся внутри: по
 * нему уходит из списка разовая карточка, которую уже заполнили.
 *
 * @param lastISO  дата последнего замера или null
 * @param ttlDays  срок годности в днях, null — разовый замер
 * @param nowISO   сейчас
 * @param known    приехали ли даты вообще
 */
function freshness(lastISO, ttlDays, nowISO, known) {
  if (known === false) return { state: "unknown", daysAgo: null, overdue: null };
  if (lastISO === null || lastISO === undefined || lastISO === "") {
    return { state: "never", daysAgo: null, overdue: null };
  }
  var d = daysBetween(lastISO, nowISO);
  if (d === null) return { state: "unknown", daysAgo: null, overdue: null };
  if (d < 0) d = 0;                       // дата из будущего — считаем «сегодня»
  // Разовый замер: прошёл один раз — и хватит, пересдавать нечего.
  if (ttlDays === null || ttlDays === undefined) {
    return { state: "fresh", daysAgo: d, overdue: null };
  }
  // Граница ровно как у бота: `days >= shelf` — срок вышел.
  return { state: d >= ttlDays ? "due" : "fresh", daysAgo: d, overdue: d - ttlDays };
}

/** «сегодня» · «9 дн. назад» · «3 мес назад» — словами бота, чтобы совпадало. */
function agoText(daysAgo) {
  if (daysAgo === null || daysAgo === undefined) return "";
  if (daysAgo < 1) return "сегодня";
  if (daysAgo < 60) return daysAgo + " дн. назад";
  return Math.max(1, Math.floor(daysAgo / 30)) + " мес назад";
}

/**
 * Какие карточки вообще показывать.
 * Парные и групповые прячутся, только если бот прямо сказал «пары нет».
 * Молчание — не признак: у большинства парная работа есть, и спрятать
 * замеры по умолчанию значило бы потерять их снова (FR-012).
 *
 * Условные карточки устроены по-разному, и разница сознательная:
 *   cond "clinical" — УТВЕРЖДЕНИЕ. Нет сигнала — карточки нет. Лишняя парная
 *     карточка безобидна, лишнее приглашение на девять вопросов про
 *     настроение — нет.
 *   cond "team" — ОТРИЦАНИЕ. Карточка показывается, пока человек прямо не
 *     сказал, что команды нет. «Не спрашивали» ≠ «нет».
 */
function visibleCards(registry, opts) {
  var o = opts || {};
  return registry.filter(function (r) {
    if (r.group === "Пара" && o.hasPair === false) return false;
    if (r.group === "Группа" && o.hasForum === false) return false;
    if (r.cond === "clinical" && o.clinicalFired !== true) return false;
    if (r.cond === "team" && o.hasTeam === false) return false;
    return true;
  });
}

/**
 * Собрать карточки и добавить к ним, когда замер был. lastDates — {ключ: ISO}.
 * Разовая карточка, которую уже заполнили, из списка уходит: спрашивать нечего
 * (FR-010). Пока даты неизвестны — остаётся, иначе мы бы её прятали зря.
 */
function buildCards(registry, lastDates, nowISO, known) {
  var d = lastDates || {};
  return registry.map(function (r) {
    var f = freshness(d[r.key] === undefined ? null : d[r.key], r.days, nowISO, known);
    return {
      key: r.key, label: r.label, what: r.what, group: r.group, days: r.days,
      section: r.section, containers: r.containers, area: r.area, size: r.size,
      url: r.url, phrase: r.phrase, after: r.after, once: r.once, track: r.track,
      // Что нужно принести (спека 020). Без переноса карточка на экране молчала
      // бы про второго человека: сюда попадает то, что видит человек.
      need: r.need,
      state: f.state, daysAgo: f.daysAgo

/** Разобрать «tg_121202001» в число. Мусор — null, читать нечем. */

/**
 * Разобрать даты замеров от бота: «state_day:2026-08-06,state_week:2026-07-28».
 * Бот читает базу сервисным ключом и знает даты, которых мини-апп не видит.
 * Ключа в строке нет — значит замер не проходили ни разу.

  var raw = String(s == null ? "" : s).trim();
  if (!raw) return null;
  var out = {};

    var m = /^([a-z_]+)[:=](\d{4}-\d{2}-\d{2}(?:[T ][^,]*)?)$/.exec(part.trim());

/**
 * Достать из строки истории запись одной карточки (019).
 *
 * Контракт с ботом:
 *   h      = запись ("~" запись)*
 *   запись = ключ "!" ключи_линий "!" точка ("!" точка)*
 *
 * Каталог тут ПОСРЕДНИК, как и с флагами: он не толкует и не додумывает, а
 * отдаёт странице ровно её запись. Чужие записи страница всё равно не читает, а
 * длину адреса тратят — а адрес и так тесный.

 * как настоящие данные.

  var parts = String(s == null ? "" : s).split("~");

}

/* ---- Флаги, которые каталог передаёт страницам замеров (011) ----
 *
 * Страница не читает базу. Всё, что знает только бот — есть ли дети, команда,

 * параметрами адреса. Бот присылает их каталогу, каталог отдаёт странице.

 * Каталог тут ПОСРЕДНИК: он не толкует и не додумывает. Значение принимается
 * только настоящее — «0» или «1». Мусор дальше не едет, и молчание бота остаётся

function pageFlags(params) {
  var out = "";
  PAGE_FLAG_NAMES.forEach(function (n) {
    var v = (params && typeof params.get === "function") ? params.get(n) : null;

// Часть замеров идёт разговором, а не формой. Открывает их `sendData`: бот

/** Самая свежая дата по каждому блоку из строк passport. */

/* ---- Кнопка назад: решение (спека 012) ----
 *
 * Дефект нашёл Алексей на телефоне: зашёл в карточку — назад пути нет, только

 * Уровни держим стеком: `[]` — первый экран, `['all']` — открыт список,

function navPush(stack, id) {

  if (out[out.length - 1] === id) return out;   // повторный вход не копит стек

/* ==== ДОРОЖКА: НАЧАЛО ====
 *

 * собирает очередь и открывает первый замер; каждая страница, закончив свой,

 * раньше очередь держал бот, и человека выбрасывало в переписку на каждом шаге.

 * делаем — они разъедутся, и однажды в базу уедет прошлое как свежее.
 *
 * Этот блок побайтово одинаков в каталоге и на всех девяти страницах замеров.
 * Разъехались бы — дорожка на одной странице считала бы усталость иначе, чем на

/** Запись дорожки из памяти телефона. Мусор и чужая версия — null, не догадка. */

  if (!r || typeof r !== "object" || r.v !== 1) return null;
  if (!Array.isArray(r.queue) || !Array.isArray(r.done)) return null;
  if (r.state !== "run" && r.state !== "finish" && r.state !== "stopped") return null;

/**
 * Дорожка остановлена. Непройденное остаётся в очереди: человек вернётся, когда

}

/**
 * Честная длина карточки в минутах. «полминуты» и «меньше минуты» — половина,
 * «3 минуты» — три. Ничего не сказано — считаем минуту: это прикидка для суммы,
 * а не обещание.
 */
function minsFromSize(size) {
  var s = String(size == null ? "" : size).toLowerCase();
  if (s.indexOf("полминуты") >= 0 || s.indexOf("меньше минуты") >= 0) return 0.5;
  var m = /(\d+)\s*минут/.exec(s);
  return m ? Number(m[1]) : 1;
}

/** Области жизни, в которых у человека есть хоть одна точка. */
function filledAreas(cards) {
  var out = [];
  (cards || []).forEach(function (c) {
    if (c.daysAgo === null || c.daysAgo === undefined) return;
    if (out.indexOf(c.area) < 0) out.push(c.area);
  });
  return out;
}

/**
 * Вклад замера в картину. Меньше — раньше:
 *   0 — закрывает пустую область: про неё не известно ничего;
 *   1 — область известна, а этого замера не было ни разу;
 *   2 — уточняет известное: замер был, срок вышел.
 * Календарь тут ни при чём: просрочка не делает замер важнее пустого места.
 */
function trackRank(card, filled) {
  if ((filled || []).indexOf(card.area) < 0) return 0;
  if (card.daysAgo === null || card.daysAgo === undefined) return 1;
  return 2;
}

/**
 * Замеры, которые дорожка может пройти цепочкой: у них есть своя страница, и
 * страница умеет дорожку. Свежие не берём — за этот период они уже сказали всё,
 * что могли, и шаг был бы пустым.
 */
function trackCards(cards) {
  return (cards || []).filter(function (c) {
    return c.track === true && c.url && c.state !== "fresh";
  });
}

/** Очередь дорожки. Порядок держится на четырёх правилах, все они видимые. */
function trackQueue(cards, opts) {
  var o = opts || {};
  var filled = filledAreas(cards);
  var list = trackCards(cards).map(function (c) {
    return { key: c.key, label: c.label, area: c.area,
             mins: minsFromSize(c.size),
             url: o.href ? o.href(c) : (c.url || ""),
             rank: trackRank(c, filled),
             wide: (c.containers || []).length,
             at: AREA_ORDER.indexOf(c.area) };
  });
  list.sort(function (a, b) {
    return (a.rank - b.rank) || (b.wide - a.wide) || (a.at - b.at) ||
           (a.mins - b.mins) || (a.key < b.key ? -1 : (a.key > b.key ? 1 : 0));
  });
  return list.map(function (x) {
    return { key: x.key, label: x.label, area: x.area, mins: x.mins,
             url: x.url, rank: x.rank };
  });
}

/** Сколько минут вся дорожка. Округляем вверх: обещать меньше нечестно. */
function trackMinutes(queue) {
  var sum = 0;
  (queue || []).forEach(function (q) { sum += Number(q.mins) || 0; });
  return Math.ceil(sum);
}

/** Строка до старта: сколько замеров и сколько минут. */
function trackSizeLine(queue) {
  var n = (queue || []).length;
  var m = trackMinutes(queue);
  return n + " " + trackPlural(n, "замер", "замера", "замеров") +
    " · около " + m + " " + trackPlural(m, "минуты", "минут", "минут");
}

/** Почему дорожка начинает именно с этого замера. Без цифр и без долга. */
function trackWhyFirst(head) {
  if (!head) return "";
  if (head.rank === 0) {
    return "про " + (AREA_ABOUT[head.area] || head.area) + " пока не известно ничего";
  }
  if (head.rank === 1) return "этого замера ещё не было ни разу";
  return "он уточняет то, что уже известно";
}

/** Адрес этого же экрана с меткой дорожки. Пустая метка — обычный список. */
function trackHref(home, search, value) {
  var q = String(search == null ? "" : search).replace(/^\?/, "").split("&")
    .filter(function (p) { return p && p.indexOf("track=") !== 0; });
  if (value) q.push("track=" + value);
  return String(home == null ? "" : home) + (q.length ? "?" + q.join("&") : "");
}

/** Новая запись дорожки. */
function trackNew(queue, home, nowMs) {
  return { v: 1, state: "run", startedAt: nowMs, legAt: nowMs, spentMs: 0,
           offeredMin: 0, home: String(home == null ? "" : home),

/**
 * Итог дорожки — ОДИН сшитый текст, а не столбик результатов.
 *
 * Зачем именно так. Человек шёл подряд ради общей картины; шесть отдельных
 * результатов её не дают — их читают по диагонали. Поэтому слова замеров
 * сшиваются по областям жизни в связную речь, а в конце говорится честное: это
 * широкий срез, линия появится позже.
 *
 * Сводного числа тут нет и быть не может: разные замеры мерят разное
 * (конституция, принцип IV).
 */
function stitchSummary(rec) {
  var done = (rec && rec.done) ? rec.done : [];
  if (!done.length) return "";
  var areas = [];
  done.forEach(function (d) { if (areas.indexOf(d.area) < 0) areas.push(d.area); });
  var out = ["Замеры этого захода: " +
             done.map(function (d) { return d.label; }).join(", ") + "."];
  areas.forEach(function (area) {
    var said = [];
    done.forEach(function (d) {
      if (d.area !== area) return;
      (d.lines || []).forEach(function (t) {
        var s = String(t).replace(/\s+/g, " ").trim();
        if (s) said.push(/[.!?»]$/.test(s) ? s : s + ".");
      });
    });
    if (said.length) {
      out.push((AREA_SAY[area] || ("Про " + area)) + " — " + said.join(" "));
    }
  });
  out.push("Это широкий срез: по нему видно, где сейчас как. Линии в нём нет — " +
           "она появится, когда те же вопросы повторятся через неделю и через месяц.");
  return out.join(" ");
}

      cardHtml(ask, false) + "</div>";
  } else if (state === "first_step") {
    out += '<div class="ask"><div class="ask-head">Начни с этого — оно открывает больше всего</div>' +
      cardHtml(ask, false) + "</div>";
  } else if (state === "observation_only") {
    out += '<div class="honest">Сейчас ничего не нужно. Загляни через неделю.</div>';
  }

  return out;
}

/**
 * Блок про замер, на который бот не приглашает (спека 020, История 4).
 *
 * Стоит ниже просьбы: сначала то, о чём попросили, потом остальное. Свои классы,
 * а не класс карточки: карточка на первом экране читается как просьба, а просьба
 * ровно одна. Кандидата нет — блока нет, пустой рамки не остаётся.
 */
function noInviteHtml(card) {
  if (!card) return "";
  return '<div class="mine">' +
    '<div class="mine-head">Сюда я не приглашаю</div>' +
    '<a class="mine-open" href="' + esc(cardHref(card)) + '">' +
      '<div class="mine-name">' + esc(card.label) + "</div>" +
      '<div class="mine-sub">' + esc(card.what) + "</div>" +
    "</a>" +
    '<div class="mine-size">' + esc(card.size) + "</div>" +
    '<div class="mine-why">' + esc(NO_INVITE_WHY) + "</div>" +
  "</div>";
}

/**
 * Вход в дорожку «несколько за раз». Отдельная ссылка ниже одной просьбы, а не
 * вместо неё: просьба на экране остаётся одна (008, FR-010).
 *
 * Текст честно говорит, кому это надо: тому, кто пришёл разбираться сам.
 * Обещаний «узнай себя полностью» тут нет — за вечер получается широкий срез,
 * а не линия, и говорится об этом на экране до старта.
 *
 * ПРАВКА 08.08.2026, спека 011, История 3. Раньше эта ссылка уводила в бота:
 * очередь держал он, и человека на каждом переходе выбрасывало в переписку.
 * Теперь дорожка идёт внутри мини-аппа, и вход ведёт на её экран — тот же адрес
 * с меткой `track=1`. Ни `sendData`, ни ссылки на чат здесь больше нет.
 *
 * Дорожка идёт — входа нет: вместо него строка «продолжить с того места».
 */
function runAllHtml(cards) {
  if (trackRunning(TRACK)) return "";
  if (trackQueue(cards, {}).length < 2) return "";
  var href = trackHref(HOME_URL, SEARCH_RAW, "1");
  return '<div class="runall"><a href="' + esc(href) +
    '" data-track="start">' +
    "Хочешь разобраться, а не ответить на напоминание — пройти несколько за раз" +
    "</a></div>";
}

/**
 * Строка про начатую дорожку. Человек вышел посреди цепочки — вернулся и видит,
 * что она на месте, и какой замер идёт следующим (008, FR-015).
 *
 * Счётчика «пройдено N из M» здесь нет сознательно: он превращает дорожку в
 * долг. Достаточно того, что она на месте и куда ведёт дальше.
 */
function trackResumeHtml() {
  if (!trackRunning(TRACK)) return "";
  var h = trackHead(TRACK);
  return '<div class="track">' +
    '<div class="track-line">Дорожка на месте. Дальше — «' + esc(h.label) + '».</div>' +
    '<div class="track-acts">' +
      '<button class="act" data-track="go">Продолжить</button>' +
      '<button class="ghost" data-track="sum">Показать итог</button>' +
    "</div></div>";
}

/** Экран до старта: сколько это, честная оговорка и с чего начнём. */
function trackIntroHtml(cards) {
  var q = trackQueue(cards, { href: cardHref });
  if (!q.length) {
    return "<h1>Несколько за раз</h1>" +
      '<p class="honest">Сейчас проходить нечего: всё, что дорожка умеет, за этот ' +
      "период уже отвечено." +
      '<span class="quiet">Загляни через неделю — или открой список и выбери сам.</span></p>' +
      '<div class="track"><div class="track-acts">' +
      '<button class="ghost" data-track="back">В список</button></div></div>';
  }
  return "<h1>Несколько за раз</h1>" +
    '<div class="note">' + esc(trackSizeLine(q)) + "</div>" +
    '<p class="honest">' + esc(TRACK_HONEST) + "</p>" +
    '<div class="track">' +
    '<div class="track-line">Начнём с «' + esc(q[0].label) + "»: " +
      esc(trackWhyFirst(q[0])) + ". Замер закончился — следующий откроется сразу." +
    "</div>" +
    '<div class="track-acts">' +
      '<button class="act" data-track="go">Начать</button>' +
      '<button class="ghost" data-track="back">Не сейчас</button>' +
    "</div></div>";
}

/**
 * Итог дорожки. ОДИН сшитый текст по всем пройденным замерам — за ним человек и
 * шёл подряд. Столбик отдельных результатов даёт ровно обратное: его пролистают.
 */
function trackDoneHtml() {
  var text = stitchSummary(TRACK);
  var refer = (TRACK && TRACK.refer)
    ? '<p class="honest">' + esc(TRACK.refer) + "</p>" : "";
  var left = (trackLeft(TRACK) > 0)
    ? '<div class="track-line">Непройденное осталось на месте: вернуться к дорожке ' +
      "можно когда угодно.</div>"
    : "";
  var body = text
    ? '<p class="stitch">' + esc(text) + "</p>"
    : '<p class="honest">В этот раз ни один замер не закончен. Это тоже ' +
      "нормальный исход.</p>";
  // Человек может заглянуть в итог, не закончив дорожку: тогда ему нужно не
  // «убрать», а «продолжить». Убираем дорожку только когда она правда кончилась.
  var acts = trackRunning(TRACK)
    ? '<button class="act" data-track="go">Продолжить</button>' +
      '<button class="ghost" data-track="back">В список</button>'
    : '<button class="act" data-track="close">В список</button>';
  return "<h1>Что видно по дорожке</h1>" + refer + body +
    '<div class="track">' + left + '<div class="track-acts">' + acts +
    "</div></div>";
}

/**
 * Один ритм в полном списке — СВЁРНУТЫЙ.
 *
 * Человек открывает список и видит строки со структурой, а не двадцать три
 * карточки подряд. Нужный ритм раскрывает сам. Ничего не отнимаем: все замеры
 * на месте, просто их не выливают все сразу.
 */
function rhythmHtml(group) {
  return '<details class="rhythm"><summary class="rhythm-head">' +
    '<span class="rhythm-name">' + esc(group.name) + "</span>" +
    '<span class="rhythm-count">' + group.cards.length + "</span></summary>" +
    '<div class="rhythm-cards">' +
    group.cards.map(function (c) { return cardHtml(c, true); }).join("") +
    "</div></details>";
}

/** Полный список — за одним нажатием, по ритмам. */
function allHtml(cards) {
  return '<details id="all" class="all"><summary>Посмотреть всё</summary>' +
    '<p class="all-lead">Всё, что можно про себя померить, по ритмам — как часто ' +
    "это стоит проходить. Область жизни видна на карточке. Это не список дел: " +
    "проходи то, про что самому интересно.</p>" +
    byRhythm(cards).map(rhythmHtml).join("") +
    '<div class="foot">Одного числа на всё нет и не будет: разные замеры мерят разное, ' +
    "складывать их — терять то, ради чего мерили." +
    "<br><br>Здесь только состояние: как тебе сейчас. Из чего ты устроен — личность, нейротип, " +
    "ценности, уровень мышления, ощущение времени, стресс и риск — за кнопкой " +
    "«🪞 Как я устроен». Один замер не бывает за двумя дверями.</div>" +
    "</details>";
}

/** Карточки на сейчас: то, что видит человек с его признаками и датами. */
function screenCards() {
  return buildCards(visibleCards(REGISTRY, {
                      hasPair: HAS_PAIR, hasForum: HAS_FORUM,
                      clinicalFired: CLINICAL_FIRED, hasTeam: HAS_TEAM
                    }),
                    lastDates, new Date().toISOString(), dataKnown);
}

function render() {
  var cards = screenCards();

  // Дорожка забирает экран себе: посреди цепочки список ни к чему, а после
  // цепочки нужен один сшитый итог, а не двадцать три карточки.
  if (TRACK_ASK === "done" || (TRACK && TRACK.state !== "run")) {
    app.innerHTML = trackDoneHtml();
    bindTrack();
    return;
  }
  if (TRACK_ASK === "1") {
    app.innerHTML = trackIntroHtml(cards);
    bindTrack();
    return;
  }

  var ask = pickAsk(cards, ASK_KEY);

  app.innerHTML =
    "<h1>Что со мной?</h1>" +
    firstScreenHtml(OBSERVATION, ask, BLIND_SPOT) +
    noInviteHtml(pickNoInvite(cards)) +
    trackResumeHtml() +
    runAllHtml(cards) +
    allHtml(cards);

  bind();
  bindBack();
  bindTrack();
}

/**
 * Начать дорожку: собрать очередь, запомнить её и открыть первый замер.
 *
 * Запись кладём в память телефона ДО перехода: она и есть то, что переживает
 * выход. Держать очередь только в памяти страницы значило бы терять дорожку на
 * первом же закрытии мини-аппа.
 */
function trackBegin() {
  var q = trackQueue(screenCards(), { href: cardHref });
  if (!q.length) { render(); return; }
  trackSave(trackNew(q, trackHref(HOME_URL, SEARCH_RAW, "done"), Date.now()));
  trackGo(q[0].url);
}

/** Нажатия на экранах дорожки. Ни одного выхода в чат: только свои адреса. */
function bindTrack() {
  app.querySelectorAll("[data-track]").forEach(function (el) {
    el.addEventListener("click", function (ev) {
      var what = el.getAttribute("data-track");
      if (ev && ev.preventDefault) ev.preventDefault();
      if (what === "start") { trackGo(el.getAttribute("href")); return; }
      if (what === "go") {
        // Дорожка уже идёт — продолжаем с того места, а не начинаем заново.
        if (trackRunning(TRACK)) { trackGo(trackHead(TRACK).url); return; }
        trackBegin();
        return;
      }
      if (what === "sum") {
        // Заглянуть в итог, не закончив дорожку. Она остаётся на месте.
        trackGo(trackHref(HOME_URL, SEARCH_RAW, "done"));
        return;
      }
      if (what === "close") {
        // Дорожка кончилась и итог прочитан — убираем её из памяти телефона.
        trackClear();
        trackGo(trackHref(HOME_URL, SEARCH_RAW, ""));
        return;
      }
      // «Не сейчас» и «В список»: уходим к списку, дорожку не трогаем.
      trackGo(trackHref(HOME_URL, SEARCH_RAW, ""));
    });
  });
}

/* ---- Кнопка назад: проводка (спека 012) ----
 *
 * Уровни в разметке — это `<details>`: список «Посмотреть всё» и ритмы внутри
 * него. Стек пересобираем из DOM, а не храним отдельно: тогда он не разъедётся
 * с тем, что человек видит, даже если он открыл ритм своим нажатием.
 *
 * Обработчик навешиваем ОДИН раз за жизнь страницы: render() зовётся повторно,
 * когда догоняют даты из базы, а второй обработчик дал бы двойной шаг назад.
 */
var backBound = false;

function openLevels() {
  var out = [];
  var all = app.querySelector("#all");
  if (all && all.open) {
    out.push("all");
    var groups = all.querySelectorAll("details.rhythm");
    for (var i = 0; i < groups.length; i++) {
      if (groups[i].open) out.push("rhythm:" + i);
    }
  }
  return out;
}

function onBack() {
  var all = app.querySelector("#all");
  if (!all || !all.open) return;
  var groups = all.querySelectorAll("details.rhythm");
  for (var i = groups.length - 1; i >= 0; i--) {   // самый внутренний уровень
    if (groups[i].open) {
      groups[i].open = false;
      syncBack();
      return;
    }
  }
  all.open = false;                                // остался только список
  syncBack();
}

function syncBack() {
  if (!tg || !tg.BackButton) return;
  if (!backBound) {
    try { tg.BackButton.onClick(onBack); } catch (e) {}
    backBound = true;
  }
  try {
    if (backVisible(openLevels())) tg.BackButton.show();
    else tg.BackButton.hide();
  } catch (e) {}
}

function bindBack() {
  // Событие `toggle` есть у каждого <details> — ловим и своё нажатие, и чужое.
  app.querySelectorAll("details").forEach(function (d) {
    d.addEventListener("toggle", syncBack);
  });
  syncBack();
}

function bind() {
  // Открыть замер-разговор. Три пути, по убыванию надёжности:
  //   1. `sendData` — боту уходит апдейт `web_app_data`, он начинает замер сам;
  //   2. `openTelegramLink` — открывает переписку. Старт-параметр в ней
  //      теряется, если чат уже существует, поэтому это запасной путь, а не
  //      основной. Рядом всегда есть фраза, которую можно скопировать;
  //   3. обычная ссылка — так работает в браузере вне Телеграма.
  //
  // Слушатель ставится на элементы ТОЛЬКО что собранной разметки: каждый render
  // делает их заново, поэтому навесить дважды на один элемент нельзя.
  app.querySelectorAll("[data-tglink]").forEach(function (el) {
    el.addEventListener("click", function (ev) {
      var payload = el.getAttribute("data-send");
      if (payload && canSendData(tg)) {
        ev.preventDefault();
        ev.stopPropagation();
        try {
          tg.sendData(payload);
          return;
        } catch (e) {}                  // не ушло — падаем в запасной путь
      }
      if (!tg || typeof tg.openTelegramLink !== "function") return;
      ev.preventDefault();
      ev.stopPropagation();
      try { tg.openTelegramLink(el.getAttribute("data-tglink")); } catch (e) {}
    });
  });

  app.querySelectorAll("[data-copy]").forEach(function (el) {
    el.addEventListener("click", function (ev) {
      ev.stopPropagation();
      var text = el.getAttribute("data-copy");
      var done = function () { el.textContent = "Скопировано"; };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
        } else { fallbackCopy(text, done); }
      } catch (e) { fallbackCopy(text, done); }
    });
  });
}

function fallbackCopy(text, done) {
  try {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    done();
  } catch (e) {}
}

// ---- Старт ----
async function start() {
  // Сначала показываем экран — наблюдение и просьба уже приехали в адресе.
  // Даты замеров догоняют: они нужны только полному списку.
  if (FRESH_PARAM) { lastDates = FRESH_PARAM; dataKnown = true; }
  render();

  var fromDb = await fetchPassportDates();
  if (fromDb) {
    Object.keys(fromDb).forEach(function (k) { lastDates[k] = fromDb[k]; });
    dataKnown = true;
    render();
  }
}

if (!USER_ID) {
  app.innerHTML =
    "<h1>Что со мной?</h1>" +
    '<p class="honest">Этот экран открывается из бота — так он знает, чьи это замеры ' +
    "и что по ним видно.</p>" +
    '<p class="note">Если открыл ссылку из браузера, вернись в Телеграм.</p>';
} else {
  start();
}
</script>
