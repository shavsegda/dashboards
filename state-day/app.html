<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Сутки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Цвета. Каждый — из темы Телеграма, запасное значение — палитра Алексея
   paper/graphite/terracotta. Тема есть — идём за клиентом; темы нет (браузер) —
   страница выглядит как раньше.
   Полупрозрачные оттенки собраны из триплетов --ink-rgb и --alert-rgb: добавить
   альфу к чужому цвету средствами CSS нельзя, поэтому триплеты считает скрипт и
   обновляет по themeChanged. */
:root {
  --paper: #F4F2EC;
  --stone: #E8E5DC;
  --graphite: #1A1A1A;
  --ink-rgb: 26,26,26;
  --graphite-90: rgba(var(--ink-rgb),0.9);
  --graphite-75: rgba(var(--ink-rgb),0.75);
  --graphite-65: rgba(var(--ink-rgb),0.65);
  --graphite-50: rgba(var(--ink-rgb),0.5);
  --graphite-30: rgba(var(--ink-rgb),0.3);
  --graphite-15: rgba(var(--ink-rgb),0.15);
  --graphite-08: rgba(var(--ink-rgb),0.08);
  /* Акцент свой: в теме Телеграма аналога нет — button_color у каждого клиента
     свой и рвёт вид страницы. На тёмном фоне терракота не читается, поэтому для
     тёмной темы ниже задан более светлый оттенок. */
  --terracotta: #B85C38;
  --accent-rgb: 184,92,56;
  --terracotta-tint: rgba(var(--accent-rgb),0.08);
  --alert: var(--tg-theme-destructive_text_color, #B91C1C);
  --alert-rgb: 185,28,28;
  --alert-tint: rgba(var(--alert-rgb),0.06);
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}

/* Телеграма нет, а система в тёмной теме: держим страницу тёмной целиком, иначе
   получится светлый лист в тёмном окне. Значения запасные — тема клиента и
   скрипт всегда сильнее. */
@media (prefers-color-scheme: dark) {
  :root {
    --paper: var(--tg-theme-bg_color, #17171A);
    --stone: var(--tg-theme-secondary_bg_color, #202024);
    --graphite: var(--tg-theme-text_color, #F0EEE8);
    --ink-rgb: 240,238,232;
    --terracotta: #E08A63;
    --accent-rgb: 224,138,99;
    --alert: var(--tg-theme-destructive_text_color, #F27A7A);
    --alert-rgb: 242,122,122;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { font-family: var(--font-sans); background: var(--paper); color: var(--graphite); line-height: 1.5; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
/* Высота — стабильная высота окна Телеграма: её ставит скрипт из
   viewportStableHeight. У viewportHeight она меняется во время жестов, и низ
   страницы прыгает под пальцем. */
body { min-height: var(--tg-vh, 100vh); }

/* Безопасные зоны Телеграма: без них верх уезжает под вырез, а низ под панель */
main {
  max-width: 560px; margin: 0 auto;
  padding-top: calc(28px + var(--tg-content-safe-area-inset-top, 0px));
  padding-bottom: calc(40px + var(--tg-safe-area-inset-bottom, 0px));
  padding-left: calc(20px + var(--tg-safe-area-inset-left, 0px));
  padding-right: calc(20px + var(--tg-safe-area-inset-right, 0px));
}
h1 { font-size: 30px; font-weight: 500; letter-spacing: -0.025em; line-height: 1.05; margin-bottom: 8px; }
p { color: var(--graphite-75); }
.lead { font-size: 15px; color: var(--graphite-65); margin-bottom: 22px; }
.note { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--graphite-50); }

/* Один экран: поля идут плотным списком, без карточек и рамок вокруг каждого */
.field { padding: 14px 0; }
/* Разделитель только между полями: над первым линия не нужна */
.field ~ .field { border-top: 1px solid var(--graphite-08); }
.field-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.field-name { font-size: 15px; font-weight: 500; }
.field-hint { font-size: 12px; color: var(--graphite-50); }
.field-val { font-family: var(--font-mono); font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--terracotta); }
.field-val.empty { color: var(--graphite-30); }

/* Ряд «от 0 до 10» — одно касание вместо перетаскивания. На телефоне надёжнее ползунка */
.scale { display: grid; grid-template-columns: repeat(11, 1fr); gap: 3px; }
.scale-btn { font-family: var(--font-mono); font-size: 13px; padding: 11px 0; text-align: center; border: 1px solid var(--graphite-15); background: transparent; color: var(--graphite-75); cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
.scale-btn.on { border-color: var(--terracotta); background: var(--terracotta); color: var(--paper); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--font-mono); font-size: 13px; padding: 10px 14px; border: 1px solid var(--graphite-15); background: transparent; color: var(--graphite-75); cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
.chip.on { border-color: var(--terracotta); background: var(--terracotta); color: var(--paper); }

input[type=range] { width: 100%; -webkit-appearance: none; appearance: none; background: transparent; height: 30px; }
input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--graphite-15); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -12px; border-radius: 50%; background: var(--terracotta); }
input[type=range]::-moz-range-track { height: 2px; background: var(--graphite-15); }
input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border: 0; border-radius: 50%; background: var(--terracotta); }

input[type=text], input[type=number], input[type=time], textarea {
  width: 100%; font-family: var(--font-sans); font-size: 16px; color: var(--graphite);
  background: transparent; border: 1px solid var(--graphite-15); padding: 11px 12px; border-radius: 0;
  -webkit-appearance: none; appearance: none;
}
input:focus, textarea:focus { outline: none; border-color: var(--terracotta); }
textarea { resize: vertical; min-height: 58px; line-height: 1.45; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pair label { display: block; font-size: 12px; color: var(--graphite-50); margin-bottom: 5px; }

details { border-top: 1px solid var(--graphite-08); padding: 14px 0; }
summary { list-style: none; cursor: pointer; font-size: 14px; color: var(--graphite-65); display: flex; justify-content: space-between; }
summary::-webkit-details-marker { display: none; }
summary::after { content: '+'; font-family: var(--font-mono); color: var(--graphite-30); }
details[open] summary::after { content: '−'; }
details > div { margin-top: 14px; }

button.act { background: var(--graphite); color: var(--paper); padding: 15px 28px; border: none; font-size: 15px; cursor: pointer; font-family: var(--font-sans); font-weight: 500; }
button.act:hover { background: var(--terracotta); }
button.act:disabled { background: var(--graphite-30); cursor: progress; }
button.ghost { background: transparent; color: var(--graphite); border: 1px solid var(--graphite-30); padding: 14px 22px; font-size: 15px; cursor: pointer; font-family: var(--font-sans); }
button.ghost:hover { color: var(--terracotta); border-color: var(--terracotta); }
button.ghost:disabled { color: var(--graphite-30); border-color: var(--graphite-15); cursor: not-allowed; }
.actions { margin-top: 26px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.banner { border: 1px solid var(--terracotta); background: var(--terracotta-tint); padding: 14px 16px; margin-bottom: 22px; font-size: 14px; color: var(--graphite); }
.banner strong { font-weight: 500; }
.status { margin-top: 14px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--terracotta); min-height: 16px; }
.status.error { color: var(--alert); }

/* Блок «Что было раньше». Линия по каждому показателю отдельно: одна линия — один
   показатель, иначе получается клубок, из которого ничего не читается.
   Цифр на оси нет ни одной — только подписи словами сверху и снизу. */
.hist { margin-bottom: 24px; padding-bottom: 4px; border-bottom: 1px solid var(--graphite-08); }
.hist .note { margin-bottom: 8px; }
.hist-prev { font-size: 15px; color: var(--graphite-75); margin-bottom: 16px; }
.hist-line { padding: 10px 0; }
.spark-wrap { display: flex; flex-direction: column; gap: 3px; }
.spark { width: 100%; height: 48px; display: block; }
.spark-side { font-size: 11px; color: var(--graphite-30); font-family: var(--font-mono); letter-spacing: 0.04em; }

.recap { border: 1px solid var(--graphite-08); }
.recap-row { display: flex; justify-content: space-between; align-items: baseline; padding: 13px 16px; border-bottom: 1px solid var(--graphite-08); }
.recap-row:last-child { border-bottom: 0; }
.recap-name { font-size: 14px; color: var(--graphite-75); }
.recap-val { font-family: var(--font-mono); font-size: 17px; font-variant-numeric: tabular-nums; }

@media (max-width: 380px) {
  .scale { gap: 2px; }
  .scale-btn { font-size: 12px; padding: 10px 0; }
  h1 { font-size: 26px; }
}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
/* ==== ЧИСТАЯ ЛОГИКА: НАЧАЛО ====
   Всё внутри этих границ не трогает DOM и не ходит в сеть.
   Скрипт проверок вырезает этот блок и прогоняет функции на выдуманных данных.
   Менять только вместе с проверками. */

// ---- Контейнеры жизни: перенос словаря из bot.py один в один ----
// Метка человеку НЕ показывается никогда — это данные для панели, а не ярлык
// в лицо. Конституция, принцип V.
var LIFE_CONTAINERS = ["Семья", "Работа", "Тело", "Деньги", "Я сам", "Круг", "Время на себя"];

// Как читать маркер:
//   «работ»  — начало слова плюс до трёх букв окончания
//   «=долги» — только целое слово, там где короткая основа цепляет чужое
var CONTAINER_MARKERS = {
  "Семья": [
    "жен", "муж", "=дети", "=детей", "=детям", "=детьми", "=детях",
    "ребенок", "ребенка", "ребенком", "сын", "дочь", "дочк", "дочер",
    "садик", "школ", "родител", "мам", "=папа", "=папе", "=папу", "=папой",
    "=отец", "=отца", "=отцом", "=семья", "=семьи", "=семье", "=семью",
    "=семей", "семейн", "=брат", "=брата", "=брату", "=братом", "сестр",
    "бабушк", "дедушк", "внук", "супруг", "свекров", "теща", "развод",
    "беремен", "декрет", "бытов"
  ],
  "Работа": [
    "работ", "отчет", "встреч", "клиент", "команд", "начальн", "сотрудник",
    "проект", "дедлайн", "задач", "совещан", "планерк", "увол", "нанял",
    "собеседован", "презентац", "офис", "коллег", "руковод", "продаж",
    "=зум", "завал", "переработ", "договор", "сделк", "переговор",
    "подрядчик"
  ],
  "Тело": [
    "спин", "=боль", "=боли", "=болит", "=болел", "=больно", "больниц",
    "болезн", "врач", "доктор", "зуб", "температур", "простуд", "заболе",
    "устал", "усталост", "тренировк", "качалк", "спортзал", "=зал",
    "=зала", "=зале", "=залом", "пробеж", "бегал", "разминк", "растяжк",
    "травм", "=живот", "=живота", "=животе", "давлен", "анализы",
    "анализов", "таблетк", "лекарств", "похуде", "=вес", "=веса", "=весом"
  ],
  "Деньги": [
    "деньг", "денег", "деньгам", "зарплат", "платеж", "оплат", "кредит",
    "ипотек", "=долг", "=долга", "=долги", "=долгу", "=долгов", "задолжен",
    "=счет", "=счета", "=счету", "=счетов", "налог", "финанс", "=банк",
    "=банка", "=банке", "выручк", "=доход", "=доходы", "=доходов",
    "=расход", "=расходы", "=расходов", "бюджет"
  ],
  "Я сам": [
    "тревог", "тревожн", "накрыл", "злюсь", "злился", "злость", "бесит",
    "бесило", "раздража", "апати", "депресс", "тоск", "обид", "обидел",
    "стыд", "виноват", "=пусто", "=пустота", "=пустоту", "смысл", "страх",
    "боюсь", "боялся", "паник", "срыв", "сорвал", "ярост", "отчаян",
    "безнадеж", "ненавиж"
  ],
  "Круг": [
    "=друг", "=друга", "=другу", "=другом", "=друге", "друзь", "друзьям",
    "подруг", "приятел", "созвон", "встретил", "тусов", "одинок",
    "=никого", "общени", "пообщал", "гост", "вечеринк"
  ],
  "Время на себя": [
    "отдых", "отдохн", "отпуск", "книг", "сериал", "кино", "прогул",
    "гуля", "погуля", "=баня", "=бани", "=бане", "=баню", "хобби",
    "музык", "тишин", "рисова"
  ]
};

// В JS «\b» не работает с русскими буквами: он считает их не-буквами и границы
// слова находит не там. Поэтому текст приводим к виду « слово слово » — все
// разделители становятся пробелами, и граница слова = пробел. Ровно тот же
// результат, что у python-овского \b на русском тексте.
var WORD_CHAR = "a-zа-я0-9_";

function padWords(s) {
  var t = String(s == null ? "" : s).toLowerCase().replace(/ё/g, "е");
  t = t.replace(new RegExp("[^" + WORD_CHAR + "]+", "g"), " ").trim();
  return " " + t + " ";
}

var CONTAINER_MARKER_RE = (function () {
  var out = {};
  Object.keys(CONTAINER_MARKERS).forEach(function (c) {
    out[c] = CONTAINER_MARKERS[c].map(function (m) {
      var body = m.charAt(0) === "=" ? m.slice(1) : m + "[а-я]{0,3}";
      return new RegExp(" " + body + "(?= )");
    });
  });
  return out;
})();

// Порядок ответа — как в LIFE_CONTAINERS, а не как в тексте: иначе одинаковые
// по смыслу дни лежали бы в базе по-разному и не сравнивались.
function detectContainers(text) {
  var t = padWords(text);
  if (!t.trim()) return [];
  return LIFE_CONTAINERS.filter(function (c) {
    return CONTAINER_MARKER_RE[c].some(function (r) { return r.test(t); });
  });
}

// Служебные слова самого замера — вычитаем перед поиском события, как в боте.
// В мини-аппе цифры лежат в отдельных полях, но человек всё равно может
// написать «спал плохо, завал в отчётах» — и тогда «спал» не должно стать
// событием. Список слово в слово из DAILY_SERVICE_RE в bot.py.
var DAILY_SERVICE_WORDS = [
  "л[ег]г", "встал\\w*", "подъем\\w*", "проснул\\w*", "разбудил\\w*", "дремал\\w*", "спал\\w*",
  "сон", "сна", "качеств\\w*", "тонус\\w*", "энерги\\w*", "сил[аы]", "настроен\\w*", "засыпал\\w*",
  "просыпал\\w*", "пробужден\\w*", "пульс\\w*", "поко[йя]", "заряд\\w*", "батар\\w*",
  "готовност\\w*", "вариабельност\\w*", "врв", "hrv", "медитац\\w*", "практик\\w*", "дыхани\\w*",
  "шаг\\w*", "боди", "бетери", "вчп", "глубок\\w*", "быстр\\w*", "мин", "минут\\w*", "час\\w*", "раз", "раза",
  "балл\\w*", "ч"
];

// Предлоги и вводные, которые остаются висеть без своего слова. «из» и «за» не
// трогаем: они внутри «из-за», а это часть живой фразы про событие.
var DAILY_STOP_WORDS = ["в", "на", "до", "у", "к", "по", "и", "а", "с", "же", "тоже", "наверно", "наверное", "вроде"];

function reWords(list) {
  // Замена \b(?:...)\b без lookbehind: разделитель слева забираем в группу
  // и возвращаем при замене. Работает и на старых телефонах.
  var body = list.join("|").replace(/\\w/g, "[" + WORD_CHAR + "]");
  return new RegExp("(^|[^" + WORD_CHAR + "])(?:" + body + ")(?![" + WORD_CHAR + "])", "g");
}

var DAILY_SERVICE_RE_HEAD = /\d{1,2}[:.]\d{2}|\d+(?:[.,]\d+)?\s*%?/g;
var DAILY_SERVICE_RE_WORDS = reWords(DAILY_SERVICE_WORDS);
var DAILY_STOP_RE = reWords(DAILY_STOP_WORDS);

function dailyEventText(text) {
  var t = String(text == null ? "" : text).toLowerCase().replace(/ё/g, "е");
  t = t.replace(DAILY_SERVICE_RE_HEAD, " ");
  t = t.replace(DAILY_SERVICE_RE_WORDS, "$1 ");
  t = t.replace(DAILY_STOP_RE, "$1 ");
  t = t.replace(/[,;.!?·—]+/g, " ");
  t = t.replace(/\s+/g, " ");
  // Питоновский strip(" -") снимает пробелы и дефисы с обоих концов
  return t.replace(/^[ -]+/, "").replace(/[ -]+$/, "");
}

// ---- Сборка scores ----
// Ключи ровно те, что пишет бот из текстовой строки (parse_daily_line +
// handle_daily_state). Если поменять хотя бы одно имя — панели и тренды
// перестанут читать данные.
var MEASUREMENT_KEYS = [
  "bed", "wake", "sleep_hours", "sleep_quality", "tonus", "mood",
  "sleep_latency", "awakenings", "resting_hr", "battery", "hrv",
  "practice_min", "practice_kind"
];

// Границы значений — те же, что у парсера текста. Вне границ поле не пишется:
// догадки не сохраняются как данные.
var BOUNDS = {
  sleep_hours: [0, 16], sleep_quality: [0, 10], tonus: [0, 10], mood: [0, 10],
  sleep_latency: [0, 240], awakenings: [0, 20], resting_hr: [25, 120],
  battery: [0, 100], hrv: [5, 250], practice_min: [0, 600]
};

function inBounds(key, v) {
  var b = BOUNDS[key];
  if (!b) return true;
  return v >= b[0] && v <= b[1];
}

function putNum(scores, key, v) {
  if (v === null || v === undefined || v === "") return;
  var n = typeof v === "number" ? v : parseFloat(String(v).replace(",", "."));
  if (!isFinite(n)) return;
  if (!inBounds(key, n)) return;
  scores[key] = n;
}

function clockToMinutes(x) {
  var m = /^(\d{1,2})[:.](\d{2})$/.exec(String(x || "").trim());
  if (!m) return null;
  var hh = parseInt(m[1], 10), mm = parseInt(m[2], 10);
  if (hh > 23 || mm > 59) return null;
  return hh * 60 + mm;
}

/** Собрать scores для блока state_day. Возвращает {scores, hasMeasurement}. */
function buildScores(input) {
  var i = input || {};
  var s = {};

  var bedM = clockToMinutes(i.bed);
  var wakeM = clockToMinutes(i.wake);
  if (bedM !== null) s.bed = String(i.bed).trim();
  if (wakeM !== null) s.wake = String(i.wake).trim();

  // Лёг и встал важнее ползунка: точнее, и бот считает длительность так же
  if (bedM !== null && wakeM !== null) {
    var d = wakeM - bedM;
    if (d < 0) d += 24 * 60;
    putNum(s, "sleep_hours", Math.round((d / 60) * 100) / 100);
  } else {
    putNum(s, "sleep_hours", i.sleepHours);
  }

  putNum(s, "sleep_quality", i.sleepQuality);

  if (i.mood !== null && i.mood !== undefined) p.push("настроение " + i.mood);

  if (i.awakenings !== null && i.awakenings !== undefined) p.push("просыпался " + i.awakenings + " раз");

// считаться по разным суткам.

// ---- Защита от дублей ----

// Поэтому повторная отправка натыкается на первичный ключ, а не создаёт вторую
// точку. Это и есть FR-011 на стороне базы, а не только на стороне формы.

function uuidFromBytes(bytes) {

  b[6] = (b[6] & 0x0f) | 0x50;          // версия 5 — «имя + пространство»
  b[8] = (b[8] & 0x3f) | 0x80;          // вариант RFC 4122
  var h = b.map(function (x) { return ("0" + (x & 0xff).toString(16)).slice(-2); }).join("");
  return h.slice(0, 8) + "-" + h.slice(8, 12) + "-" + h.slice(12, 16) + "-" + h.slice(16, 20) + "-" + h.slice(20, 32);

// Запасной хеш, если crypto.subtle недоступен: четыре независимых прохода
// FNV-1a с разными затравками дают 128 бит.
function fnvBytes(str) {
  var seeds = [0x811c9dc5, 0x01000193, 0x9e3779b9, 0x85ebca6b];
  var out = [];
  for (var s = 0; s < 4; s++) {
    var h = seeds[s] >>> 0;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;

    out.push((h >>> 24) & 0xff, (h >>> 16) & 0xff, (h >>> 8) & 0xff, h & 0xff);
  }
  return out;
}

 * Какой запрос делать. Знаем, что за сегодня уже есть точка — только правим.
 * Не знаем — пишем новую с детерминированным id: если она вдруг уже есть,

 * Замок на кнопку. Первое нажатие берёт замок, все следующие отбиваются, пока

 */

  var busy = false;
  return {
    busy: function () { return busy; },
    acquire: function () { if (busy) return false; busy = true; return true; },
    release: function () { busy = false; }

/** Читаемая сводка записанного — то же, что бот отвечает строкой «Записал: …».

 * `prev` — значения прошлой отметки. Есть — к строке приписывается изменение его
 * же словами: «выше», «ниже», «как в прошлый раз». Это разрешённый способ
 * говорить о сдвиге; баллов и норм здесь нет и быть не может.

  if (scores.sleep_quality !== undefined) rows.push(["Качество сна", String(scores.sleep_quality) + tail("sleep_quality")]);
  if (scores.tonus !== undefined) rows.push(["Тонус", String(scores.tonus) + tail("tonus")]);
  if (scores.mood !== undefined) rows.push(["Настроение", String(scores.mood) + tail("mood")]);
  if (scores.practice_min !== undefined) {
    rows.push(["Практика внимания", scores.practice_min + " мин" + (scores.practice_kind ? " · " + scores.practice_kind : "") + tail("practice_min")]);

  if (scores.battery !== undefined) rows.push(["Заряд", String(scores.battery)]);
  if (scores.hrv !== undefined) rows.push(["Вариабельность", String(scores.hrv)]);
  if (scores.sleep_latency !== undefined) rows.push(["Засыпал", scores.sleep_latency + " мин"]);
  if (scores.awakenings !== undefined) rows.push(["Просыпался", scores.awakenings + " раз"]);

/* ---- Черновик незаполненной формы (дефект 07.08.2026) ----
 *
 * Человек отметил тонус и настроение, отвлёкся и вышел, не нажав «Записать».
 * Раньше это значило «работы не было»: в память телефона попадала только
 * отправленная запись. Черновик — то же поле формы, но отложенное сразу, и

function changeWord(now, prev) {

  if (!isFinite(now) || !isFinite(prev)) return "";

 * Отрезки линии для графика. Пропуск РВЁТ линию, а не сглаживается через
 * отсутствующее значение: иначе график показывал бы день, которого не было.
 *
 * Цифр здесь не считается вовсе — только координаты. На оси графика чисел нет и
 * не будет: человек читает подписи словами.
 */
function sparkSegments(vals, lo, hi, w, h) {
  var list = vals || [];
  var n = Math.max(list.length - 1, 1);
  var span = (hi - lo) || 1;
  var segs = [];
  var cur = [];
  list.forEach(function (v, i) {
    if (v === null || v === undefined) {
      if (cur.length > 1) segs.push(cur);
      cur = [];
      return;
    }
    var x = Math.round(i / n * w * 10) / 10;
    var y = Math.round((h - (Math.max(lo, Math.min(hi, v)) - lo) / span * h) * 10) / 10;
    cur.push(x + "," + y);
  });
  if (cur.length > 1) segs.push(cur);
  return segs;
}

async function recordId(dayKey) {
  var key = idKeyString(USER_ID, dayKey);
  try {
    if (window.crypto && window.crypto.subtle) {
      var buf = await window.crypto.subtle.digest("SHA-256", new TextEncoder().encode(key));
      return uuidFromBytes(new Uint8Array(buf));
    }
  } catch (e) {}
  return uuidFromBytes(fnvBytes(key));
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function scaleRow(name) {
  var v = form[name];
  var cells = "";
  for (var i = 0; i <= 10; i++) {
    cells += '<div class="scale-btn' + (v === i ? " on" : "") + '" data-scale="' + name + '" data-v="' + i + '">' + i + "</div>";
  }
  return '<div class="scale">' + cells + "</div>";
}

function hoursLabel(h) {
  if (h === null) return "—";
  var hh = Math.floor(h), mm = Math.round((h - hh) * 60);
  return hh + ":" + (mm < 10 ? "0" + mm : mm);
}

/** Число в короткую запись: «7», «7.5». Нужна и графику, и строке «в прошлый раз». */
function numLabel(v) {
  if (typeof v !== "number" || !isFinite(v)) return "";
  return String(Math.round(v * 100) / 100);
}

/**
 * График одной линии. Одна линия на показатель — не всё в одном клубке.
 *
 * На оси НЕТ ни одной цифры. Подписи словами: сверху «больше сил», снизу
 * «меньше сил». Так человек читает направление, а не оценку своего балла — балла
 * тут и нет вовсе.
 */
function sparkHtml(vals, meta) {
  var segs = sparkSegments(vals, meta.lo, meta.hi, 560, 48);
  if (!segs.length) return "";
  var lines = segs.map(function (sg) {
    return '<polyline points="' + sg.join(" ") + '" fill="none" ' +
      'stroke="var(--terracotta)" stroke-width="2" stroke-linejoin="round" ' +
      'stroke-linecap="round"/>';
  }).join("");
  return '<div class="spark-wrap">' +
    '<div class="spark-side">' + esc(meta.up) + "</div>" +
    '<svg class="spark" viewBox="0 0 560 48" preserveAspectRatio="none" ' +
    'role="img" aria-label="' + esc(meta.name) + '">' + lines + "</svg>" +
    '<div class="spark-side">' + esc(meta.down) + "</div>" +
    "</div>";
}

/**
 * Блок «Что было раньше». Истории нет — блока нет вовсе: пустое место человек
 * прочитал бы как факт про себя.
 *
 * Две части. Строка «в прошлый раз» его же ответами — она закрывает работу и
 * сама по себе. И линия по каждому показателю, у которого есть хотя бы две точки:
 * из одной точки линии не бывает, и рисовать её значит выдумывать.
 */
function historyHtml() {
  if (!HIST_PREV.length) return "";
  var last = HIST_PREV[HIST_PREV.length - 1].vals || {};
  var said = [];
  HIST_META.forEach(function (m) {
    var v = last[m.key];
    if (typeof v === "number") {
      said.push(m.name.toLowerCase() + " " + numLabel(v) + m.unit);
    }
  });
  if (!said.length) return "";

  var charts = "";
  HIST_META.forEach(function (m) {
    var vals = histSeries(HIST_PREV, m.key);
    var real = vals.filter(function (v) { return v !== null; });
    if (real.length < 2) return;
    var svg = sparkHtml(vals, m);
    if (!svg) return;
    charts +=
      '<div class="hist-line">' +
        '<div class="field-head"><div class="field-name">' + esc(m.name) + "</div>" +
        '<div class="field-val">' + esc(numLabel(real[real.length - 1]) + m.unit) + "</div></div>" +
        svg +
      "</div>";
  });

  return '<section class="hist">' +
    '<div class="note">Что было раньше</div>' +
    '<p class="hist-prev">В прошлый раз: ' + esc(said.join(" · ")) + ".</p>" +
    charts +
    "</section>";
}

function bindForm() {
  var range = document.getElementById("sleepRange");
  if (range) {
    var onRange = function () {
      form.sleepHours = parseFloat(range.value);
      var el = document.getElementById("valSleep");
      el.textContent = hoursLabel(form.sleepHours);
      el.classList.remove("empty");
      saveDraft();                       // после КАЖДОГО касания, не в конце
    };
    range.addEventListener("input", onRange);
    range.addEventListener("change", onRange);
  }

  app.querySelectorAll("[data-scale]").forEach(function (el) {
    el.addEventListener("click", function () {
      var name = el.getAttribute("data-scale");
      var v = parseInt(el.getAttribute("data-v"), 10);
      form[name] = (form[name] === v) ? null : v;   // повторное касание снимает
      var row = el.parentNode;
      row.querySelectorAll(".scale-btn").forEach(function (b) {
        b.classList.toggle("on", parseInt(b.getAttribute("data-v"), 10) === form[name]);
      });
      saveDraft();
    });
  });

  app.querySelectorAll("[data-practice]").forEach(function (el) {
    el.addEventListener("click", function () {
      var v = parseInt(el.getAttribute("data-practice"), 10);
      form.practiceMin = (form.practiceMin === v) ? null : v;
      form.eventText = readEventText();
      saveDraft();
      renderForm();
    });
  });

  app.querySelectorAll("[data-mark]").forEach(function (el) {
    el.addEventListener("click", function () {
      form.actionMark = el.getAttribute("data-mark");
      app.querySelectorAll("[data-mark]").forEach(function (b) {
        b.classList.toggle("on", b.getAttribute("data-mark") === form.actionMark);
      });
      saveDraft();
    });
  });

  var btn = document.getElementById("submitBtn");
  if (btn) btn.addEventListener("click", submit);
  var ex = document.getElementById("exitBtn");
  if (ex) ex.addEventListener("click", closeApp);
  var dd = document.getElementById("dropDraftBtn");
  if (dd) dd.addEventListener("click", resetDraft);

  // Поля, у которых своего обработчика не было вовсе: их читал только `collect()`
  // при отправке. Теперь набранное в них тоже ложится в черновик сразу.
  ["eventText", "practiceKind", "restingHr", "battery", "hrv",
   "bed", "wake", "sleepLatency", "awakenings"].forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.addEventListener("input", saveDraft);
    el.addEventListener("change", saveDraft);
  });
}

/** Начать заново: черновик стираем, форма пустеет. Отправленное за сегодня, если
 *  оно было, остаётся — это не оно. */
function resetDraft() {
  clearDraft();
  draftRestored = false;
  Object.keys(form).forEach(function (k) {
    form[k] = (typeof form[k] === "string") ? "" : null;
  });
  form.actionMark = HAS_GOAL ? "unmarked" : null;
  renderForm();
}

function readEventText() {
  var el = document.getElementById("eventText");
  return el ? el.value : form.eventText;
}

function numOrNull(id) {
  var el = document.getElementById(id);
  if (!el || el.value === "") return null;
  var n = parseFloat(el.value.replace(",", "."));
  return isFinite(n) ? n : null;
}

function strOrEmpty(id) {
  var el = document.getElementById(id);
  return el ? el.value.trim() : "";
}

function collect() {
  form.eventText = readEventText();
  form.practiceKind = strOrEmpty("practiceKind") || form.practiceKind;
  form.restingHr = numOrNull("restingHr");
  form.battery = numOrNull("battery");
  form.hrv = numOrNull("hrv");
  form.sleepLatency = numOrNull("sleepLatency");
  form.awakenings = numOrNull("awakenings");
  form.bed = strOrEmpty("bed");
  form.wake = strOrEmpty("wake");
  return form;
}

function setStatus(text, isError) {
  var el = document.getElementById("status");
  if (!el) return;
  el.textContent = text || "";
  el.classList.toggle("error", !!isError);
}

async function submit() {
  // FR-012. Замок берётся до любой другой работы: между кликом и ответом
  // сервера второе нажатие не должно дойти даже до сборки данных.
  if (!lock.acquire()) return;
  var btn = document.getElementById("submitBtn");
  if (btn) { btn.disabled = true; btn.textContent = "Записываю…"; }
  setStatus("");

  var unlock = function (msg) {
    lock.release();
    if (btn) { btn.disabled = false; btn.textContent = knownExisting ? "Исправить" : "Записать"; }
    if (msg) setStatus(msg, true);
  };

  if (!USER_ID) {
    unlock("Открой замер из бота — иначе запись некуда положить");
    return;
  }

  var input = collect();
  var built = buildScores(input);
  if (!built.hasMeasurement) {
    unlock("Ни одной цифры. Поставь хотя бы тонус и настроение");
    return;
  }

  var completedAt = new Date().toISOString();
  var dayKey = utcDayKey(completedAt);
  var payload = {
    user_id: Number(USER_ID),
    block: "state_day",
    instrument: "суточный мини-апп",
    scores: built.scores,
    answers: { raw: composeRaw(input) },
    completed_at: completedAt
  };

  try {
    var mode = decideWrite({ knownExisting: knownExisting });
    var ok = (mode === "patch-window")
      ? await patchWindow(dayKey, payload)
      : await postThenPatch(dayKey, payload);
    if (!ok) { unlock("База не приняла запись. Попробуй ещё раз — второй точки не будет"); return; }

    lastSaved = built.scores;
    saveLocal({ dayKey: dayKey, savedAt: completedAt, form: input });
    // Черновик стираем ТОЛЬКО здесь: пока сервер не ответил, он единственная
    // копия того, что человек отметил.
    clearDraft();
    draftRestored = false;
    knownExisting = true;
    lock.release();
    // Сигнал боту — последним действием. Если он ушёл, мини-апп закрывается, и
    // вывод человек читает в чате; не ушёл — рисуем результат сами.
    if (signalSaved()) return;
    renderDone();
  } catch (e) {
    // Сеть могла отвалиться уже после записи. Отметку не ставим, поэтому
    // повтор пойдёт тем же id: база вернёт 409 и мы уйдём в правку.
    unlock("Сеть не ответила. Нажми ещё раз — вторая точка не появится");
  }
}

/** Правка суточной точки за эти сутки. Ловит и запись, сделанную ботом из текста. */
async function patchWindow(dayKey, payload) {
  var w = dayWindow(dayKey);
  var url = TABLE +
    "?user_id=eq." + encodeURIComponent(payload.user_id) +
    "&block=eq.state_day" +
    "&completed_at=gte." + encodeURIComponent(w.from) +
    "&completed_at=lt." + encodeURIComponent(w.to);
  var r = await fetch(url, { method: "PATCH", headers: sbHeaders(), body: JSON.stringify({
    instrument: payload.instrument, scores: payload.scores,
    answers: payload.answers, completed_at: payload.completed_at
  }) });
  return r.status < 300;
}

/** Новая точка с детерминированным id. Уже есть — база даёт 409, уходим в правку. */
async function postThenPatch(dayKey, payload) {
  var id = await recordId(dayKey);
  var body = Object.assign({ id: id }, payload);
  var r = await fetch(TABLE, { method: "POST", headers: sbHeaders(), body: JSON.stringify(body) });
  if (r.status < 300) return true;
  if (r.status === 409) {
    var r2 = await fetch(TABLE + "?id=eq." + id, { method: "PATCH", headers: sbHeaders(), body: JSON.stringify({
      instrument: payload.instrument, scores: payload.scores,
      answers: payload.answers, completed_at: payload.completed_at
    }) });
    return r2.status < 300;
  }
  return false;
}

/* ---- Сигнал боту: запись прошла (019) ----
 *
 * Дословный запрос Алексея: «хочется чтобы бот сразу прислал какой-то вывод по
 * замеру суточному с вопросом в конце». Связи «страница → бот» другой нет:
 * ссылка со старт-параметром до бота не доезжает, если чат с ним уже есть.
 *
 * Про запрет `sendData` в правилах мини-аппов. Он верный и остаётся: sendData
 * закрывает страницу мгновенно и обрывает незавершённый запрос в базу. Поэтому
 * здесь он вызывается ПОСЛЕДНИМ действием — после ответа сервера и после очистки
 * черновика. Обрывать нечего: запись подтверждена, копий терять не осталось.
 *
 * Доступность считается по документированному признаку, тому же, что в каталоге:
 * `sendData` работает только у мини-аппов, открытых кнопкой обычной клавиатуры, а
 * у такого запуска init-данные пустые. Открыли иначе — сигнала нет, и результат
 * показывает сама страница. Тишины человек не получает ни в одном случае.
 *
 * Ровно один сигнал за отправку: два сообщения от бота на одну кнопку человек
 * читает как поломку.
 */
var SIGNAL_SENT = false;

function canSendData() {
  return !!(tg && typeof tg.sendData === "function" && !(tg.initData || ""));
}

function signalSaved() {
  if (SIGNAL_SENT || !canSendData()) return false;
  SIGNAL_SENT = true;
  // Подтверждение выхода снимаем сами: работа сделана, и держать человека
  // вопросом «точно уйти?» на закрытии, которое затеяли мы, нечестно.
  try { tg.disableClosingConfirmation(); } catch (e) {}
  try {
    tg.sendData(JSON.stringify({ action: "state_saved", block: HIST_CARD }));
    return true;
  } catch (e) {
    SIGNAL_SENT = false;
    return false;
  }
}

function renderDone() {
  // Прошлая отметка — из истории от бота, а её нет — из памяти телефона. Строки
  // итога получают «выше», «ниже», «как в прошлый раз» его же словами.
  var prev = HIST_PREV.length ? (HIST_PREV[HIST_PREV.length - 1].vals || {}) : {};
  var rows = recapRows(lastSaved || {}, prev);
  app.innerHTML =
    "<h1>Записал</h1>" +
    '<p class="lead">Одна точка за сутки. Один замер ничего не значит — смысл появится на линии, смотри в «📈 Динамика».</p>' +
    '<div class="recap">' +
      rows.map(function (r) {
        return '<div class="recap-row"><div class="recap-name">' + esc(r[0]) + '</div><div class="recap-val">' + esc(r[1]) + "</div></div>";
      }).join("") +
    "</div>" +
    '<div class="actions">' +
      '<button class="ghost" id="againBtn">Исправить</button>' +
      (tg ? '<button class="act" id="closeBtn">Закрыть</button>' : "") +
    "</div>";
  var a = document.getElementById("againBtn");
  if (a) a.addEventListener("click", renderForm);
  var c = document.getElementById("closeBtn");
  if (c) c.addEventListener("click", closeApp);
}

function closeApp() { try { tg.close(); } catch (e) {} }

// ---- Старт ----
if (!USER_ID) {
  app.innerHTML =
    "<h1>Сутки</h1>" +
    '<p class="lead">Замер открывается из бота — по кнопке «🌙 Сутки». Так он знает, чьи это сутки.</p>' +
    '<p class="note">Если открыл ссылку из браузера, вернись в Телеграм.</p>';
} else {
  renderForm();
}

/* ---- Кнопка назад и подтверждение выхода (спека 012) ----
 *
 * Дефект с живого телефона: из страницы некуда вернуться, только закрыть
 * мини-апп. Оба требования записаны в правилах и не были выполнены.
 *
 * Кнопку показываем ТОЛЬКО если есть куда возвращаться: неработающая кнопка
 * хуже отсутствующей. Подтверждение выхода включаем после первого ответа —
 * тому, кто просто заглянул, оно ни к чему; снимаем после результата, потому
 * что работа уже сделана и держать человека незачем.
 */
(function () {
  var t = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (!t) return;
  try {
    if (history.length > 1 && t.BackButton) {
      t.BackButton.onClick(function () { try { history.back(); } catch (e) {} });
      t.BackButton.show();
    }
  } catch (e) {}

  var armed = false;
  function arm() {
    if (armed) return;
    armed = true;
    try { t.enableClosingConfirmation(); } catch (e) {}
  }
  function relax() {
    armed = false;
    try { t.disableClosingConfirmation(); } catch (e) {}
  }
  document.addEventListener("click", arm, true);
  document.addEventListener("input", arm, true);

  // Результат показан — держать человека больше не нужно.
  ["renderResult", "renderDone", "showResult", "showDone"].forEach(function (name) {
    var fn = window[name];
    if (typeof fn !== "function") return;
    window[name] = function () { relax(); return fn.apply(this, arguments); };
  });
})();

</script>
