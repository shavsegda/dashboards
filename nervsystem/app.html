<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нервная система</title>
<style>
:root { color-scheme: light dark; }
html, body { margin: 0; }
body {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 24px calc(24px + var(--tg-safe-area-inset-right, 0px))
           24px calc(24px + var(--tg-safe-area-inset-left, 0px));
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
  font-size: 17px; line-height: 1.5; text-align: center;
  background: var(--tg-theme-bg_color, #fdfcfa);
  color: var(--tg-theme-text_color, #1a1a1a);
}
p { margin: 0 auto 10px; max-width: 20em; }
.hint { color: var(--tg-theme-hint_color, rgba(26, 26, 26, 0.5)); }
</style>
</head>
<body>
<main>
  <p class="hint">Открываю&nbsp;страницу&nbsp;замера.</p>
  <noscript>
    <p>Эта страница устарела.</p>
    <p class="hint">Замеры теперь в кнопке «Что со мной?» в боте.</p>
  </noscript>
</main>
<script>
/* Старая версия страницы замера. Файл оставлен нарочно: ссылки на него лежат в
   давних сообщениях бота, а сообщения в Телеграме живут годами. Удалить файл
   значит выдать человеку пустую ошибку вместо перехода.

   Хвост адреса переносим целиком: в нём приходит, чей это замер. Потеряем —
   актуальная страница не поймёт, чьи ответы записывать.

   Адрес цели относительный: так переход работает на любом домене и на любом
   вложенном пути. Уходим через replace: старый адрес не остаётся в истории, и
   кнопка «назад» не возвращает человека сюда. */
location.replace("app2.html" + location.search + location.hash);
</script>
</body>
</html>
