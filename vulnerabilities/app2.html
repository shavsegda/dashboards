<!DOCTYPE html>

<title>Уязвимости</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{--paper:#F4F2EC;--graphite:#1A1A1A;--terra:#B85C38;--muted:#7A756B;--rule:#E2DED4;--card:#FBFAF7;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--paper);color:var(--graphite);
    font-family:'Inter',-apple-system,system-ui,sans-serif;font-size:17px;line-height:1.5;}
  .wrap{max-width:620px;margin:0 auto;padding:20px 18px 40px;}
  h1{font-size:22px;margin:0 0 6px;font-weight:700;}
  .sub{color:var(--muted);font-size:14px;margin:0 0 18px;}
  .qbar{height:6px;background:var(--rule);border-radius:6px;overflow:hidden;margin:4px 0 8px;}
  .qbar>i{display:block;height:100%;background:var(--terra);transition:width .25s;}
  .qmeta{color:var(--muted);font-size:12.5px;margin-bottom:14px;}
  .qintro{background:#FBEEE7;border:1px solid #EBD5C8;border-radius:10px;padding:10px 13px;
    font-size:13px;color:#8A4527;margin-bottom:14px;line-height:1.45;}
  .refer{background:#FBEEE7;border:1px solid #EBD5C8;border-radius:10px;padding:11px 14px;
    font-size:13px;color:#8A4527;margin-bottom:14px;line-height:1.45;}
  .qbox{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:22px 18px;margin-bottom:14px;}
  .qtext{font-size:19px;font-weight:600;line-height:1.4;margin-bottom:20px;}
  .opts{display:flex;flex-direction:column;gap:9px;}
  .orow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    padding:14px 15px;border:1.5px solid var(--rule);border-radius:11px;background:#fff;
    font-family:inherit;font-size:15.5px;color:var(--graphite);cursor:pointer;transition:.12s;}
  .orow:active{transform:scale(.99);}
  .orow.sel{border-color:var(--terra);background:#FBEEE7;}
  .orow .onum{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rule);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--muted);}
  .orow.sel .onum{border-color:var(--terra);background:var(--terra);color:#fff;}
  .orow .olbl{flex:1;}
  .qnav{margin-top:6px;}
  .btn{width:100%;padding:15px;border-radius:12px;border:none;font-size:16px;font-weight:700;
    font-family:inherit;cursor:pointer;background:var(--terra);color:#fff;margin-top:8px;}
  .btn.ghost{background:transparent;border:1.5px solid var(--rule);color:var(--graphite);}
  .qnav .btn{width:auto;padding:11px 18px;margin-top:0;}
  .center{text-align:center;padding:40px 0;}
  .res-row{padding:14px 0;border-bottom:1px solid var(--rule);}
  .res-row .rn{font-weight:700;display:block;margin-bottom:4px;}
  .res-row .rv{display:block;}
  .res-row .rv b{display:block;font-weight:600;line-height:1.35;}
  .res-row .rv small{display:block;color:var(--muted);font-weight:400;font-size:12.5px;margin-top:2px;}
  .neu{color:var(--muted);}
  .ok{color:#2E7D32;font-weight:600;}
  .nav{display:flex;gap:10px;margin-top:20px;} .nav .btn{margin-top:0;}
  .qctx{background:var(--card);border:1px solid var(--rule);border-radius:12px;
    padding:14px 15px;font-size:15.5px;line-height:1.45;margin-bottom:12px;}
  .hublist{display:flex;flex-direction:column;gap:10px;margin-top:4px;}
  .hubrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 16px;
    border:1.5px solid var(--rule);border-radius:12px;background:#fff;font-family:inherit;cursor:pointer;transition:.12s;}
  .hubrow:active{transform:scale(.99);}
  .hb-l{flex:1;display:flex;flex-direction:column;gap:3px;}
  .hb-l b{font-size:16px;color:var(--graphite);}
  .hb-s{font-size:12.5px;color:var(--muted);}
  .hb-b{flex:0 0 auto;font-size:18px;color:var(--terra);font-weight:700;}
</style>

<script>
// ---- Telegram ----
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
function uidFromUrl(){try{const u=new URLSearchParams(location.search).get('u');if(u&&u.indexOf('tg_')===0){const n=parseInt(u.slice(3),10);if(!isNaN(n))return n;}}catch(e){}return null;}
const UID = (tg?.initDataUnsafe?.user?.id) || uidFromUrl() || null;
const CLIENT_ID = UID ? ('tg_'+UID) : 'anon';
const STORE_KEY = 'vulnerabilities_'+CLIENT_ID;
const RESULT_KEY = 'vulnerabilities_result_'+CLIENT_ID;
// Ключ облака Telegram (общий на весь бот, поэтому уникальный для блока)
const CLOUD_KEY = 'res_vulnerabilities';

// ---- Supabase (прямой fetch — надёжно) ----
const SUPABASE_URL = "https://tsregyrxtmkxrxvpsvot.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_yppYfhMVGsvSrFRxDij81w_7fO-1VSo";
async function pushToSupabase(record){
  try{
    await fetch(SUPABASE_URL+'/rest/v1/passport', {
      method:'POST',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,
        'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify(record)
    });
  }catch(e){}
}

// ---- Шкалы ответов ----
// Согласие 1..5 — для SD4 и FMPS
const AGREE5 = [
  {v:1,l:'Совсем не согласен'},{v:2,l:'Скорее не согласен'},{v:3,l:'Нейтрально'},
  {v:4,l:'Скорее согласен'},{v:5,l:'Полностью согласен'}
];
// «Про меня» 1..4 — для PID-5-BF (в подсчёте вычитаем 1 → 0..3)
const ME4 = [
  {v:1,l:'Совсем не про меня'},{v:2,l:'Скорее не про меня'},
  {v:3,l:'Скорее про меня'},{v:4,l:'Точно про меня'}
];

// ================= ТЕСТ 1. SD4 — тёмная тетрада =================
// 28 пунктов, 4 шкалы по 7. Рабочий перевод. Порядок = порядок ключа.
const SD4_ITEMS = [
  // Расчёт (макиавеллизм) 1–7
  'Не стоит давать людям знать свои секреты.',
  'Чего бы это ни стоило, влиятельных людей нужно перетянуть на свою сторону.',
  'Лучше избегать прямых конфликтов: люди ещё могут пригодиться.',
  'Хочешь добиться своего — держись в тени.',
  'Чтобы повернуть ситуацию в свою пользу, нужен расчёт.',
  'Лесть — хороший способ расположить людей к себе.',
  'Обожаю, когда хитрый план срабатывает.',
  // Грандиозность (нарциссизм) 8–14
  'Люди видят во мне прирождённого лидера.',
  'У меня особый талант убеждать людей.',
  'Без меня компания обычно скучает.',
  'Я знаю, что я особенный: мне часто об этом говорят.',
  'У меня есть незаурядные качества.',
  'Скорее всего, в чём-то я ещё стану звездой.',
  'Мне нравится время от времени себя показать.',
  // Импульс и риск (психопатия) 15–21
  'Мне часто говорят, что я себя не контролирую.',
  'Я склонен идти против начальства и правил.',
  'Я участвовал в драках чаще, чем большинство ровесников.',
  'Я сначала бросаюсь в дело, а вопросы задаю потом.',
  'У меня были проблемы с законом.',
  'Иногда я попадаю в опасные ситуации.',
  'Кто со мной свяжется — потом жалеет.',
  // Жёсткость к другим (садизм) 22–28
  'Драка на кулаках меня будоражит.',
  'Мне правда нравятся жестокие фильмы и игры.',
  'Смешно, когда человек падает лицом в грязь.',
  'Мне нравится смотреть жёсткие виды спорта.',
  'Некоторые люди заслуживают страданий.',
  'Ради забавы я писал злые вещи в соцсетях.',
  'Я умею ранить человека одними словами.'
];

// ================= ТЕСТ 2. PID-5-BF — дезадаптивные черты =================
// 25 пунктов, 5 доменов по 5. Public domain (APA). Ответ 1..4 → в подсчёте −1 (0..3).
const PID_ITEMS = [
  'Люди назвали бы меня безрассудным.',                                   // 1
  'Мне кажется, я действую совершенно импульсивно.',                       // 2
  'Я понимаю, что не стоит, но всё равно принимаю опрометчивые решения.',   // 3
  'Мне часто кажется, что всё, что я делаю, не имеет значения.',           // 4
  'Другие считают меня безответственным.',                                 // 5
  'Я плохо умею планировать наперёд.',                                     // 6
  'Мои мысли часто непонятны другим.',                                     // 7
  'Я тревожусь почти обо всём.',                                           // 8
  'Я легко становлюсь эмоциональным, часто из-за мелочей.',                // 9
  'Больше всего я боюсь остаться в жизни один.',                           // 10
  'Я застреваю на одном способе, даже когда ясно, что он не работает.',    // 11
  'Я видел то, чего на самом деле не было.',                               // 12
  'Я держусь подальше от романтических отношений.',                        // 13
  'Мне неинтересно заводить друзей.',                                      // 14
  'Меня легко раздражают самые разные вещи.',                              // 15
  'Я не люблю слишком сближаться с людьми.',                               // 16
  'Ничего страшного, если я задену чужие чувства.',                        // 17
  'Меня редко что-то по-настоящему увлекает.',                             // 18
  'Я жажду внимания.',                                                     // 19
  'Мне часто приходится иметь дело с людьми менее значимыми, чем я.',      // 20
  'У меня бывают мысли, понятные мне, но которые другие называют странными.', // 21
  'Я использую людей, чтобы получить своё.',                               // 22
  'Я часто «выпадаю», а потом понимаю, что прошло много времени.',         // 23
  'Всё вокруг часто кажется нереальным — или, наоборот, слишком реальным.',// 24
  'Мне легко воспользоваться другими в своих интересах.'                   // 25
];

// ================= ТЕСТ 3. FMPS — перфекционизм =================
// 35 пунктов, 6 подшкал. Ответ 1..5 (согласие). Организованность в общий балл не входит.
const FMPS_ITEMS = [
  'Родители ставили мне очень высокие планки.',                            // 1
  'Для меня очень важен порядок.',                                         // 2
  'В детстве меня наказывали, если я делал что-то не идеально.',           // 3
  'Если я не ставлю себе высшую планку, я скачусь в посредственность.',    // 4
  'Родители никогда не пытались понять мои ошибки.',                       // 5
  'Мне важно быть безупречно компетентным в том, что я делаю.',            // 6
  'Я аккуратный человек.',                                                 // 7
  'Я стараюсь быть организованным.',                                       // 8
  'Если я провалился в работе, значит, я неудачник как человек.',          // 9
  'Я обязан расстраиваться, если допустил ошибку.',                        // 10
  'Родители хотели, чтобы я был лучшим во всём.',                          // 11
  'Я ставлю себе цели выше, чем большинство.',                             // 12
  'Если кто-то справился с задачей лучше меня, я чувствую, что провалил её целиком.', // 13
  'Провалиться частично для меня так же плохо, как провалиться полностью.',// 14
  'В моей семье годился только выдающийся результат.',                     // 15
  'Я хорошо умею концентрироваться на достижении цели.',                   // 16
  'Даже когда я делаю что-то очень тщательно, мне часто кажется, что вышло не так.', // 17
  'Я терпеть не могу быть в чём-то не лучшим.',                            // 18
  'У меня очень высокие цели.',                                            // 19
  'Родители ждут от меня совершенства.',                                   // 20
  'Если я ошибусь, обо мне наверняка подумают хуже.',                      // 21
  'Мне всегда кажется, что я не дотягиваю до ожиданий родителей.',         // 22
  'Если я справляюсь хуже других, значит, я хуже как человек.',            // 23
  'Другие, кажется, позволяют себе более низкую планку, чем я.',           // 24
  'Если я не безупречен всё время, меня перестанут уважать.',              // 25
  'Родители всегда ждали от моего будущего больше, чем я сам.',            // 26
  'Я стараюсь быть аккуратным.',                                           // 27
  'Я часто сомневаюсь в простых повседневных делах.',                      // 28
  'Для меня очень важна аккуратность.',                                    // 29
  'В повседневных делах я жду от себя большего, чем большинство.',         // 30
  'Я организованный человек.',                                             // 31
  'Я часто отстаю, потому что переделываю одно и то же по многу раз.',     // 32
  'Мне нужно много времени, чтобы сделать что-то «как надо».',             // 33
  'Чем меньше я ошибаюсь, тем больше меня будут любить.',                  // 34
  'Мне всегда кажется, что я не соответствую планке родителей.'            // 35
];

const TESTS = [
  {
    key:'sd4', title:'Тёмная тетрада',
    what:'как ты играешь с людьми на грани: расчёт, грандиозность, импульс, жёсткость',
    note:'отвечай честно — это про склонности, а не про приговор',
    src:'SD4 · Полхус и др., 2020 · рабочий перевод',
    scale:AGREE5,
    items:SD4_ITEMS.map(t=>({t})),
    score:(ans)=>{
      const mean=(a,b)=>{let s=0,n=0;for(let i=a;i<=b;i++){if(ans[i]!=null){s+=ans[i];n++;}}return n?s/n:0;};
      const mach=mean(0,6), narc=mean(7,13), psy=mean(14,20), sad=mean(21,27);
      const parts=[['Расчёт',mach],['Грандиозность',narc],['Импульс и риск',psy],['Жёсткость',sad]];
      const top=parts.slice().sort((x,y)=>y[1]-x[1])[0];
      const lvl=(m)=>m>=3.5?'высокий':(m>=2.5?'средний':'низкий');
      return {band:{t:'Заметнее всего под давлением: '+top[0].toLowerCase()+' ('+lvl(top[1])+')',c:'neu'},
        nums:`Расчёт ${mach.toFixed(1)} · грандиозность ${narc.toFixed(1)} · импульс ${psy.toFixed(1)} · жёсткость ${sad.toFixed(1)} (шкала 1–5)`,
        data:{mach:+mach.toFixed(2), narcissism:+narc.toFixed(2), psychopathy:+psy.toFixed(2), sadism:+sad.toFixed(2)}};
    }
  },
  {
    key:'pid5bf', title:'Черты под стрессом',
    what:'что всплывает, когда тяжело: тревога, отстранённость, антагонизм, расторможенность, необычность',
    note:'как это про тебя вообще, в целом по жизни',
    src:'PID-5-BF · DSM-5, APA · рабочий перевод',
    scale:ME4,
    items:PID_ITEMS.map(t=>({t})),
    score:(ans)=>{
      // ответ 1..4 → 0..3
      const v=(i)=>ans[i]!=null?ans[i]-1:0;
      const sum=(arr)=>arr.reduce((n,i)=>n+v(i),0);
      // домены (0-индексация пунктов)
      const NEG=[7,8,9,10,14], DET=[3,12,13,15,17], ANT=[16,18,19,21,24], DIS=[0,1,2,4,5], PSY=[6,11,20,22,23];
      const dom=[['негативная аффективность',sum(NEG)],['отстранённость',sum(DET)],
        ['антагонизм',sum(ANT)],['расторможенность',sum(DIS)],['необычность восприятия',sum(PSY)]];
      // средний по домену 0..3; ≥2 = заметно
      const hi=dom.filter(d=>d[1]/5>=2).map(d=>d[0]);
      const band = hi.length ? {t:'Под стрессом всплывает: '+hi.join(', '),c:'neu'}
                             : {t:'Профиль ровный, выраженных пиков нет',c:'ok'};
      return {band,
        nums:dom.map(d=>d[0].split(' ')[0]+' '+(d[1]/5).toFixed(1)).join(' · ')+' (0–3)',
        data:{neg:sum(NEG),det:sum(DET),ant:sum(ANT),dis:sum(DIS),psy:sum(PSY)}};
    }
  },
  {
    key:'fmps', title:'Перфекционизм',
    what:'какой у тебя перфекционизм — здоровые стандарты или гнёт ошибок и сомнений',
    note:'отвечай про то, как есть, а не как «должно быть»',
    src:'FMPS · Фрост и др., 1990 · рабочий перевод',
    scale:AGREE5,
    items:FMPS_ITEMS.map(t=>({t})),
    score:(ans)=>{
      // подшкалы (0-индексация)
      const CM=[8,9,12,13,17,20,22,24,33], PS=[3,5,11,15,18,23,29],
            PE=[0,10,14,19,25], PC=[2,4,21,34], D=[16,27,31,32], O=[1,6,7,26,28,30];
      const sum=(arr)=>arr.reduce((n,i)=>n+(ans[i]!=null?ans[i]:0),0);
      const mean=(arr)=>{let s=0,n=0;arr.forEach(i=>{if(ans[i]!=null){s+=ans[i];n++;}});return n?s/n:0;};
      const malad=mean(CM.concat(D,PC,PE)); // дезадаптивная сторона
      const adapt=mean(PS.concat(O));        // здоровая сторона
      let band;
      if(malad-adapt>0.5) band={t:'Перфекционизм скорее дезадаптивный: тревога об ошибках сильнее здоровых стандартов',c:'neu'};
      else if(adapt-malad>0.5) band={t:'Перфекционизм скорее здоровый: высокая планка без гнёта ошибок',c:'ok'};
      else band={t:'Перфекционизм смешанный: стандарты и тревога об ошибках рядом',c:'neu'};
      return {band,
        nums:`Дезадаптивная сторона ${malad.toFixed(1)} · здоровая ${adapt.toFixed(1)} (шкала 1–5)`,
        data:{cm:sum(CM),ps:sum(PS),pe:sum(PE),pc:sum(PC),d:sum(D),o:sum(O)}};
    }
  }
];

const app = document.getElementById('app');

let answers={};        // {testKey:{i:v}}
let priorScores={};    // прошлые результаты (галочки + слияние)
let cur=null;          // {ti,pos} или null (список)
try{ const s=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');
  if(s.answers) answers=s.answers; if(s.priorScores) priorScores=s.priorScores; if(s.cur) cur=s.cur; }catch(e){}
function save(){ try{localStorage.setItem(STORE_KEY,JSON.stringify({answers,priorScores,cur}));}catch(e){} }

function testFullyAnswered(t){ const a=answers[t.key]||{}; return t.items.every((_,i)=>a[i]!=null); }
function testAnsweredCount(t){ const a=answers[t.key]||{}; return t.items.filter((_,i)=>a[i]!=null).length; }

function combinedScores(){
  const out={};
  TESTS.forEach(t=>{
    if(testFullyAnswered(t)){ const r=t.score(answers[t.key]); out[t.key]={...r.data, nums:r.nums, band:r.band.t, band_c:r.band.c}; }
    else if(priorScores[t.key]){ out[t.key]=priorScores[t.key]; }
  });
  return out;
}

async function pushCombined(){
  const scores=combinedScores();
  priorScores=scores;
  const completed_at=new Date().toISOString();
  const record={user_id:UID, block:'vulnerabilities', instrument:'SD4 + PID-5-BF + FMPS', scores, answers, completed_at};
  await pushToSupabase(record);
  try{ localStorage.setItem(RESULT_KEY, JSON.stringify({scores,answers,completed_at})); }catch(e){}
  try{ localStorage.setItem(RESULT_KEY+'_pushed', completed_at); }catch(e){}
  // Облако Telegram: результаты переживают очистку памяти телефона
  // и подтягиваются при заходе с другого устройства.
  try{
    tg?.CloudStorage?.setItem(CLOUD_KEY, JSON.stringify({scores, completed_at}), ()=>{});
  }catch(e){}
  if(tg&&typeof tg.sendData==='function'){ try{ tg.sendData(JSON.stringify({type:'vulnerabilities',scores})); }catch(e){} }
  save();
}

function optRow(o, selected){
  return `<button class="orow ${selected?'sel':''}" data-v="${o.v}">
    <span class="onum">${o.v}</span><span class="olbl">${o.l||''}</span></button>`;
}

function renderHub(msg){
  cur=null; save();
  const rows=TESTS.map((t,idx)=>{
    let status, badge='→', cls='';
    if(testFullyAnswered(t)){ const s=t.score(answers[t.key]); status=s.band.t; badge='✓'; cls=s.band.c||''; }
    else if(priorScores[t.key]){ status=priorScores[t.key].band||'готово'; badge='✓'; cls=priorScores[t.key].band_c||''; }
    else { const c=testAnsweredCount(t); status = c>0 ? ('в процессе · '+c+' из '+t.items.length) : ('не пройден · '+t.items.length+' вопр.'); }
    return `<button class="hubrow" data-ti="${idx}">
      <span class="hb-l"><b>${t.title}</b><span class="hb-s ${cls}">${status}</span></span>
      <span class="hb-b">${badge}</span></button>`;
  }).join('');
  app.innerHTML=`
    <h1>Уязвимости</h1>
    <p class="sub">Что срабатывает под давлением</p>
    ${msg?`<div class="refer"><span class="ok">${msg}</span></div>`:''}
    <div class="refer">Не диагноз и не приговор — карта уязвимых мест, чтобы ставить предохранители. Если что-то из этого всерьёз мешает жить, это повод поговорить с психологом или врачом, а не тест.</div>
    <div class="qintro">Три коротких опросника. Проходи по одному — можно бросить и вернуться, каждый пересдаётся отдельно.</div>
    <div class="hublist">${rows}</div>
    ${Object.keys(combinedScores()).length ? '<button class="btn" id="showres" style="margin-top:16px">📊 Показать результаты</button>' : ''}`;
  const sr=document.getElementById('showres'); if(sr) sr.onclick=()=>renderResults();
  app.querySelectorAll('.hubrow').forEach(el=>el.onclick=()=>{
    const idx=+el.dataset.ti, t=TESTS[idx];
    if(testFullyAnswered(t)||priorScores[t.key]){
      if(!confirm('«'+t.title+'» уже пройден. Пройти заново? Прошлый результат этого теста заменится, остальные не тронутся.')) return;
      answers[t.key]={};
    }
    let p=0; const a=answers[t.key]||{};
    for(let i=0;i<t.items.length;i++){ if(a[i]==null){ p=i; break; } p=i; }
    cur={ti:idx,pos:p}; save(); renderQuestion();
  });
  window.scrollTo(0,0);
}

function renderQuestion(){
  if(!cur){ return renderHub(); }
  const t=TESTS[cur.ti];
  answers[t.key]=answers[t.key]||{};
  if(cur.pos<0) cur.pos=0;
  if(cur.pos>=t.items.length){ return finishTest(t); }
  const it=t.items[cur.pos];
  const opts=it.opts||t.scale;
  const val=answers[t.key][cur.pos];
  const intro=(cur.pos===0)?`<div class="qintro">${t.what}${t.note?' · '+t.note:''}</div>`:'';
  const prevCtx = cur.pos>0 ? (t.items[cur.pos-1].ctx||'') : '';
  const ctx = (it.ctx && it.ctx!==prevCtx) ? `<div class="qctx">${it.ctx}</div>` : '';
  app.innerHTML=`
    <div class="qbar"><i style="width:${Math.round(cur.pos/t.items.length*100)}%"></i></div>
    <div class="qmeta">${t.title} · вопрос ${cur.pos+1} из ${t.items.length}</div>
    ${intro}${ctx}
    <div class="qbox"><div class="qtext">${it.t}</div>
      <div class="opts">${opts.map(o=>optRow(o,val===o.v)).join('')}</div></div>
    <div class="qnav"><button class="btn ghost" id="back">← ${cur.pos===0?'К списку':'Назад'}</button></div>`;
  let locked=false;
  app.querySelectorAll('.orow').forEach(el=>el.onclick=()=>{
    if(locked) return; locked=true;
    answers[t.key][cur.pos]=+el.dataset.v; save();
    app.querySelectorAll('.orow').forEach(o=>o.classList.remove('sel'));
    el.classList.add('sel');
    setTimeout(()=>{ cur.pos++; save(); renderQuestion(); }, 160);
  });
  document.getElementById('back').onclick=()=>{
    if(cur.pos===0){ renderHub(); } else { cur.pos--; save(); renderQuestion(); }
  };
  window.scrollTo(0,0);
}

async function finishTest(t){
  app.innerHTML=`<div class="center"><h1>Готово</h1><p class="sub">Сохраняю…</p></div>`;
  await pushCombined();
  renderHub('«'+t.title+'» засчитан и отправлен боту.');
}

function renderResults(){
  const scores=combinedScores();
  const rows=TESTS.filter(t=>scores[t.key]).map(t=>{
    const s=scores[t.key];
    return `<div class="res-row"><span class="rn">${t.title}</span>
      <span class="rv"><b class="${s.band_c||'neu'}">${s.band||'—'}</b><small>${s.nums||''}</small></span></div>`;
  }).join('');
  app.innerHTML=`
    <h1>Твои уязвимости</h1>
    <p class="sub">Где ставить предохранители</p>
    ${rows||'<p class="sub">Пока ничего не пройдено.</p>'}
    <div class="refer">Это склонности, а не диагноз. Высокие значения — не «ты плохой», а места, где под стрессом легче сорваться. Если тревожит — обсуди со специалистом.</div>
    <div class="nav"><button class="btn ghost" id="tolist">← К списку</button></div>`;
  document.getElementById('tolist').onclick=()=>renderHub();
  window.scrollTo(0,0);
}

// ---- Вход ----
let urlResult=null;
try{ const r=new URLSearchParams(location.search).get('r'); if(r) urlResult=JSON.parse(r); }catch(e){}
let savedResult=null;
try{ savedResult=JSON.parse(localStorage.getItem(RESULT_KEY)||'null'); }catch(e){}
if(!savedResult||!savedResult.scores){
  try{ const a=JSON.parse(localStorage.getItem(RESULT_KEY.replace(CLIENT_ID,'anon'))||'null');
    if(a&&a.scores) savedResult=a; }catch(e){}
}
if(Object.keys(priorScores).length===0){
  if(urlResult&&urlResult.scores) priorScores={...urlResult.scores};
  else if(savedResult&&savedResult.scores) priorScores={...savedResult.scores};
  if(savedResult&&savedResult.answers && Object.keys(answers).length===0) answers={...savedResult.answers};
  save();
}
// Если локально пусто — пробуем поднять из облака Telegram.
try{
  if(Object.keys(priorScores).length===0 && tg?.CloudStorage?.getItem){
    tg.CloudStorage.getItem(CLOUD_KEY, function(err, val){
      if(err || !val) return;
      try{
        const o = JSON.parse(val);
        if(o && o.scores && Object.keys(o.scores).length && Object.keys(priorScores).length===0){
          priorScores = {...o.scores};
          save();
          if(!cur) renderHub('Результаты подтянулись из облака Telegram.');
        }
      }catch(e){}
    });
  }
}catch(e){}

if(cur && typeof cur.ti==='number'){ renderQuestion(); } else { renderHub(); }
</script>
