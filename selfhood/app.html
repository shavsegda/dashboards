<style>
:root {
  --paper: #F4F2EC;
  --stone: #E8E5DC;
  --graphite: #1A1A1A;
  --graphite-90: rgba(26,26,26,0.9);
  --graphite-75: rgba(26,26,26,0.75);
  --graphite-65: rgba(26,26,26,0.65);
  --graphite-50: rgba(26,26,26,0.5);
  --graphite-30: rgba(26,26,26,0.3);
  --graphite-15: rgba(26,26,26,0.15);

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { font-family: var(--font-sans); background: var(--paper); color: var(--graphite); line-height: 1.55; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body { min-height: 100vh; }

.progress { position: sticky; top: 0; background: var(--paper); padding: 14px 0 10px; z-index: 10; border-bottom: 1px solid var(--graphite-08); }
.progress-track { max-width: 640px; margin: 0 auto; padding: 0 24px; }
.progress-bar { height: 2px; background: var(--graphite-08); position: relative; overflow: hidden; }
.progress-fill { height: 100%; background: var(--terracotta); transition: width 0.3s ease; width: 0%; }
.progress-text { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--graphite-50); margin-top: 8px; display: flex; justify-content: space-between; }

main { max-width: 640px; margin: 0 auto; padding: 40px 24px 80px; }
h1 { font-size: 34px; font-weight: 500; letter-spacing: -0.025em; line-height: 1.05; margin-bottom: 10px; }
h2 { font-size: 20px; font-weight: 500; letter-spacing: -0.015em; margin: 28px 0 10px; }
p { margin-bottom: 12px; color: var(--graphite-75); }
.lead { font-size: 17px; line-height: 1.5; color: var(--graphite-75); margin-bottom: 24px; max-width: 540px; }
.note { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--graphite-50); }

button.secondary { background: transparent; color: var(--graphite); border: 1px solid var(--graphite-30); padding: 13px 27px; }
button.secondary:hover { background: transparent; color: var(--terracotta); border-color: var(--terracotta); }
.actions { margin-top: 28px; display: flex; gap: 12px; flex-wrap: wrap; }

.weather { border-left: 2px solid var(--terracotta); background: var(--terracotta-tint); padding: 14px 16px; margin: 22px 0; font-size: 14px; line-height: 1.5; color: var(--graphite-75); }

.tag { display: inline-block; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--terracotta); border: 1px solid var(--terracotta); padding: 2px 6px; margin-left: 8px; vertical-align: middle; white-space: nowrap; }

.q-card { margin: 0 0 8px; }
.q-block { font-family: var(--font-mono); font-size: 11px; color: var(--graphite-50); text-transform: uppercase; letter-spacing: 0.2em; margin-bottom: 16px; }
.q-text { font-size: 22px; line-height: 1.25; margin-bottom: 20px; font-weight: 500; letter-spacing: -0.015em; }
.q-instr { font-size: 15px; color: var(--graphite-65); margin-bottom: 18px; line-height: 1.5; }

.ans-row { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; padding: 13px 20px; border-bottom: 1px solid var(--graphite-08); }
.ans-row:last-child { border-bottom: 0; }
.ans-q { font-size: 14px; color: var(--graphite-75); flex: 1; }
.ans-a { font-size: 14px; color: var(--graphite); font-weight: 500; text-align: right; max-width: 46%; }
.shift-word { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; color: var(--terracotta); text-align: right; }
.first-point { font-size: 14px; color: var(--graphite-75); padding: 16px 20px; }
.band { font-size: 16px; line-height: 1.45; margin-bottom: 18px; }
.band.warn { color: var(--alert); }

.soft-card { border: 1px solid var(--graphite-30); padding: 18px 20px; margin-bottom: 22px; }

@media (max-width: 600px) {
  main { padding: 28px 20px 80px; }
  h1 { font-size: 28px; }
  .q-text { font-size: 19px; }
  .result-row { padding: 16px; }
  .ans-row { padding: 12px 16px; }

  const tgId = tg?.initDataUnsafe?.user?.id;
  if (tgId) return "tg_" + tgId;
  return "local_" + getOrCreateLocalUid();
}

      {t: 'Что бы ни случилось в моей жизни, я знаю: я не потеряю ощущение того, кто я такой.'},
      {t: 'Обычно я не меняю своё поведение просто чтобы кому-то угодить.'},
      {t: 'Когда я с кем-то спорю, я могу отделить своё мнение по вопросу от своих чувств к этому человеку.'},
      {t: 'Нет смысла расстраиваться из-за того, что я не могу изменить.'},
      {t: 'Я вполне принимаю себя таким, какой я есть.'},
      {t: 'Я могу сказать другим «нет» даже когда чувствую их давление.'},
      {t: 'Мне важнее делать то, что я считаю правильным, чем получить одобрение других.'},
      {t: 'Моя самооценка сильно зависит от того, что обо мне думают другие.', rev: true},
      {t: 'Обычно я делаю то, что считаю правильным, независимо от того, что говорят другие.'},
      {t: 'Под нагрузкой я обычно чувствую себя достаточно устойчиво.'}
    ]
  }
];

function getTest(key) { return TESTS.find(t => t.key === key); }

// Обратный пункт: максимум плюс минимум минус ответ.
// Для шкалы 1–7 это 8−X, для 1–6 — 7−X, для 1–5 — 6−X.
function flip(test, v) {
  const s = test.scale;
  return s[0].v + s[s.length - 1].v - v;
}

// Значение пункта с учётом реверса
function val(test, ans, i) {
  const v = ans[i] || 0;
  return test.items[i].rev ? flip(test, v) : v;
}

function round1(x) { return Math.round(x * 10) / 10; }

// === Скоринг ===
// Каждая функция возвращает {nums, band, c, data}

// SCCS: 12 пунктов, десять обратных. Авторы русской версии считают среднее.
// Показываем и среднее 1–5, и сумму 12–60. Выше — яснее себе.
function scoreClarity(ans) {
  const t = getTest('clarity');
  let sum = 0;
  t.items.forEach((it, i) => { sum += val(t, ans, i); });
  const mean = round1(sum / t.items.length);
  let band;
  if (mean >= 4.0) band = 'Ты отвечал, что себе понятен: картина себя держится и не рассыпается от настроения.';
  else if (mean >= 3.2) band = 'Ты отвечал, что себя в общем знаешь, но местами картинка плывёт: в одни дни понятен себе, в другие меньше.';
  else if (mean >= 2.4) band = 'Ты отвечал, что неясного про себя больше, чем ясного: представления о себе спорят друг с другом и меняются от дня ко дню.';
  else band = 'Ты отвечал, что себе сейчас непонятен: трудно сказать, кто ты и чего на самом деле хочешь.';
  return {
    // Сумму человеку не показываем: она есть в записи, но не на экране.
    nums: [
      {l: 'Ясность себе', v: mean, range: '1–5'}
    ],
    band: band,
    c: 'ok',
    data: {mean: mean, sum: sum}
  };
}

// Authenticity Scale (рус. версия): три подшкалы. Считаются РАЗДЕЛЬНО и не складываются.
// Аутентичная жизнь — 3 пункта (все обратные), самоотчуждение — 4, внешнее влияние — 4.
function scoreAuthenticity(ans) {
  const t = getTest('authenticity');
  let live = 0, alien = 0, infl = 0;
  t.items.forEach((it, i) => {
    const v = val(t, ans, i);
    if (it.s === 'live') live += v;
    else if (it.s === 'alien') alien += v;
    else infl += v;
  });
  // Живёшь по-своему: 3–21, выше — больше своего
  function lLive(x) {
    if (x >= 16) return 'живёшь по-своему';
    if (x >= 11) return 'по-своему получается наполовину';
    return 'своё почти не отстаиваешь';
  }
  // Самоотчуждение: 4–28, выше — хуже слышишь себя
  function lAlien(x) {
    if (x >= 19) return 'себя почти не слышишь';
    if (x >= 12) return 'себя слышишь через раз';
    return 'себя слышишь хорошо';
  }
  // Внешнее влияние: 4–28, выше — больше чужого сценария
  function lInfl(x) {
    if (x >= 19) return 'живёшь скорее по чужому сценарию';
    if (x >= 12) return 'чужое весит примерно столько же, сколько своё';
    return 'чужое мнение тебя почти не разворачивает';
  }
  const warn = (infl >= 19 || alien >= 19);
  return {
    nums: [
      {l: 'Живёшь по-своему', v: live, range: '3–21'},
      {l: 'Не слышишь себя', v: alien, range: '4–28'},
      {l: 'Идёшь за чужим', v: infl, range: '4–28'}
    ],
    band: 'Своё: ' + lLive(live) + '. Себя слышишь: ' + lAlien(alien) + '. Чужое: ' + lInfl(infl) + '. Это три разные величины, они не складываются в одну оценку.',
    c: warn ? 'warn' : 'ok',
    data: {authentic_living: live, self_alienation: alien, external_influence: infl}
  };
}

// DIDS: пять подшкал по 5 пунктов, обратных нет. Считаются РАЗДЕЛЬНО.
// Руминативный поиск — ключевой: это застревание в переборе.
function scoreIdentity(ans) {
  const t = getTest('identity');
  const sub = {cm: 0, eb: 0, re: 0, ic: 0, ed: 0};
  t.items.forEach((it, i) => { sub[it.s] += val(t, ans, i); });
  // Все подшкалы в диапазоне 5–25
  function lCm(x) {
    if (x >= 19) return 'выбор про свою жизнь сделан';
    if (x >= 13) return 'выбор наполовину сделан';
    return 'выбор ещё не сделан';
  }
  function lIc(x) {
    if (x >= 19) return 'выбранное ощущается своим';
    if (x >= 13) return 'выбранное своё не до конца';
    return 'выбранное своим не ощущается';
  }
  function lRe(x) {
    if (x >= 19) return 'застрял в переборе: ищешь, но не выбираешь';
    if (x >= 13) return 'перебор иногда затягивает';
    return 'перебор тебя не держит';
  }
  function lEb(x) {
    if (x >= 19) return 'смотришь широко';
    if (x >= 13) return 'смотришь по сторонам умеренно';
    return 'по сторонам почти не смотришь';
  }
  function lEd(x) {
    if (x >= 19) return 'проверяешь выбранное на прочность';
    if (x >= 13) return 'проверяешь выбранное иногда';
    return 'выбранное почти не проверяешь';
  }
  return {
    nums: [
      {l: 'Решение принято', v: sub.cm, range: '5–25'},
      {l: 'Решение своё', v: sub.ic, range: '5–25'},
      {l: 'Застреваешь в переборе', v: sub.re, range: '5–25'},
      {l: 'Смотришь вширь', v: sub.eb, range: '5–25'},
      {l: 'Проверяешь вглубь', v: sub.ed, range: '5–25'}
    ],
    band: 'Решение: ' + lCm(sub.cm) + '. Своё ли оно: ' + lIc(sub.ic) + '. Перебор: ' + lRe(sub.re) + '. Вширь: ' + lEb(sub.eb) + '. Вглубь: ' + lEd(sub.ed) + '. Пять разных величин — они не складываются, и бывает, что несколько идут сильно сразу.',
    c: sub.re >= 19 ? 'warn' : 'ok',
    data: {
      commitment: sub.cm,
      identification: sub.ic,
      rumination: sub.re,
      exploration_breadth: sub.eb,
      exploration_depth: sub.ed
    }
  };
}

// I-position (DSI-R): среднее по 11 пунктам, обратный один — про зависимость самооценки.
// Выше — устойчивее держишь себя рядом с другим.
function scoreIposition(ans) {
  const t = getTest('iposition');
  let sum = 0;
  t.items.forEach((it, i) => { sum += val(t, ans, i); });
  const mean = round1(sum / t.items.length);
  let band;
  if (mean >= 4.6) band = 'Ты отвечал, что рядом с сильным человеком себя не теряешь: держишь своё и под давлением.';
  else if (mean >= 3.7) band = 'Ты отвечал, что в основном себя держишь, но под сильным напором своё иногда сдаёшь.';
  else if (mean >= 2.8) band = 'Ты отвечал, что под давлением своё часто уходит: легче согласиться, чем остаться при своём.';
  else band = 'Ты отвечал, что рядом с чужой силой себя почти не слышно: своё сдаёшь почти сразу.';
  return {
    // Сумму человеку не показываем: она есть в записи, но не на экране.
    nums: [
      {l: 'Держишь себя', v: mean, range: '1–6'}
    ],
    band: band,
    c: 'ok',
    data: {mean: mean, sum: sum}
  };
}

const SCORERS = {clarity: scoreClarity, authenticity: scoreAuthenticity, identity: scoreIdentity, iposition: scoreIposition};

// === Хранение результатов ===
let results = {};       // {clarity: {...}, authenticity: {...}, ...}
// Тесты, отвеченные В ЭТОМ заходе. Живёт только в памяти страницы: перезагрузили
// — снова пусто, и это правильно. В базу уходят ТОЛЬКО эти ключи (sessionKeys).
// Без такого фильтра ответ на один тест отправлял заодно все прошлые как
// свежие: `results` поднимается из памяти телефона и из облака, и в линии
// появлялись точки, которых человек не давал.
const answeredNow = new Set();
let cloudRestored = false;

function loadResultsLocal() {
  try {
    const s = localStorage.getItem(RESULT_KEY);
    if (s) results = JSON.parse(s) || {};
  } catch (e) { results = {}; }
}

function saveResultsLocal() {
  try { localStorage.setItem(RESULT_KEY, JSON.stringify(results)); } catch (e) {}
}

// Облачное восстановление: если на этом устройстве пусто, поднимаем историю из Telegram CloudStorage
function restoreFromCloud() {
  return new Promise(resolve => {
    if (!tg || !tg.CloudStorage || typeof tg.CloudStorage.getItem !== 'function') { resolve(false); return; }
    try {
      tg.CloudStorage.getItem(CLOUD_KEY, (err, value) => {
        if (err || !value) { resolve(false); return; }
        try {
          const cloud = JSON.parse(value) || {};
          // Берём из облака только то, что свежее локального
          Object.keys(cloud).forEach(k => {
            const local = results[k];
            if (!local || new Date(cloud[k].completed_at) > new Date(local.completed_at)) results[k] = cloud[k];
          });
          saveResultsLocal();
          resolve(true);
        } catch (e) { resolve(false); }
      });
    } catch (e) { resolve(false); }
  });
}

function saveToCloud() {
  if (!tg || !tg.CloudStorage || typeof tg.CloudStorage.setItem !== 'function') return;
  try { tg.CloudStorage.setItem(CLOUD_KEY, JSON.stringify(results), () => {}); } catch (e) {}
}

// === Прогресс прохождения (черновик незаконченного теста) ===
function saveProgress() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({key: state.key, idx: state.idx, answers: state.answers})); } catch (e) {}
}
function clearProgress() {
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
}

// === Отправка результата ===
function ownKeys() {
  return Object.keys(results).filter(k => TESTS.some(t => t.key === k));
}

// Что можно писать в базу: тест есть в реестре страницы И отвечен в этом заходе.
// Первое отсекает убранные тесты, второе — поднятые из памяти и из облака.
function sessionKeys() {
  return ownKeys().filter(k => answeredNow.has(k));
}

function buildScores() {
  // В scores складываем всё, что уже снято, плюс метку источника
  const scores = {source: 'manual'};
  sessionKeys().forEach(k => {
    // Кладём и цифры, и человеческую формулировку: по band бот показывает
    // результат в разговоре и в панели, без него замер выглядит пустым.
    scores[k] = Object.assign({}, results[k].data, {
      band: results[k].band,
      nums: results[k].nums
    });
  });
  return scores;
}

function buildAnswers() {
  const answers = {};
  sessionKeys().forEach(k => { answers[k] = results[k].answers; });
  return answers;
}

async function pushToSupabase(record) {
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/' + SUPABASE_TABLE, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(record)
    });
    return res.ok;
  } catch (e) {
    console.error('Supabase push failed:', e);
    return false;
  }
}

// Оставлена намеренно неиспользуемой: tg.sendData мгновенно закрывает мини-апп,
// и запись в базу не успевает уйти. На финише её не зовём.
function sendToBot(record) {
  if (!tg || typeof tg.sendData !== 'function') return false;
  try {
    tg.sendData(JSON.stringify({type: 'selfhood', payload: record}));
    return true;
  } catch (e) {
    console.error('sendData failed:', e);
    return false;
  }
}

// === Состояние экрана ===
const state = {screen: 'hub', key: null, idx: 0, answers: {}, sync: '', syncMsg: ''};
const app = document.getElementById('app');

// === Прогресс-бар ===
function updateProgress() {
  const bar = document.getElementById('progressBar');
  const fill = document.getElementById('progressFill');
  const text = document.getElementById('progressText');
  const count = document.getElementById('progressCount');
  if (state.screen !== 'test') { bar.style.display = 'none'; return; }
  const t = getTest(state.key);
  const done = Object.keys(state.answers).length;
  bar.style.display = 'block';
  fill.style.width = ((done / t.items.length) * 100) + '%';
  text.textContent = t.title;
  count.textContent = done + ' / ' + t.items.length;
}

// === Сколько дней назад был замер ===
function pluralDays(n) {
  const n10 = n % 10, n100 = n % 100;
  if (n10 === 1 && n100 !== 11) return 'день';
  if (n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) return 'дня';
  return 'дней';
}
function lastSeen(key) {
  const r = results[key];
  if (!r || !r.completed_at) return 'замеров ещё не было';
  const days = Math.floor((Date.now() - new Date(r.completed_at).getTime()) / 86400000);
  if (days <= 0) return 'последний замер сегодня';
  return 'последний замер ' + days + ' ' + pluralDays(days) + ' назад';
}

// Метка «рабочий перевод» рядом с названием теста
function tagFor(t) {
  return t.translated ? `<span class="tag">${t.translatedLabel}</span>` : '';
}

// === Экран списка (хаб) ===
function renderHub() {
  state.screen = 'hub';
  const items = TESTS.map(t => `
    <div class="hub-item">
      <div class="hub-head">
        <div class="hub-title">${t.title}${tagFor(t)}</div>
        <div class="hub-when">${lastSeen(t.key)}</div>
      </div>
      <div class="hub-what">${t.what}</div>
      <div class="hub-note">${t.note}</div>
      <button onclick="startTest('${t.key}')">Снять новый замер</button>
    </div>
  `).join('');
  app.innerHTML = `
    <h1>Свою жизнь живёшь?</h1>
    <div class="sub">Есть ли под тобой опора · 59 вопросов · 8 минут</div>
    <div class="weather">${FRAME_TEXT}</div>
    ${items}
    ${Object.keys(results).length ? '<div class="actions"><button class="secondary" onclick="renderAllResults()">Показать последние результаты</button></div>' : ''}
  `;
  updateProgress();
}

// === Экран вопроса ===
function renderQuestion() {
  const t = getTest(state.key);
  const item = t.items[state.idx];
  const selected = state.answers[state.idx];
  app.innerHTML = `
    <div class="q-card">
      <div class="q-block">${t.title}${tagFor(t)}</div>
      ${(state.idx === 0 && t.instruction) ? `<div class="q-instr">${t.instruction}</div>` : ''}
      <div class="q-text">${item.t}</div>
      <div class="q-options">
        ${t.scale.map(s => `
          <div class="q-option ${selected === s.v ? 'selected' : ''}" onclick="answer(${s.v})">
            <span class="q-option-text">${s.l}</span>
          </div>
        `).join('')}
      </div>
    </div>
    <div class="actions">
      ${state.idx === 0
        ? '<button class="secondary" onclick="renderHub()">К списку</button>'
        : '<button class="secondary" onclick="prev()">Назад</button>'}
    </div>
  `;
  updateProgress();
}

// === Результат словами ===
// Ни балла, ни диапазона: сумма ответов человеку не показывается. Он читает то,
// что сам отметил, и куда это сдвинулось с прошлого раза. Правила мини-аппов,
// часть 4: балл человек примет как приговор, хотя это просто сумма его ответов.
function answerRows(key) {
  const t = getTest(key);
  const r = results[key] || {};
  const ans = r.answers || {};
  return t.items.map((it, i) => {
    const scale = it.scale || t.scale;
    const opt = (scale || []).find(s => s.v === ans[i]);
    if (!opt) return '';
    return `<div class="ans-row"><div class="ans-q">${it.t}</div><div class="ans-a">${opt.l}</div></div>`;
  }).join('');
}

// Сдвиг с прошлого раза — направление словами, без цифр. Прошлого нет — так и
// говорим: сравнить пока не с чем. Без упрёка и без обещаний.
function shiftRows(key) {
  const r = results[key] || {};
  const prev = r.prev && r.prev.nums;
  if (!prev) return '<div class="first-point">Сравнить пока не с чем — это точка отсчёта.</div>';
  return (r.nums || []).map(n => {
    const was = prev.find(p => p.l === n.l);
    const word = !was ? 'спрашиваем впервые'
      : (n.v > was.v ? 'выше, чем в прошлый раз'
      : (n.v < was.v ? 'ниже, чем в прошлый раз' : 'как в прошлый раз'));
    return `<div class="result-row"><div class="result-name">${n.l}</div><div class="shift-word">${word}</div></div>`;
  }).join('');
}

// === Экран результата одного теста ===
function renderResult(key) {
  state.screen = 'result';
  const t = getTest(key);
  const r = results[key];
  const rows = shiftRows(key);
  const answers = answerRows(key);
  const syncBlock = state.sync
    ? `<p class="sync-status${state.sync === 'error' ? ' error' : ''}">${state.syncMsg}</p>`
    : '';
  app.innerHTML = `
    <h1>${t.title}</h1>
    <div class="sub">Замер записан</div>
    <div class="band ${r.c === 'warn' ? 'warn' : ''}">${r.band}</div>
    <div class="res-h">Что ты ответил</div>
    <div class="result-card">${answers}</div>
    <div class="res-h">С прошлым разом</div>
    <div class="result-card">${rows}</div>
    <div class="weather">${FRAME_TEXT}</div>
    ${syncBlock}
    <div class="actions">
      <button class="secondary" onclick="renderHub()">К списку</button>
      ${tg ? '<button onclick="closeApp()">Закрыть</button>' : ''}
    </div>
  `;
  updateProgress();
}

// === Экран «все последние результаты» ===
function renderAllResults() {
  state.screen = 'result';
  const blocks = TESTS.filter(t => results[t.key]).map(t => {
    const r = results[t.key];
    const rows = shiftRows(t.key);
    return `
      <h2>${t.title}${tagFor(t)}</h2>
      <div class="hub-when" style="margin-bottom:10px;">${lastSeen(t.key)}</div>
      <div class="band ${r.c === 'warn' ? 'warn' : ''}">${r.band}</div>
      <div class="result-card">${rows}</div>
    `;
  }).join('');
  app.innerHTML = `
    <h1>Свою жизнь живёшь?</h1>
    <div class="sub">Последние результаты</div>
    ${blocks}
    <div class="weather">${FRAME_TEXT}</div>
    <div class="actions">
      <button class="secondary" onclick="renderHub()">К списку</button>
      ${tg ? '<button onclick="closeApp()">Закрыть</button>' : ''}
    </div>
  `;
  updateProgress();
}

function closeApp() { try { tg.close(); } catch (e) {} }

// === Действия ===
// Повторный замер — это норма, никаких переспрашиваний перед стартом
function startTest(key) {
  state.screen = 'test';
  state.key = key;
  state.idx = 0;
  state.answers = {};
  state.sync = '';
  state.syncMsg = '';
  renderQuestion();
}

function answer(v) {
  const t = getTest(state.key);
  state.answers[state.idx] = v;
  saveProgress();
  if (state.idx < t.items.length - 1) {
    state.idx++;
    renderQuestion();
  } else {
    finish();
  }
}

function prev() {
  if (state.idx > 0) { state.idx--; renderQuestion(); }
}

async function finish() {
  const key = state.key;
  const scored = SCORERS[key](state.answers);
  // Прошлый результат остаётся рядом: по нему считается сдвиг словами. В базу
  // он не уходит — запись собирается из data, band и nums.
  const before = results[key];
  results[key] = {
    prev: before ? {nums: before.nums, completed_at: before.completed_at} : null,
    nums: scored.nums,
    band: scored.band,
    c: scored.c,
    data: scored.data,
    answers: {...state.answers},
    completed_at: new Date().toISOString()
  };
  answeredNow.add(key);
  saveResultsLocal();
  saveToCloud();
  clearProgress();

  // Ни одного ответа в этом заходе — записи нет вовсе. Пустая запись хуже
  // отсутствия: она нарисует в линии точку, которой не было.
  if (!sessionKeys().length) {
    state.sync = 'error';
    state.syncMsg = 'Записывать пока нечего: в этот раз ни один тест не пройден.';
    // Экран результата рисуем только для существующего теста: по чужому ключу
    // рисовать нечего, и попытка уронила бы страницу.
    if (TESTS.some(t => t.key === key)) renderResult(key);
    return;
  }

  const record = {
    user_id: UID,
    block: BLOCK,
    instrument: INSTRUMENT,
    scores: buildScores(),
    answers: buildAnswers(),
    completed_at: results[key].completed_at
  };

  // sendData НЕ вызываем: он мгновенно закрывает мини-апп, и запись в базу
  // просто не успевает уйти — замер теряется целиком. Пишем напрямую.
  state.sync = 'saving';
  state.syncMsg = 'Сохраняю…';
  renderResult(key);

  const ok = await pushToSupabase(record);
  state.sync = ok ? 'ok' : 'error';
  state.syncMsg = ok
    ? 'Замер записан. Можно вернуться к списку и пройти остальное.'
    : 'Не удалось сохранить — открой замер через бота и попробуй ещё раз.';
  if (state.screen === 'result') renderResult(key);
}

// === Старт ===
(async () => {
  loadResultsLocal();
  cloudRestored = await restoreFromCloud();
  renderHub();
})();

/* ---- Кнопка назад и подтверждение выхода (спека 012) ----
 *
 * Дефект с живого телефона: из страницы некуда вернуться, только закрыть
 * мини-апп. Оба требования записаны в правилах и не были выполнены.
 *
 * Кнопку показываем ТОЛЬКО если есть куда возвращаться: неработающая кнопка
 * хуже отсутствующей. Подтверждение выхода включаем после первого ответа —
 * тому, кто просто заглянул, оно ни к чему; снимаем после результата, потому
 * что работа уже сделана и держать человека незачем.
 */
(function () {
  var t = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (!t) return;
  try {
    if (history.length > 1 && t.BackButton) {
      t.BackButton.onClick(function () { try { history.back(); } catch (e) {} });
      t.BackButton.show();
    }
  } catch (e) {}

  var armed = false;
  function arm() {
    if (armed) return;
    armed = true;
    try { t.enableClosingConfirmation(); } catch (e) {}
  }
  function relax() {
    armed = false;
    try { t.disableClosingConfirmation(); } catch (e) {}
  }
  document.addEventListener("click", arm, true);
  document.addEventListener("input", arm, true);

  // Результат показан — держать человека больше не нужно.
  ["renderResult", "renderDone", "showResult", "showDone"].forEach(function (name) {
    var fn = window[name];
    if (typeof fn !== "function") return;
    window[name] = function () { relax(); return fn.apply(this, arguments); };
  });
})();

</script>
