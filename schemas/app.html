async function pushToSupabase(record){
  try{
    const r = await fetch(SUPABASE_URL+'/rest/v1/passport', {

  {name:"Поиск одобрения", items:[97, 98, 99, 100, 101], plain:"Важно нравиться. Включается там, где тебя оценивают и сравнивают."},

  {name:"*Пунитивность (направленная на других)", items:[113, 114, 115, 116], plain:"За ошибку положено наказание — другому. Включается, когда кто-то не тянет свою часть."}

// ---- Сборка замера из данных ----
// ОДИН заход. Замер идёт целиком: 116 утверждений подряд, один экран — одно
// утверждение. Матриц и таблиц-сеток нет: в решётке человек отвечает столбцом,
// не читая, и данные портятся.
//
// Раньше здесь была разбивка на шесть частей. Её снял владелец 16.08.2026:
// возвращаться шесть раз неудобно, а длина в этом боте не помеха — соседние
// замеры идут одним заходом и длиннее («Личность» 240 вопросов, «Нервная
// система» 134), и разрыва на них нет. Разбивка была перестраховкой сборщика,
// а не требованием правообладателя.
const TEST = (function(){
  const nums = [];
  SCHEMAS.forEach(s=>s.items.forEach(n=>nums.push(n)));
  return {
    key:"ysq", title:"Что включается само", nums:nums, schemas:SCHEMAS,
    items: nums.map(n=>({t:ITEMS[n]})),
    scale: SCALE,
    what:'что у тебя включается само — в отношениях, в работе, под давлением',
    frame:'Это твои ответы, а не диагноз и не приговор. Здесь нет плохих ответов: '
      + 'то, что включается, когда-то помогало.'
  };
})();
const TESTS = [TEST];

// ---- Подсчёт. Арифметика считалки ANIMA, один в один ----
// Лист «Выраженность схем»:
//   среднее           = AVERAGE(пункты схемы)
//   доля высоких      = COUNTIF(пункты; ">4") / число пунктов   (ответы 5 и 6)
//   доля от четвёрки  = COUNTIF(пункты; ">3") / число пунктов   (ответы 4, 5, 6)
//   выражена          = IF(OR(среднее>=4; доля высоких>=0.5))
// Своей формулы тут нет ни одной.
function scorePart(t, ans){
  const pos = {};                       // номер пункта -> его место в списке
  t.nums.forEach((n,i)=>{ pos[n]=i; });
  const rows = t.schemas.map(s=>{
    const n = s.items.length;
    let sum=0, cnt=0, high=0, mid=0;
    s.items.forEach(num=>{
      const v = ans[pos[num]];
      if(v==null) return;
      cnt++; sum+=v;
      if(v>4) high++;                   // COUNTIF(">4")
      if(v>3) mid++;                    // COUNTIF(">3")
    });
    const mean = cnt ? sum/cnt : null;
    const shareHigh = high/n, shareMid = mid/n;
    const raised = (mean!=null && mean>=4) || shareHigh>=0.5;
    return {name:s.name, plain:s.plain, mean:mean, high:shareHigh, mid:shareMid,
            raised:raised, answered:cnt, total:n};
  });
  return rows;
}

const pct = (x)=>Math.round(x*100);
const one = (x)=>(x==null?'—':x.toFixed(1));

// Полоса для человека — предложение без цифры и без латиницы. Бот показывает
// ровно её (`passport_result_lines` выкидывает всё, где есть цифра или
// латинская буква), поэтому ни того, ни другого тут быть не может.
function bandText(rows){
  const up = rows.filter(r=>r.raised);
  if(!up.length) return 'Заметно ничего не откликнулось';
  return 'Заметно откликнулось: ' + up.map(r=>r.plain.split('.')[0].toLowerCase()).join('; ');
}

// Строка с числами — только владельцу и модели. Человеку не показывается нигде.
function numsText(t, rows){
  return t.title + ' · ' + rows.map(r=>
    r.name+' '+one(r.mean)+' · 5-6: '+pct(r.high)+'% · 4-6: '+pct(r.mid)+'%'
    + (r.raised?' · выражена':'')).join(' | ');
}

TESTS.forEach(t=>{
  t.score = (ans)=>{
    const rows = scorePart(t, ans);
    return {
      band: {t: bandText(rows), c:'neu'},
      nums: numsText(t, rows),
      data: {raised: rows.filter(r=>r.raised).map(r=>r.name),
             rows: rows.map(r=>({name:r.name, mean:r.mean==null?null:+r.mean.toFixed(2),
                                 high:+r.high.toFixed(3), mid:+r.mid.toFixed(3),
                                 raised:r.raised}))}
    };
  };
  // Что из этого следует. Про ответы, а не про характер: ни ярлыка, ни балла,
  // ни похвалы. Ничего не набралось — так и говорим, без «молодец».
  t.sense = (d)=>{
    const rows = scorePart(t, (answers[t.key]||{}));
    const up = rows.filter(r=>r.raised);
    if(!up.length) return 'Заметно ничего не набралось. '
      + 'Это про твои ответы сегодня, а не про то, какой ты.';
    return up.map(r=>r.plain).join('<br><br>');
  };
});

const app = document.getElementById('app');

let answers={};        // {ключ замера:{номер утверждения:ответ}}
let priorScores={};    // прошлый разбор — для галочки и сдвига
let cur=null;          // {pos} — где человек остановился, или null (экран входа)

// Переезд со старой разбивки. До 16.08.2026 ответы лежали шестью пачками
// (`p1`…`p6`), у каждой своя нумерация с нуля. Выбрасывать их нельзя: человек
// мог остановиться на восьмидесятом утверждении и уйти. Сдвиги — это места, с
// которых начиналась каждая пачка в общем списке из 116.
const OLD_OFFSETS = {p1:0, p2:23, p3:43, p4:67, p5:83, p6:101};
function migrateOld(a){
  if(!a || typeof a!=='object') return {};
  if(a[TEST.key]) return a;
  const flat={};
  Object.keys(OLD_OFFSETS).forEach(k=>{
    const part=a[k]; if(!part) return;
    Object.keys(part).forEach(i=>{
      const v=part[i];
      if(v!=null) flat[OLD_OFFSETS[k] + (+i)] = v;
    });
  });
  return Object.keys(flat).length ? {[TEST.key]:flat} : {};
}

try{ const s=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');
  if(s.answers) answers=migrateOld(s.answers);
  if(s.priorScores) priorScores=s.priorScores;
  // Метку берём, только если она из новой разметки: у старой был номер части.
  if(s.cur && typeof s.cur.pos==='number' && s.cur.ti==null) cur=s.cur; }catch(e){}
function save(){ try{localStorage.setItem(STORE_KEY,JSON.stringify({answers,priorScores,cur}));}catch(e){} }

function testFullyAnswered(t){ const a=answers[t.key]||{}; return t.items.every((_,i)=>a[i]!=null); }
function testAnsweredCount(t){ const a=answers[t.key]||{}; return t.items.filter((_,i)=>a[i]!=null).length; }

// Общая картина: свежий разбор там, где отвечено, иначе прошлый. Слияние, а не
// затирание: разбор, собранный в прошлый заход, никуда не девается.
function combinedScores(){
  const out={};
  TESTS.forEach(t=>{
    if(testFullyAnswered(t)){ const r=t.score(answers[t.key]); out[t.key]={...r.data, nums:r.nums, band:r.band.t}; }
    else if(priorScores[t.key]){ out[t.key]=priorScores[t.key]; }
  });
  return out;
}

// В базу уходит только полный разбор — у него есть строка с цифрами. Урезанную
// карту из адреса писать нельзя: она стала бы самой свежей и стёрла бы цифры.
function pushableScores(){
  const all=combinedScores(), out={};
  Object.keys(all).forEach(k=>{ const s=all[k]; if(s && s.nums) out[k]=s; });
  return out;
}

let pushing=false;   // замок: одна отправка за раз, пять нажатий — одна запись
let lastPushOk=false;
async function pushCombined(){
  if(pushing) return;
  pushing=true;
  try{
    const scores=pushableScores();
    priorScores=combinedScores();
    if(!Object.keys(scores).length) return;
    const completed_at=new Date().toISOString();
    const record={user_id:UID, block:'schemas', instrument:'YSQ-R (RU-m)',
                  scores, answers, completed_at};
    // Отметка «записано» ставится ТОЛЬКО после ответа сервера.
    lastPushOk = await pushToSupabase(record);
    if(lastPushOk){
      try{ localStorage.setItem(RESULT_KEY, JSON.stringify({scores,answers,completed_at})); }catch(e){}
      try{ localStorage.setItem(RESULT_KEY+'_pushed', completed_at); }catch(e){}
      try{ tg?.CloudStorage?.setItem(CLOUD_KEY, JSON.stringify({scores, completed_at}), ()=>{}); }catch(e){}
    }
    // `tg.sendData` здесь НЕ зовётся сознательно. Он мгновенно закрывает
    // мини-апп — человек не увидел бы того, ради чего пришёл, а он только что
    // ответил на 116 утверждений.
    // Бот подхватывает запись сторожем блока (`ensure_simple_block_synced`).
    save();
  } finally { pushing=false; }
}

function optRow(o, selected){
  return `<button class="orow ${selected?'sel':''}" data-v="${o.v}" aria-label="${o.l}">`
    + `<span class="onum">${o.v}</span><span class="olbl">${o.l}</span></button>`;
}

const PAGE_TITLE='Что включается само';
const PAGE_SUB='116 утверждений · один заход';
const PAGE_FRAME='Покажет, что у тебя включается автоматически — в отношениях, в работе '
  + 'и под давлением. Это твои ответы, а не диагноз.';
const PAGE_LEN='116 утверждений, минут пятнадцать. Можно бросить на середине и вернуться: '
  + 'ответы сохраняются, замер продолжится с того же места.';
// Требование правообладателя: авторы и ANIMA названы на странице. Это подпись
// источника, а не ярлык человеку — в разборе про него самого её нет.
const PAGE_SRC = 'Опросник YSQ-R: Yalcin, O., Marais, I., Lee, C., &amp; Correia, H. (2022). '
  + 'Revisions to the Young Schema Questionnaire using Rasch analysis. Australian Psychologist, 57, 8–20. '
  + 'Русская версия — ANIMA Health Network и Московский Институт Схема-Терапии '
  + '(Ялтонская А.В., Скрябина М.И., Прокаева С.В., Пличко А.В., Городенцева Н.А.). '
  + 'Материалы: <a href="https://www.anima.com.au/schema">anima.com.au/schema</a>. '
  + 'Даётся бесплатно для работы с клиентом у специалиста — этот замер идёт в сопровождении, а не вместо него.';

const PREV_KEY = RESULT_KEY+'_prev';
const FIRST_POINT = 'Сравнить пока не с чем — это точка отсчёта.';
let shiftPrev={}, shiftWords={};
try{ const p=JSON.parse(localStorage.getItem(PREV_KEY)||'{}');
  if(p.prev) shiftPrev=p.prev; if(p.words) shiftWords=p.words; }catch(e){}
function savePrev(){ try{ localStorage.setItem(PREV_KEY,
  JSON.stringify({prev:shiftPrev,words:shiftWords})); }catch(e){} }

// Сдвиг с прошлого раза — словами, без цифр. Сравниваем по схемам:
// откликалось и перестало, не откликалось и стало.
function makeShift(t){
  const rows = scorePart(t, (answers[t.key]||{}));
  const was = shiftPrev[t.key];
  shiftWords[t.key] = was ? rows.map(r=>{
    const w = was[r.name];
    return {l:r.plain.split('.')[0], w:(w==null) ? 'спрашиваем впервые'
      : (r.raised===w ? 'как в прошлый раз'
      : (r.raised ? 'откликается сильнее, чем в прошлый раз'
                  : 'откликается слабее, чем в прошлый раз'))};
  }) : null;
  const map={}; rows.forEach(r=>{ map[r.name]=r.raised; });
  shiftPrev[t.key]=map;
  savePrev();
}
function shiftBlock(t){
  const words=shiftWords[t.key];
  if(!words||!words.length) return `<div class="first-point">${FIRST_POINT}</div>`;
  return words.map(x=>`<div class="sh-row"><span class="rn">${x.l}</span><span class="shift">${x.w}</span></div>`).join('');
}
function senseBlock(t){
  const s = t.sense ? t.sense(combinedScores()[t.key]) : '';
  return s ? `<div class="band">${s}</div>` : '';
}
function answerRows(t){
  const a=answers[t.key]||{};
  return t.items.map((it,i)=>{
    const o=t.scale.find(s=>s.v===a[i]);
    return o ? `<div class="ans-row"><span class="ans-q">${it.t}</span><span class="ans-a">${o.l}</span></div>` : '';
  }).join('');
}

function renderTestResult(t){
  app.innerHTML=`
    <h1>${t.title}</h1>
    <p class="sub">${lastPushOk?'Ответы записаны':'Ответы сохранены на телефоне — запись повторим при следующем заходе'}</p>
    <div class="refer">${t.frame}</div>
    <div class="res-h">Что из этого видно</div>
    <div class="ans-card">${senseBlock(t)}</div>
    <div class="res-h">С прошлым разом</div>
    <div class="ans-card">${shiftBlock(t)}</div>
    <div class="res-h">Твои ответы</div>
    <div class="ans-card">${answerRows(t)}</div>
    <div class="nav"><button class="btn ghost" id="tolist">← В начало</button></div>
    <p class="src">${PAGE_SRC}</p>`;
  const b=document.getElementById('tolist'); if(b) b.onclick=()=>renderStart();
  window.scrollTo(0,0);
}

// Первое неотвеченное утверждение — отсюда замер продолжится.
function firstUnanswered(){
  const a=answers[TEST.key]||{};
  for(let i=0;i<TEST.items.length;i++){ if(a[i]==null) return i; }
  return TEST.items.length;
}

// Экран входа. Одна кнопка на весь замер: что это даст, честная длина, подпись
// источника — и «Начать». Бросил на середине — та же кнопка продолжает с места,
// на котором человек остановился, и говорит, сколько осталось.
function renderStart(msg){
  cur=null; save();
  const t=TEST, total=t.items.length;
  const done=testAnsweredCount(t);
  const passed=testFullyAnswered(t)||!!priorScores[t.key];
  let label, progress='';
  if(passed){ label='Пройти заново'; }
  else if(done>0){
    label='Продолжить — осталось '+(total-done);
    progress=`<div class="startbar"><div class="qbar">`
      + `<i style="width:${Math.round(done/total*100)}%"></i></div>`
      + `<div class="startlbl">${done} из ${total} отвечено</div></div>`;
  }
  else { label='Начать'; }
  app.innerHTML=`
    <h1>${PAGE_TITLE}</h1>
    <p class="sub">${PAGE_SUB}</p>
    ${msg?`<div class="refer">${msg}</div>`:''}
    <div class="refer">${PAGE_FRAME}</div>
    <div class="qintro">${PAGE_LEN}</div>
    ${passed?'<div class="qintro">Замер пройден. Ответы записаны.</div>':progress}
    <button class="btn" id="go">${label}</button>
    ${(passed&&testFullyAnswered(t))?'<button class="btn ghost" id="see">Посмотреть, что записано</button>':''}
    <p class="src">${PAGE_SRC}</p>`;
  document.getElementById('go').onclick=()=>{
    if(passed){
      if(!confirm('Замер уже пройден. Пройти заново? Прошлые ответы заменятся новыми.')) return;
      answers[t.key]={};
    }
    cur={pos:firstUnanswered()}; save(); renderQuestion();
  };
  const see=document.getElementById('see');
  if(see) see.onclick=()=>renderTestResult(t);
  window.scrollTo(0,0);
}

function renderQuestion(){
  if(!cur){ return renderStart(); }
  const t=TEST, total=t.items.length;
  answers[t.key]=answers[t.key]||{};
  if(cur.pos<0) cur.pos=0;
  if(cur.pos>=total){ return finishTest(); }
  const it=t.items[cur.pos];
  const val=answers[t.key][cur.pos];
  const done=testAnsweredCount(t);
  const intro=(cur.pos===0)?`<div class="qintro">${t.what}</div>`:'';
  // Прогресс на 116 утверждениях обязателен: человек должен видеть, сколько
  // осталось, иначе экран без края читается как бесконечный.
  app.innerHTML=`
    <div class="qbar"><i style="width:${Math.round(cur.pos/total*100)}%"></i></div>
    <div class="qmeta">Утверждение ${cur.pos+1} из ${total} · осталось ${total-done}</div>
    ${intro}
    <div class="qbox"><div class="qtext">${it.t}</div>
      <div class="opts">${t.scale.map(o=>optRow(o,val===o.v)).join('')}</div></div>
    <div class="qnav"><button class="btn ghost" id="back">← ${cur.pos===0?'В начало':'Назад'}</button></div>`;
  let locked=false;
  app.querySelectorAll('.orow').forEach(el=>el.onclick=()=>{
    if(locked) return; locked=true;
    answers[t.key][cur.pos]=+el.dataset.v; save();
    app.querySelectorAll('.orow').forEach(o=>o.classList.remove('sel'));
    el.classList.add('sel');
    setTimeout(()=>{ cur.pos++; save(); renderQuestion(); }, 160);
  });
  document.getElementById('back').onclick=()=>{
    if(cur.pos===0){ renderStart(); } else { cur.pos--; save(); renderQuestion(); }
  };
  window.scrollTo(0,0);
}

async function finishTest(){
  // Метку места снимаем СРАЗУ, до отправки: незакрытая метка указывает за
  // последнее утверждение, и следующий заход сам дошёл бы до конца и отправил
  // всё второй раз.
  const t=TEST;
  cur=null; save();
  app.innerHTML=`<div class="center"><h1>Готово</h1><p class="sub">Сохраняю…</p></div>`;
  await pushCombined();
  makeShift(t);
  renderTestResult(t);
}

// ---- Вход ----
let urlResult=null;
try{ const r=new URLSearchParams(location.search).get('r'); if(r) urlResult=JSON.parse(r); }catch(e){}
let savedResult=null;
try{ savedResult=JSON.parse(localStorage.getItem(RESULT_KEY)||'null'); }catch(e){}
// Прошлое из адреса подкладываем ВСЕГДА: в памяти телефона бывает пусто или
// частично, и раньше она закрывала собой всё, что прислал бот. Своё сильнее
// присланного — оно точно полное.
if(urlResult&&urlResult.scores){
  priorScores={...urlResult.scores, ...priorScores};
  save();
}
if(Object.keys(priorScores).length===0){
  if(savedResult&&savedResult.scores) priorScores={...savedResult.scores};
  if(savedResult&&savedResult.answers && Object.keys(answers).length===0)
    answers=migrateOld(savedResult.answers);
  save();
}
try{
  if(Object.keys(priorScores).length===0 && tg?.CloudStorage?.getItem){
    tg.CloudStorage.getItem(CLOUD_KEY, function(err, val){
      if(err || !val) return;
      try{
        const o = JSON.parse(val);
        if(o && o.scores && Object.keys(o.scores).length && Object.keys(priorScores).length===0){
          priorScores = {...o.scores};
          save();
          if(!cur) renderStart('Прошлый замер подтянулся из облака Телеграма.');
        }
      }catch(e){}
    });
  }
}catch(e){}

// Открытие страницы НИКОГДА не отправляет запись: продолжаем только там, где
// остались неотвеченные утверждения.
function resumable(){
  if(!cur || typeof cur.pos!=='number') return false;
  return cur.pos>=0 && cur.pos<TEST.items.length;
}
if(resumable()){ renderQuestion(); } else { cur=null; save(); renderStart(); }
</script>
