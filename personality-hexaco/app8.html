<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Личность</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="items.js"></script>
<style>
  :root{
    --paper:#F4F2EC; --graphite:#1A1A1A; --terra:#B85C38;
    --muted:#7A756B; --rule:#E2DED4; --card:#FBFAF7;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--paper);color:var(--graphite);
    font-family:'Inter',-apple-system,system-ui,sans-serif;font-size:17px;line-height:1.5;}
  .wrap{max-width:620px;margin:0 auto;padding:20px 18px 40px;}
  h1{font-size:22px;margin:0 0 6px;font-weight:700;}
  .sub{color:var(--muted);font-size:14px;margin:0 0 20px;}
  .bar{height:6px;background:var(--rule);border-radius:6px;overflow:hidden;margin:0 0 4px;}
  .bar>i{display:block;height:100%;background:var(--terra);width:0;transition:width .25s;}
  .barlbl{color:var(--muted);font-size:12px;text-align:right;margin-bottom:22px;}
  .q{background:var(--card);border:1px solid var(--rule);border-radius:14px;
    padding:22px 18px;margin-bottom:16px;}
  .qtext{font-size:19px;font-weight:600;margin-bottom:18px;line-height:1.4;}
  .likert{display:flex;flex-direction:column;gap:9px;}
  .opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--rule);
    border-radius:10px;cursor:pointer;background:#fff;transition:.12s;font-size:15px;}
  .opt:active{transform:scale(.99);}
  .opt.sel{border-color:var(--terra);background:#FBEEE7;}
  .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--rule);flex:0 0 auto;}
  .opt.sel .dot{border-color:var(--terra);background:var(--terra);box-shadow:inset 0 0 0 3px #fff;}
  .nav{display:flex;gap:10px;margin-top:8px;}
  .btn{flex:1;padding:14px;border-radius:12px;border:none;font-size:16px;font-weight:600;
    font-family:inherit;cursor:pointer;}
  .btn.ghost{background:transparent;border:1.5px solid var(--rule);color:var(--graphite);}
  .btn.prim{background:var(--terra);color:#fff;}
  .btn:disabled{opacity:.4;pointer-events:none;}
  .center{text-align:center;padding:40px 0;}
  .resume{background:#FBEEE7;border:1px solid #EBD5C8;border-radius:12px;padding:14px;
    font-size:14px;margin-bottom:18px;color:#8A4527;}
  .res-factor{margin:0 0 16px;}
  .res-factor .fname{display:flex;justify-content:space-between;font-weight:700;margin-bottom:5px;}
  .res-bar{height:22px;background:var(--rule);border-radius:6px;overflow:hidden;}
  .res-bar>i{display:block;height:100%;background:var(--terra);}
  .res-facets{color:var(--muted);font-size:13px;margin-top:5px;}
  .ok{color:#2E7D32;font-weight:600;}
  .err{color:#C0392B;font-weight:600;}
  /* Результат словами: свои ответы и сдвиг с прошлого раза вместо балла */
  .res-h{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;}
  .refer{background:#FBEEE7;border:1px solid #EBD5C8;border-radius:10px;padding:11px 14px;
    font-size:13px;color:#8A4527;margin-bottom:14px;line-height:1.45;}
  .ans-card{border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--card);}
  .ans-row{display:flex;align-items:baseline;gap:14px;padding:12px 15px;border-bottom:1px solid var(--rule);}
  .ans-row:last-child{border-bottom:0;}
  .ans-q{flex:1;font-size:14px;color:var(--muted);line-height:1.4;}
  .ans-a{font-size:14px;font-weight:600;text-align:right;max-width:46%;}
  .sh-row{display:flex;align-items:baseline;justify-content:space-between;gap:14px;
    padding:12px 15px;border-bottom:1px solid var(--rule);}
  .sh-row:last-child{border-bottom:0;}
  .sh-row .rn{font-size:14px;font-weight:600;}
  .shift{font-size:13px;color:var(--terra);text-align:right;}
  .first-point{padding:14px 15px;font-size:14px;color:var(--muted);}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const FACTORS = window.HEXACO_FACTORS;
const ITEMS = window.HEXACO_ITEMS;

const LIKERT = [
  {v:1,l:'Совсем не про меня'},
  {v:2,l:'Скорее нет'},
  {v:3,l:'Когда как'},
  {v:4,l:'Скорее да'},
  {v:5,l:'Точно про меня'}
];

// ---- Telegram ----
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
function uidFromUrl(){try{const u=new URLSearchParams(location.search).get('u');if(u&&u.indexOf('tg_')===0){const n=parseInt(u.slice(3),10);if(!isNaN(n))return n;}}catch(e){}return null;}
const UID = (tg?.initDataUnsafe?.user?.id) || uidFromUrl() || null;
const CLIENT_ID = UID ? ('tg_'+UID) : 'anon';
const STORE_KEY = 'hexaco_'+CLIENT_ID;        // прогресс (сбрасывается на финише)
const RESULT_KEY = 'hexaco_result_'+CLIENT_ID; // готовый результат (persist)
// Ключ облака Telegram (общий на весь бот, поэтому уникальный для блока)
const CLOUD_KEY = 'res_personality';

// ---- Supabase ----
const SUPABASE_URL = "https://tsregyrxtmkxrxvpsvot.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_yppYfhMVGsvSrFRxDij81w_7fO-1VSo";
// Пишем в Supabase прямым fetch — надёжнее, чем supabase-js (тот не принимал новый ключ).
async function pushToSupabase(record){
  try{
    await fetch(SUPABASE_URL+'/rest/v1/passport', {
      method:'POST',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,
        'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify(record)
    });
  }catch(e){}
}

// ---- Состояние + resume ----
let answers = {};   // {itemIndex: 1..5}
let idx = 0;
try{ const s=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');
  if(s.answers){answers=s.answers; idx=s.idx||0;} }catch(e){}
function save(){ try{localStorage.setItem(STORE_KEY,JSON.stringify({answers,idx}));}catch(e){} }

const app = document.getElementById('app');

// ===== Результат словами. Ни балла, ни ярлыка =====
// Цифру по фактору человек читает как оценку себя, хотя это просто сумма его
// ответов. Поэтому он видит другое: что сам отметил и куда это сдвинулось с
// прошлого раза. Правила мини-аппов, часть 4; конституция, IV и V.
// В базу цифры уходят как раньше — их читает бот и по ним собирается разбор.
const PAGE_TITLE='Личность';
const PAGE_SUB='Твои ответы про себя';
const PAGE_FRAME='Это твои ответы, а не оценка и не ярлык. Что тут про тебя, а что мимо?';
const PREV_KEY = RESULT_KEY+'_prev';
const FIRST_POINT = 'Сравнить пока не с чем — это точка отсчёта.';
let shiftPrev={}, shiftWords=null;
try{ const st=JSON.parse(localStorage.getItem(PREV_KEY)||'{}');
  if(st.prev) shiftPrev=st.prev; if(st.words) shiftWords=st.words; }catch(e){}
function savePrev(){ try{ localStorage.setItem(PREV_KEY,
  JSON.stringify({prev:shiftPrev,words:shiftWords})); }catch(e){} }

// Сдвиг с прошлого раза — направление словами, без цифр. Прошлого нет — так и
// говорим: сравнить пока не с чем. Без упрёка и без обещаний.
function makeShift(factors){
  const was=shiftPrev, keys=Object.keys(FACTORS).filter(f=>factors[f]!=null);
  const had=was && Object.keys(was).length>0;
  shiftWords = had ? keys.map(f=>{
    const w=was[f];
    return {l:FACTORS[f], w:(w==null) ? 'спрашиваем впервые'
      : (factors[f]>w ? 'выше, чем в прошлый раз'
      : (factors[f]<w ? 'ниже, чем в прошлый раз' : 'как в прошлый раз'))};
  }) : null;
  const m={}; keys.forEach(f=>{ m[f]=factors[f]; });
  shiftPrev=m; savePrev();
}
function shiftBlock(){
  if(!shiftWords||!shiftWords.length) return `<div class="first-point">${FIRST_POINT}</div>`;
  return shiftWords.map(x=>`<div class="sh-row"><span class="rn">${x.l}</span><span class="shift">${x.w}</span></div>`).join('');
}
// «Твои ответы» — пункт и выбранный вариант, его собственными словами.
function answerRows(){
  return ITEMS.map((it,i)=>{
    const o=LIKERT.find(x=>x.v===answers[i]);
    return o ? `<div class="ans-row"><span class="ans-q">${it.t}</span><span class="ans-a">${o.l}</span></div>` : '';
  }).join('');
}

function render(){
  const total = ITEMS.length;
  const done = Object.keys(answers).length;
  if(idx>=total){ return renderFinish(); }
  const it = ITEMS[idx];
  const cur = answers[idx];
  app.innerHTML = `
    <h1>${PAGE_TITLE}</h1>
    <p class="sub">Вопрос ${idx+1} из ${total}</p>
    <div class="bar"><i style="width:${Math.round(idx/total*100)}%"></i></div>
    <div class="barlbl">${done} из ${total} отвечено · можно бросить и вернуться</div>
    ${(idx===0&&done>0&&done<total)?'<div class="resume">Продолжаем с того места, где остановился.</div>':''}
    <div class="q">
      <div class="qtext">${it.t}</div>
      <div class="likert">
        ${LIKERT.map(o=>`<div class="opt ${cur===o.v?'sel':''}" data-v="${o.v}">
          <span class="dot"></span><span>${o.l}</span></div>`).join('')}
      </div>
    </div>
    <div class="nav">
      <button class="btn ghost" id="prev" ${idx===0?'disabled':''}>← Назад</button>
    </div>`;
  // Тап по ответу → подсветка → сразу следующий вопрос.
  let locked=false;
  app.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
    if(locked) return; locked=true;
    answers[idx]=+el.dataset.v; save();
    app.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
    el.classList.add('sel');
    setTimeout(()=>{ idx++; save(); window.scrollTo(0,0); render(); }, 160);
  });
  const pv=document.getElementById('prev');
  if(pv) pv.onclick=()=>{ idx=Math.max(0,idx-1); save(); window.scrollTo(0,0); render(); };
}

// ---- Скоринг ----
function score(){
  const facetSum={}, facetN={}, factorSum={}, factorN={};
  ITEMS.forEach((it,i)=>{
    const raw=answers[i]; if(raw==null) return;
    const v = it.key===1 ? raw : (6-raw);          // реверс
    const fk = it.f+'·'+it.facet;
    facetSum[fk]=(facetSum[fk]||0)+v; facetN[fk]=(facetN[fk]||0)+1;
    factorSum[it.f]=(factorSum[it.f]||0)+v; factorN[it.f]=(factorN[it.f]||0)+1;
  });
  const factors={}, facets={};
  Object.keys(FACTORS).forEach(f=>{ if(factorN[f]) factors[f]=+(factorSum[f]/factorN[f]).toFixed(2); });
  Object.keys(facetSum).forEach(fk=>{ facets[fk]=+(facetSum[fk]/facetN[fk]).toFixed(2); });
  return {factors,facets};
}

function resultRows(){
  const ans=answerRows();
  return `<div class="res-h">С прошлым разом</div>
    <div class="ans-card">${shiftBlock()}</div>
    ${ans?`<div class="res-h">Твои ответы</div><div class="ans-card">${ans}</div>`:''}`;
}

function retake(){
  if(confirm('Перепройти тест заново? Текущие результаты заменятся новыми.')){
    localStorage.removeItem(RESULT_KEY); localStorage.removeItem(STORE_KEY);
    answers={}; idx=0; window.scrollTo(0,0); render();
  }
}

// Экран текущих результатов + «Перепройти»
function renderResultView(res, justFinished){
  const when = res.completed_at ? ' · пройден '+res.completed_at.slice(0,10) : '';
  app.innerHTML=`
    <h1>${PAGE_TITLE}</h1>
    <p class="sub">${PAGE_SUB}${when}</p>
    <div class="refer">${PAGE_FRAME}</div>
    ${resultRows()}
    ${justFinished?'<p class="sub" style="margin-top:16px"><span class="ok">Отправил боту — вернись в чат, я разберу.</span></p>':''}
    <div class="nav" style="margin-top:20px">
      <button class="btn ghost" id="retake">🔁 Перепройти</button>
      ${justFinished?'<button class="btn prim" onclick="Telegram.WebApp.close()">В чат</button>':''}
    </div>`;
  document.getElementById('retake').onclick=retake;
}

async function renderFinish(){
  const {factors,facets}=score();
  app.innerHTML=`<div class="center"><h1>Готово</h1><p class="sub">Считаю и сохраняю…</p></div>`;
  const completed_at=new Date().toISOString();
  const record={user_id:UID, block:'personality', instrument:'IPIP-HEXACO',
    scores:{factors,facets}, answers, completed_at};
  // 1) в Supabase (passport)
  await pushToSupabase(record);
  try{ localStorage.setItem(RESULT_KEY+'_pushed', completed_at); }catch(e){}
  // 2) боту (sendData)
  if(tg&&typeof tg.sendData==='function'){
    try{ tg.sendData(JSON.stringify({type:'personality',instrument:'IPIP-HEXACO',factors,facets})); }catch(e){}
  }
  // 3) сохранить результат локально (persist) + очистить прогресс
  const res={factors,facets,completed_at};
  // Сдвиг считаем по прошлому заходу и только потом запоминаем этот.
  makeShift(factors);
  try{ localStorage.setItem(RESULT_KEY, JSON.stringify(res)); }catch(e){}
  // Облако Telegram: результаты переживают очистку памяти телефона
  // и подтягиваются при заходе с другого устройства.
  try{
    tg?.CloudStorage?.setItem(CLOUD_KEY, JSON.stringify(res), ()=>{});
  }catch(e){}
  localStorage.removeItem(STORE_KEY);
  renderResultView(res, true);
}

// Вход. Приоритет: результат из URL (передал бот) → localStorage → тест.
let urlResult=null;
try{ const r=new URLSearchParams(location.search).get('r'); if(r) urlResult=JSON.parse(r); }catch(e){}
let savedResult=null;
try{ savedResult=JSON.parse(localStorage.getItem(RESULT_KEY)||'null'); }catch(e){}
// Подхват старого результата под ключом 'anon'
if(!savedResult||!savedResult.factors){
  try{ const a=JSON.parse(localStorage.getItem(RESULT_KEY.replace(CLIENT_ID,'anon'))||'null');
    if(a&&a.factors){ savedResult=a; localStorage.setItem(RESULT_KEY, JSON.stringify(a)); } }catch(e){}
}
const inProgress = Object.keys(answers).length>0;
if(urlResult && urlResult.factors && !inProgress){
  try{ localStorage.setItem(RESULT_KEY, JSON.stringify(urlResult)); }catch(e){}
  renderResultView(urlResult, false);
} else if(savedResult && !inProgress){
  // Досыл: результат есть локально, но мог не улететь в базу — отправить при открытии.
  const pk=RESULT_KEY+'_pushed';
  if(savedResult.factors && localStorage.getItem(pk)!==(savedResult.completed_at||'')){
    pushToSupabase({user_id:UID, block:'personality', instrument:'IPIP-HEXACO',
      scores:{factors:savedResult.factors, facets:savedResult.facets}, completed_at:savedResult.completed_at});
    try{ localStorage.setItem(pk, savedResult.completed_at||''); }catch(e){}
  }
  renderResultView(savedResult, false);
} else {
  render();
}

// Если локально пусто — пробуем поднять из облака Telegram.
// Экран трогаем, только когда человек ещё не начал отвечать.
try{
  const hasLocal = !!((urlResult&&urlResult.factors) || (savedResult&&savedResult.factors));
  if(!hasLocal && !inProgress && tg?.CloudStorage?.getItem){
    tg.CloudStorage.getItem(CLOUD_KEY, function(err, val){
      if(err || !val) return;
      try{
        const o = JSON.parse(val);
        if(o && o.factors && Object.keys(o.factors).length && Object.keys(answers).length===0){
          try{ localStorage.setItem(RESULT_KEY, JSON.stringify(o)); }catch(e){}
          renderResultView(o, false);
        }
      }catch(e){}
    });
  }
}catch(e){}
</script>
</body>
</html>
