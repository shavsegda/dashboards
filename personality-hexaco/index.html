<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Личность — HEXACO</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="items.js"></script>
<style>
  :root{
    --paper:#F4F2EC; --graphite:#1A1A1A; --terra:#B85C38;
    --muted:#7A756B; --rule:#E2DED4; --card:#FBFAF7;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--paper);color:var(--graphite);
    font-family:'Inter',-apple-system,system-ui,sans-serif;font-size:17px;line-height:1.5;}
  .wrap{max-width:620px;margin:0 auto;padding:20px 18px 40px;}
  h1{font-size:22px;margin:0 0 6px;font-weight:700;}
  .sub{color:var(--muted);font-size:14px;margin:0 0 20px;}
  .bar{height:6px;background:var(--rule);border-radius:6px;overflow:hidden;margin:0 0 4px;}
  .bar>i{display:block;height:100%;background:var(--terra);width:0;transition:width .25s;}
  .barlbl{color:var(--muted);font-size:12px;text-align:right;margin-bottom:22px;}
  .q{background:var(--card);border:1px solid var(--rule);border-radius:14px;
    padding:22px 18px;margin-bottom:16px;}
  .qtext{font-size:19px;font-weight:600;margin-bottom:18px;line-height:1.4;}
  .likert{display:flex;flex-direction:column;gap:9px;}
  .opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--rule);
    border-radius:10px;cursor:pointer;background:#fff;transition:.12s;font-size:15px;}
  .opt:active{transform:scale(.99);}
  .opt.sel{border-color:var(--terra);background:#FBEEE7;}
  .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--rule);flex:0 0 auto;}
  .opt.sel .dot{border-color:var(--terra);background:var(--terra);box-shadow:inset 0 0 0 3px #fff;}
  .nav{display:flex;gap:10px;margin-top:8px;}
  .btn{flex:1;padding:14px;border-radius:12px;border:none;font-size:16px;font-weight:600;
    font-family:inherit;cursor:pointer;}
  .btn.ghost{background:transparent;border:1.5px solid var(--rule);color:var(--graphite);}
  .btn.prim{background:var(--terra);color:#fff;}
  .btn:disabled{opacity:.4;pointer-events:none;}
  .center{text-align:center;padding:40px 0;}
  .resume{background:#FBEEE7;border:1px solid #EBD5C8;border-radius:12px;padding:14px;
    font-size:14px;margin-bottom:18px;color:#8A4527;}
  .res-factor{margin:0 0 16px;}
  .res-factor .fname{display:flex;justify-content:space-between;font-weight:700;margin-bottom:5px;}
  .res-bar{height:22px;background:var(--rule);border-radius:6px;overflow:hidden;}
  .res-bar>i{display:block;height:100%;background:var(--terra);}
  .res-facets{color:var(--muted);font-size:13px;margin-top:5px;}
  .ok{color:#2E7D32;font-weight:600;}
  .err{color:#C0392B;font-weight:600;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const FACTORS = window.HEXACO_FACTORS;
const ITEMS = window.HEXACO_ITEMS;

const LIKERT = [
  {v:1,l:'Совсем не про меня'},
  {v:2,l:'Скорее нет'},
  {v:3,l:'Когда как'},
  {v:4,l:'Скорее да'},
  {v:5,l:'Точно про меня'}
];

// ---- Telegram ----
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
const UID = tg?.initDataUnsafe?.user?.id || null;
const CLIENT_ID = UID ? ('tg_'+UID) : 'anon';
const STORE_KEY = 'hexaco_'+CLIENT_ID;

// ---- Supabase ----
const SUPABASE_URL = "https://tsregyrxtmkxrxvpsvot.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_yppYfhMVGsvSrFRxDij81w_7fO-1VSo";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---- Состояние + resume ----
let answers = {};   // {itemIndex: 1..5}
let idx = 0;
try{ const s=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');
  if(s.answers){answers=s.answers; idx=s.idx||0;} }catch(e){}
function save(){ try{localStorage.setItem(STORE_KEY,JSON.stringify({answers,idx}));}catch(e){} }

const app = document.getElementById('app');

function render(){
  const total = ITEMS.length;
  const done = Object.keys(answers).length;
  if(idx>=total){ return renderFinish(); }
  const it = ITEMS[idx];
  const cur = answers[idx];
  app.innerHTML = `
    <h1>Личность</h1>
    <p class="sub">Опросник HEXACO · ${total} утверждений · можно бросить и вернуться</p>
    <div class="bar"><i style="width:${Math.round(done/total*100)}%"></i></div>
    <div class="barlbl">${done} из ${total}</div>
    ${(idx===0&&done>0&&done<total)?'<div class="resume">Продолжаем с того места, где остановился.</div>':''}
    <div class="q">
      <div class="qtext">${it.t}</div>
      <div class="likert">
        ${LIKERT.map(o=>`<div class="opt ${cur===o.v?'sel':''}" data-v="${o.v}">
          <span class="dot"></span><span>${o.l}</span></div>`).join('')}
      </div>
    </div>
    <div class="nav">
      <button class="btn ghost" id="prev" ${idx===0?'disabled':''}>Назад</button>
      <button class="btn prim" id="next" ${cur==null?'disabled':''}>${idx===total-1?'Завершить':'Дальше'}</button>
    </div>`;
  app.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
    answers[idx]=+el.dataset.v; save(); render();
  });
  const nx=document.getElementById('next');
  if(nx) nx.onclick=()=>{ idx++; save(); window.scrollTo(0,0); render(); };
  const pv=document.getElementById('prev');
  if(pv) pv.onclick=()=>{ idx=Math.max(0,idx-1); save(); window.scrollTo(0,0); render(); };
}

// ---- Скоринг ----
function score(){
  const facetSum={}, facetN={}, factorSum={}, factorN={};
  ITEMS.forEach((it,i)=>{
    const raw=answers[i]; if(raw==null) return;
    const v = it.key===1 ? raw : (6-raw);          // реверс
    const fk = it.f+'·'+it.facet;
    facetSum[fk]=(facetSum[fk]||0)+v; facetN[fk]=(facetN[fk]||0)+1;
    factorSum[it.f]=(factorSum[it.f]||0)+v; factorN[it.f]=(factorN[it.f]||0)+1;
  });
  const factors={}, facets={};
  Object.keys(FACTORS).forEach(f=>{ if(factorN[f]) factors[f]=+(factorSum[f]/factorN[f]).toFixed(2); });
  Object.keys(facetSum).forEach(fk=>{ facets[fk]=+(facetSum[fk]/facetN[fk]).toFixed(2); });
  return {factors,facets};
}

async function renderFinish(){
  const {factors,facets}=score();
  app.innerHTML=`<div class="center"><h1>Готово</h1><p class="sub">Считаю и сохраняю…</p></div>`;
  const record={
    user_id: UID, block:'personality', instrument:'IPIP-HEXACO',
    scores:{factors,facets}, answers, completed_at:new Date().toISOString()
  };
  // 1) в Supabase (passport)
  let dbOk=false;
  try{ const {error}=await sb.from('passport').insert(record); dbOk=!error; }catch(e){}
  // 2) боту (sendData) — компактно
  let botOk=false;
  if(tg&&typeof tg.sendData==='function'){
    try{ tg.sendData(JSON.stringify({type:'personality',instrument:'IPIP-HEXACO',factors,facets})); botOk=true; }catch(e){}
  }
  localStorage.removeItem(STORE_KEY);
  // экран результата
  const rows=Object.keys(FACTORS).map(f=>{
    const val=factors[f]; if(val==null) return '';
    const pct=Math.round((val-1)/4*100);
    const fac=Object.keys(facets).filter(k=>k.startsWith(f+'·'))
      .map(k=>k.split('·')[1]+' '+facets[k]).join(' · ');
    return `<div class="res-factor"><div class="fname"><span>${FACTORS[f]}</span><span>${val}</span></div>
      <div class="res-bar"><i style="width:${pct}%"></i></div>
      <div class="res-facets">${fac}</div></div>`;
  }).join('');
  app.innerHTML=`
    <h1>Твоя личность</h1>
    <p class="sub">HEXACO · 1–5 по каждому фактору</p>
    ${rows}
    <p class="sub" style="margin-top:20px">${botOk?'<span class="ok">Результат отправлен — вернись в чат.</span>':(dbOk?'<span class="ok">Сохранено.</span>':'<span class="err">Открой тест через бота, чтобы сохранить.</span>')}</p>
    ${botOk?'<button class="btn prim" onclick="Telegram.WebApp.close()">Вернуться в чат</button>':''}`;
}

render();
</script>
</body>
</html>
